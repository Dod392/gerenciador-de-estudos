<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciador de Estudos</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0d11">
<style>
  :root{
    --bg:#0b0d11; --surface:#14171d; --card:#1a1e26;
    --fg:#e8eaed; --muted:#9aa0a6;
    --accent:#4f9dde; --accent-fg:#06121c;
    --ok:#3ecf8e; --warn:#e0a83e; --bad:#e05a4f;
    --border:#2a2f3a;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
    --radius-sm:8px; --radius:12px; --radius-lg:16px;
    --text-xs:12px; --text-sm:13px; --text-base:14px; --text-lg:16px; --text-xl:20px; --text-2xl:28px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 4px 16px rgba(0,0,0,.4);
    --tap:48px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  #app{max-width:480px;margin:0 auto;padding:var(--gap);}
  h1,h2,h3{margin:0 0 8px;}
  p{margin:0 0 8px;}
  .card{background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:var(--space-3);margin-bottom:var(--space-3);box-shadow:var(--shadow-sm);}
  button{font:inherit;min-height:var(--tap);border-radius:var(--radius);
    border:1px solid var(--border);background:var(--card);color:var(--fg);
    padding:0 16px;width:100%;margin-bottom:8px;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b0d10;font-weight:600;}
  button.ok{background:var(--ok);border-color:var(--ok);color:#0b0d10;}
  button.bad{background:var(--bad);border-color:var(--bad);color:#0b0d10;}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;margin-bottom:0;}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px;}
  input,select,textarea{width:100%;min-height:var(--tap);border-radius:var(--radius);
    border:1px solid var(--border);background:var(--bg);color:var(--fg);padding:0 12px;font:inherit;}
  textarea{padding:12px;min-height:80px;}
  nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;
    background:var(--card);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);z-index:10;}
  nav#tabs button{margin:0;border:none;border-radius:0;background:none;
    min-height:56px;font-size:12px;color:var(--muted);}
  nav#tabs button.active{color:var(--accent);font-weight:700;}
  small.muted{color:var(--muted);}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--border);}
  .badge.atrasado{background:var(--bad);color:#0b0d10;}
  button.badge{width:auto;min-height:32px;display:inline-block;margin:4px 8px 0 0;padding:2px 10px;font-size:12px;}

  #layout{display:flex;min-height:100vh;}
  #main{flex:1;min-width:0;}
  #app{max-width:1280px;margin:0 auto;padding:var(--space-6);}
  #sidebar{display:none;}
  #mais-sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;}
  #mais-sheet.hidden{display:none;}
  #mais-sheet .sheet-content{background:var(--surface);width:100%;border-radius:16px 16px 0 0;
    padding:var(--space-4);padding-bottom:calc(var(--space-4) + env(safe-area-inset-bottom));}
  #mais-sheet button{display:flex;align-items:center;gap:var(--space-3);justify-content:flex-start;text-align:left;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-4);}
  .grid-2{display:grid;grid-template-columns:1fr;gap:var(--space-4);}
  .stat-card{position:relative;}
  .stat-card .stat-label{font-size:var(--text-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .stat-value{font-size:var(--text-2xl);font-weight:650;margin-top:4px;}
  .stat-card .stat-icon{position:absolute;top:var(--space-4);right:var(--space-4);opacity:.5;font-size:18px;}
  .progress{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:6px;}
  .progress > i{display:block;height:100%;background:var(--accent);}
  table.data{width:100%;border-collapse:collapse;font-size:var(--text-sm);}
  table.data th{text-align:left;color:var(--muted);font-weight:600;font-size:var(--text-xs);
    text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--border);}
  table.data td{padding:8px;border-bottom:1px solid var(--border);}
  table.data tr:nth-child(even) td{background:rgba(255,255,255,.02);}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-4);}

  @media (min-width:900px){
    body{padding-bottom:0;}
    nav#tabs{display:none;}
    #mais-sheet{display:none !important;}
    #sidebar{display:flex;flex-direction:column;width:220px;flex-shrink:0;
      background:var(--surface);border-right:1px solid var(--border);
      padding:var(--space-4);position:sticky;top:0;height:100vh;box-sizing:border-box;}
    #sidebar.collapsed{width:64px;}
    #sidebar.collapsed .nav-label,#sidebar.collapsed .brand-text{display:none;}
    #sidebar-brand{font-weight:650;font-size:var(--text-lg);display:flex;gap:8px;align-items:center;}
    #sidebar-nav{display:flex;flex-direction:column;gap:4px;margin-top:var(--space-6);flex:1;}
    #sidebar-nav button{width:100%;min-height:44px;background:transparent;border:none;
      color:var(--muted);border-radius:var(--radius-sm);display:flex;align-items:center;
      gap:var(--space-3);text-align:left;padding:0 var(--space-3);}
    #sidebar-nav button.active{background:var(--card);color:var(--accent);font-weight:650;}
    #sidebar-toggle{background:transparent;border:1px solid var(--border);color:var(--muted);}
    .grid-2{grid-template-columns:1fr 1fr;}
  }

  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .week-day{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:8px 4px;text-align:center;}
  .week-day.feito{border-color:var(--ok);}
  .week-day-label{font-size:var(--text-xs);color:var(--muted);}
  .week-day-date{font-weight:650;font-size:var(--text-sm);margin:2px 0;}
  .week-day-badge{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .week-day-badge.ok{color:var(--ok);}
  @media(max-width:480px){.week-grid{gap:4px;} .week-day{padding:6px 2px;}}

  /* === HOJE (redesign) === */
  .hoje-header{display:flex;align-items:flex-start;gap:var(--space-3);}
  .hoje-header .hoje-header-icon{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .hoje-header h2{margin:0;text-transform:capitalize;}
  .hoje-header small{display:block;margin-top:2px;}
  .hoje-progress-label{display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--space-3);font-size:var(--text-sm);}
  .hoje-progress-label b{font-size:var(--text-lg);}

  .hero-card{border-color:var(--accent);}
  .hero-card .hero-eyebrow{font-size:var(--text-xs);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;font-weight:650;}
  .hero-card h3{margin:6px 0 2px;font-size:var(--text-xl);}
  .hero-card .hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 var(--space-3);}
  .hero-card button.primary{width:auto;padding:0 24px;}

  .status-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:var(--text-xs);font-weight:600;flex-shrink:0;}
  .status-pill.pendente{background:var(--border);color:var(--muted);}
  .status-pill.atrasada{background:var(--bad);color:var(--accent-fg);}
  .status-pill.concluida{background:var(--ok);color:var(--accent-fg);}

  .activity-list{display:flex;flex-direction:column;}
  .activity-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--border);}
  .activity-item:last-child{border-bottom:none;}
  .activity-item.concluida{opacity:.6;}
  .activity-item .activity-info{flex:1;min-width:0;}
  .activity-item .activity-title{font-weight:600;}
  .activity-item.concluida .activity-title{text-decoration:line-through;}
  .activity-item .activity-meta{font-size:var(--text-xs);color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .activity-item .activity-action{flex-shrink:0;width:auto;min-height:44px;padding:0 14px;margin:0;}

  .empty-state{text-align:center;padding:var(--space-6) var(--space-3);color:var(--muted);}
  .empty-state .empty-state-icon{font-size:28px;margin-bottom:8px;}
  .empty-state button{width:auto;margin:var(--space-3) auto 0;padding:0 20px;}

  .summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:var(--space-3);}
  .summary-strip .summary-item{text-align:center;}
  .summary-strip .summary-value{font-size:var(--text-xl);font-weight:650;}
  .summary-strip .summary-label{font-size:var(--text-xs);color:var(--muted);}

  .grid-hoje{display:grid;grid-template-columns:1fr;gap:var(--space-4);}
  @media(min-width:900px){.grid-hoje{grid-template-columns:2fr 1fr;align-items:start;}}

  .highlight-pulse{animation:pulseBorder 1.2s ease;}
  @keyframes pulseBorder{0%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:var(--shadow-sm);}}
</style>
</head>
<body>
  <div id="layout">
    <aside id="sidebar">
      <div id="sidebar-brand">📚 <span class="brand-text">Estudos</span></div>
      <nav id="sidebar-nav"></nav>
      <button id="sidebar-toggle" title="Recolher menu">«</button>
    </aside>
    <div id="main">
      <div id="app"></div>
    </div>
  </div>
  <nav id="tabs"></nav>
  <div id="mais-sheet" class="hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
  /* === HELPERS (Tarefa 2) === */
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function hojeISO(){ return new Date().toISOString().slice(0,10); }
  function addDays(iso, n){
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }
  function segundaFeiraDaSemana(iso){
    const d = new Date(iso + 'T00:00:00');
    const diaSemana = d.getDay(); // 0=domingo .. 6=sábado
    const offset = diaSemana === 0 ? -6 : 1 - diaSemana;
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0,10);
  }
  /* === STATE (Tarefa 2) === */
  const STORAGE_KEY = 'estudos_v1';
  const SEED_CONTEUDO = [
    'PNMA (6.938/81)','SNUC (9.985/00)','LC 140/2011','PNRH','CONAMA 357',
    'CONAMA 430','PNRS','NBR 10004','licenciamento ambiental',
    'abastecimento de água','tratamento de água','qualidade da água',
    'tratamento de esgoto','poluição hídrica','efluentes',
    'resíduos sólidos','Português','Inglês'
  ];

  function seedState(){
    return {
      meta: { provaData: '2026-11-29', cicloInicio: hojeISO() },
      checkins: [],
      erros: [],
      conteudo: SEED_CONTEUDO.map(assunto => ({ assunto, status:'nao_iniciado', concurso:'ambos', atualizadoEm: hojeISO() })),
      planejamento: [],
    };
  }

  function estadoValido(obj){
    return !!obj && typeof obj.meta === 'object' && obj.meta !== null &&
      Array.isArray(obj.checkins) && Array.isArray(obj.erros) &&
      Array.isArray(obj.conteudo) && Array.isArray(obj.planejamento);
  }

  function loadState(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return seedState();
      const parsed = JSON.parse(raw);
      if(!estadoValido(parsed)) return seedState();
      return parsed;
    } catch(e){
      return seedState();
    }
  }

  function saveState(s){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      return true;
    } catch(e){
      alert('Não foi possível salvar: armazenamento indisponível ou cheio.');
      return false;
    }
  }

  let state = loadState();
  /* === HOJE (Tarefa 3) === */
  function diasAte(hojeIso, alvoIso){
    const a = new Date(hojeIso + 'T00:00:00');
    const b = new Date(alvoIso + 'T00:00:00');
    return Math.round((b - a) / 86400000);
  }

  function registrarCheckin(state, data, status){
    const idx = state.checkins.findIndex(c => c.data === data);
    if(idx === -1){
      state.checkins.push({ data, status, minutos:null, assunto:null, questoes:null, acertos:null, obs:'' });
    } else {
      state.checkins[idx].status = status;
    }
    return state;
  }

  function checkinDeHoje(){
    return state.checkins.find(c => c.data === hojeISO());
  }

  /* === ERROS (Tarefa 4) === */
  const GRAU_ORDEM = ['deficiencia','erro_novo','reforcado','corrigido'];
  const GRAU_DIAS = { deficiencia:1, erro_novo:2, reforcado:7, corrigido:21 };
  const GRAU_LABEL = { deficiencia:'deficiência confirmada', erro_novo:'erro novo', reforcado:'reforçado', corrigido:'corrigido' };

  function criarErro(state, {assunto, oQueErrei, regraCorreta}){
    const hoje = hojeISO();
    const erro = {
      id: String(Date.now()) + Math.random().toString(36).slice(2,7),
      assunto, oQueErrei, regraCorreta,
      grau: 'erro_novo',
      proximaRevisao: addDays(hoje, GRAU_DIAS.erro_novo),
      criadoEm: hoje,
    };
    state.erros.push(erro);
    return erro;
  }

  function graduarAcerto(erro){
    const i = GRAU_ORDEM.indexOf(erro.grau);
    const novoGrau = i < GRAU_ORDEM.length - 1 ? GRAU_ORDEM[i+1] : erro.grau;
    erro.grau = novoGrau;
    erro.proximaRevisao = addDays(hojeISO(), GRAU_DIAS[novoGrau]);
    return erro;
  }

  function graduarErro(erro){
    erro.grau = 'deficiencia';
    erro.proximaRevisao = addDays(hojeISO(), GRAU_DIAS.deficiencia);
    return erro;
  }

  function ordenarErrosPorRevisao(erros){
    return [...erros].sort((a,b) => a.proximaRevisao < b.proximaRevisao ? -1 : a.proximaRevisao > b.proximaRevisao ? 1 : 0);
  }

  function filaRevisao(erros, hojeIso){
    return ordenarErrosPorRevisao(erros.filter(e => e.proximaRevisao <= hojeIso));
  }

  function cardErro(e){
    const atrasado = e.proximaRevisao <= hojeISO();
    return `
      <div class="card" data-erro-id="${e.id}">
        <b>${escapeHtml(e.assunto)}</b>
        <span class="badge ${atrasado?'atrasado':''}">${GRAU_LABEL[e.grau]} — próx. ${e.proximaRevisao}</span>
        <p><small class="muted">${escapeHtml(e.oQueErrei)}</small></p>
        <div class="row">
          <button class="ok" data-acertei="${e.id}">Acertei</button>
          <button class="bad" data-errei="${e.id}">Errei</button>
        </div>
      </div>`;
  }
  /* === MAPA (Tarefa 6) === */
  const STATUS_CONTEUDO_ORDEM = ['nao_iniciado','estudado','revisado','dominado'];
  const STATUS_CONTEUDO_LABEL = { nao_iniciado:'não iniciado', estudado:'estudado', revisado:'revisado', dominado:'dominado' };
  const CONCURSO_ORDEM = ['ambos','transpetro','inea'];
  const CONCURSO_LABEL = { ambos:'Transpetro + INEA', transpetro:'Transpetro', inea:'INEA' };

  function proximoStatusConteudo(atual){
    const i = STATUS_CONTEUDO_ORDEM.indexOf(atual);
    return STATUS_CONTEUDO_ORDEM[(i+1) % STATUS_CONTEUDO_ORDEM.length];
  }
  function proximoConcurso(atual){
    const i = CONCURSO_ORDEM.indexOf(atual);
    return CONCURSO_ORDEM[(i+1) % CONCURSO_ORDEM.length];
  }

  function renderMapa(){
    return `<div class="card"><h2>Mapa de Conteúdo</h2><small class="muted">Toque no status pra avançar; toque no concurso pra trocar.</small></div>` +
      `<div class="card-grid">` +
      state.conteudo.map((c, i) => `
        <div class="card">
          <b>${escapeHtml(c.assunto)}</b><br>
          <button data-status-idx="${i}" class="badge">${STATUS_CONTEUDO_LABEL[c.status]}</button>
          <button data-concurso-idx="${i}" class="badge">${CONCURSO_LABEL[c.concurso]}</button>
        </div>`).join('') +
      `</div>`;
  }

  function attachMapaHandlers(){
    const app = document.getElementById('app');
    app.querySelectorAll('button[data-status-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = state.conteudo[Number(btn.dataset.statusIdx)];
        c.status = proximoStatusConteudo(c.status);
        c.atualizadoEm = hojeISO();
        saveState(state);
        render();
      });
    });
    app.querySelectorAll('button[data-concurso-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = state.conteudo[Number(btn.dataset.concursoIdx)];
        c.concurso = proximoConcurso(c.concurso);
        saveState(state);
        render();
      });
    });
  }

  /* === SEMANA (Tarefa 7) === */
  function semanaAtualId(){
    return segundaFeiraDaSemana(hojeISO());
  }

  function obterPlano(state, semanaId){
    return state.planejamento.find(p => p.semanaId === semanaId);
  }

  function salvarPlano(state, semanaId, {assuntosAlvo, diasAlvo, horasAlvo}){
    const existente = obterPlano(state, semanaId);
    if(existente){
      existente.assuntosAlvo = assuntosAlvo;
      existente.diasAlvo = diasAlvo;
      existente.horasAlvo = horasAlvo;
      return existente;
    }
    const novo = { semanaId, assuntosAlvo, diasAlvo, horasAlvo };
    state.planejamento.push(novo);
    return novo;
  }

  function dentroDaSemana(dataIso, semanaId){
    return dataIso >= semanaId && dataIso <= addDays(semanaId, 6);
  }

  function diasRealizadosNaSemana(checkins, semanaId){
    return checkins.filter(c => c.status !== 'nao' && dentroDaSemana(c.data, semanaId)).length;
  }

  function horasRealizadasNaSemana(checkins, semanaId){
    const minutos = checkins
      .filter(c => dentroDaSemana(c.data, semanaId))
      .reduce((soma, c) => soma + (c.minutos ?? (c.status === 'base' ? 150 : 0)), 0);
    return Math.round((minutos / 60) * 10) / 10;
  }

  function assuntosTocadosNaSemana(state, semanaId){
    const doCheckin = state.checkins
      .filter(c => dentroDaSemana(c.data, semanaId) && c.assunto)
      .map(c => c.assunto);
    const doMapa = state.conteudo
      .filter(c => c.atualizadoEm && dentroDaSemana(c.atualizadoEm, semanaId))
      .map(c => c.assunto);
    return [...new Set([...doCheckin, ...doMapa])];
  }

  function assuntosAtrasadosNaSemana(assuntosAlvo, tocados){
    return assuntosAlvo.filter(a => !tocados.includes(a));
  }

  /* === DESEMPENHO (Tarefa 8) === */
  function agregarPorAssunto(checkins){
    const map = new Map();
    for(const c of checkins){
      if(!c.assunto || !c.questoes) continue;
      const cur = map.get(c.assunto) || {assunto:c.assunto, questoes:0, acertos:0};
      cur.questoes += c.questoes;
      cur.acertos += c.acertos || 0;
      map.set(c.assunto, cur);
    }
    return [...map.values()].map(x => ({...x, pct: x.questoes ? Math.round((x.acertos/x.questoes)*100) : 0}));
  }

  function diasEstudados(checkins){
    return checkins.filter(c => c.status !== 'nao').length;
  }

  function diasDeCiclo(cicloInicioIso, hojeIso){
    const a = new Date(cicloInicioIso + 'T00:00:00');
    const b = new Date(hojeIso + 'T00:00:00');
    return Math.round((b - a) / 86400000) + 1;
  }

  function piores5(agregado){
    return [...agregado].filter(a => a.questoes > 0).sort((a,b) => a.pct - b.pct).slice(0,5);
  }

  function totalQuestoes(checkins){ return checkins.reduce((s,c) => s + (c.questoes||0), 0); }
  function totalHorasEstudadas(checkins){
    const minutos = checkins.reduce((s,c) => s + (c.minutos ?? (c.status === 'base' ? 150 : 0)), 0);
    return Math.round((minutos/60)*10)/10;
  }

  /* === EXPORT (Tarefa 9) === */
  function gerarMarkdownSnapshot(state, hojeIso){
    const agregado = agregarPorAssunto(state.checkins);
    const estudados = diasEstudados(state.checkins);
    const ciclo = diasDeCiclo(state.meta.cicloInicio, hojeIso);
    const piores = piores5(agregado);
    const atrasados = filaRevisao(state.erros, hojeIso);
    const semanaId = semanaAtualId();
    const plano = obterPlano(state, semanaId);

    linhas.push('');

  function baixarArquivo(nome, conteudo, tipo){
    const blob = new Blob([conteudo], {type: tipo});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importarJSON(texto){
    const parsed = JSON.parse(texto);
    if(!estadoValido(parsed)){
      throw new Error('JSON inválido: formato inesperado');
    }
    state = parsed;
    saveState(state);
    return state;
  }

  function tentarImportar(texto){
    if(!confirm('Importar vai substituir todos os dados atuais. Continuar?')) return false;
    try { importarJSON(texto); render(); return true; }
    catch(err){ alert('Falha ao importar: ' + err.message); return false; }
  }

  function copiarTexto(texto){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(
        () => alert('JSON copiado! Cole em um app de notas/mensagens pra guardar, ou direto no campo "colar JSON" no outro aparelho.'),
        () => copiarTextoFallback(texto)
      );
    } else {
      copiarTextoFallback(texto);
    }
  }

  function copiarTextoFallback(texto){
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try {
      document.execCommand('copy');
      alert('JSON copiado! Cole em um app de notas/mensagens pra guardar, ou direto no campo "colar JSON" no outro aparelho.');
    } catch(e){
      alert('Não foi possível copiar automaticamente. Selecione o texto exportado manualmente.');
    }
    document.body.removeChild(ta);
  }

  function calcularSequencia(checkins, hojeIso){
    const estudados = new Set(checkins.filter(c => c.status !== 'nao').map(c => c.data));
    let dia = hojeIso;
    if(!estudados.has(dia)) dia = addDays(dia, -1);
    let sequencia = 0;
    while(estudados.has(dia)){ sequencia++; dia = addDays(dia, -1); }
    return sequencia;
  }
  function pctCronograma(conteudo){
    if(!conteudo.length) return 0;
    const tocados = conteudo.filter(c => c.status !== 'nao_iniciado').length;
    return Math.round((tocados / conteudo.length) * 100);
  }
  function horasNoDia(checkins, dataIso){
    const c = checkins.find(x => x.data === dataIso);
    if(!c) return 0;
    const minutos = c.minutos ?? (c.status === 'base' ? 150 : 0);
    return Math.round((minutos/60)*10)/10;
  }
  function horasPorDiaDaSemana(checkins, semanaId){
    const dias = [];
    for(let i=0;i<7;i++) dias.push(horasNoDia(checkins, addDays(semanaId, i)));
    return dias;
  }
  function melhores5(agregado){
    return [...agregado].filter(a => a.questoes > 0).sort((a,b) => b.pct - a.pct).slice(0,5);
  }
  function evolucaoSemanal(checkins, hojeIso, numSemanas){
    const semanaFim = segundaFeiraDaSemana(hojeIso);
    const buckets = [];
    for(let i = numSemanas - 1; i >= 0; i--){
      const semanaId = addDays(semanaFim, -7*i);
      const fimSemana = addDays(semanaId, 6);
      const doSemana = checkins.filter(c => c.data >= semanaId && c.data <= fimSemana && c.questoes);
      const questoes = doSemana.reduce((s,c) => s + c.questoes, 0);
      const acertos = doSemana.reduce((s,c) => s + (c.acertos||0), 0);
      buckets.push({ semanaId, pct: questoes ? Math.round((acertos/questoes)*100) : null });
    }
    return buckets;
  }

            <div class="week-day ${d.feito?'feito':''}">
              <div class="week-day-label">${d.label}</div>
              <div class="week-day-date">${d.dataIso.slice(8,10)}</div>
              <div class="week-day-badge ${d.feito?'ok':''}">${d.feito ? `✓${d.assunto?` ${escapeHtml(d.assunto.slice(0,14))}`:''}` : '—'}</div>
            </div>`).join('')}
        </div>
      </div>`;

    if(!plano){
      return `
        <div class="card">
          <h2>Semana de ${semanaId} a ${fimSemana}</h2>
          <p class="muted">Nenhuma meta definida ainda.</p>
        </div>
        ${gradeHtml}
        <div class="card">
          <h3>Definir meta da semana</h3>
          <label>Assuntos-alvo</label>
          <select id="semana-assuntos" multiple size="6">
            ${state.conteudo.map(c => `<option value="${escapeHtml(c.assunto)}">${escapeHtml(c.assunto)}</option>`).join('')}
          </select>
          <label>Dias-alvo</label>
          <input type="number" id="semana-dias" value="5">
          <label>Horas-alvo</label>
          <input type="number" id="semana-horas" value="12">
          <button id="semana-salvar" class="primary">Salvar meta</button>
        </div>
      `;
    }

    const diasFeitos = diasRealizadosNaSemana(state.checkins, semanaId);
    const horasFeitas = horasRealizadasNaSemana(state.checkins, semanaId);
    const tocados = assuntosTocadosNaSemana(state, semanaId);
    const atrasados = assuntosAtrasadosNaSemana(plano.assuntosAlvo, tocados);

    return `
      <div class="card">
        <h2>Semana de ${semanaId} a ${fimSemana}</h2>
        <p>Dias: ${diasFeitos}/${plano.diasAlvo}</p>
        <div class="progress"><i style="width:${Math.min(100, plano.diasAlvo ? Math.round(diasFeitos/plano.diasAlvo*100) : 0)}%"></i></div>
        <p>Horas: ${horasFeitas}h/${plano.horasAlvo}h</p>
        <div class="progress"><i style="width:${Math.min(100, plano.horasAlvo ? Math.round(horasFeitas/plano.horasAlvo*100) : 0)}%"></i></div>
      </div>
      ${gradeHtml}
      <div class="card">
        <h3>Assuntos-alvo</h3>
        ${plano.assuntosAlvo.map(a => `<p>${atrasados.includes(a) ? '⏳' : '✅'} ${escapeHtml(a)}</p>`).join('')}
      </div>
      <div class="card">
        <details>
          <summary>Editar meta</summary>
          <label>Assuntos-alvo</label>
          <select id="semana-assuntos" multiple size="6">
            ${state.conteudo.map(c => `<option value="${escapeHtml(c.assunto)}" ${plano.assuntosAlvo.includes(c.assunto)?'selected':''}>${escapeHtml(c.assunto)}</option>`).join('')}
          </select>
          <label>Dias-alvo</label>
          <input type="number" id="semana-dias" value="${plano.diasAlvo}">
          <label>Horas-alvo</label>
          <input type="number" id="semana-horas" value="${plano.horasAlvo}">
          <button id="semana-salvar" class="primary">Salvar meta</button>
        </details>
      </div>
    `;
  }

  function attachPlanejamentoHandlers(){
    const salvar = document.getElementById('semana-salvar');
    if(!salvar) return;
    salvar.addEventListener('click', () => {
      const assuntosAlvo = [...document.getElementById('semana-assuntos').selectedOptions].map(o => o.value);
      const diasAlvo = Number(document.getElementById('semana-dias').value) || 0;
      const horasAlvo = Number(document.getElementById('semana-horas').value) || 0;
      salvarPlano(state, semanaAtualId(), { assuntosAlvo, diasAlvo, horasAlvo });
      saveState(state);
      render();
    });
  }
  function renderDesempenho(){
    const agregado = agregarPorAssunto(state.checkins);
    const estudados = diasEstudados(state.checkins);
    const ciclo = diasDeCiclo(state.meta.cicloInicio, hojeISO());
    const piores = piores5(agregado);
    const melhores = melhores5(agregado);
    return `
      <div class="card">
        <h2>Desempenho</h2>
        <p>${estudados} de ${ciclo} dias do ciclo estudados</p>
      </div>
      <div class="kpi-grid">
        <div class="card stat-card"><div class="stat-label">Total de questões</div><div class="stat-value">${totalQuestoes(state.checkins)}</div><div class="stat-icon">❓</div></div>
        <div class="card stat-card"><div class="stat-label">Horas estudadas</div><div class="stat-value">${totalHorasEstudadas(state.checkins)}h</div><div class="stat-icon">⏱️</div></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <h3>% de acerto por disciplina</h3>
          ${agregado.length ? `<canvas id="chart-por-assunto" height="${Math.max(120, agregado.length*32)}"></canvas>` : '<p class="muted">Sem questões registradas ainda.</p>'}
        </div>
        <div class="card">
          <h3>Evolução do desempenho</h3>
          <canvas id="chart-evolucao" height="200"></canvas>
        </div>
        <div class="card">
          <h3>Melhores assuntos</h3>
          ${melhores.length ? melhores.map(p=>`<p>${escapeHtml(p.assunto)} — ${p.pct}%</p>`).join('') : '<p class="muted">Sem dados suficientes.</p>'}
        </div>
        <div class="card">
          <h3>Piores assuntos</h3>
          ${piores.length ? piores.map(p=>`<p>${escapeHtml(p.assunto)} — ${p.pct}%</p>`).join('') : '<p class="muted">Sem dados suficientes.</p>'}
        </div>
      </div>
    `;
  }

  function attachDesempenhoHandlers(){
    const agregado = agregarPorAssunto(state.checkins);
    if(agregado.length){
      criarOuAtualizarChart('chart-por-assunto', {
        type: 'bar',
        data: { labels: agregado.map(a=>a.assunto), datasets:[{ data: agregado.map(a=>a.pct), backgroundColor: corAccent() }] },
        options: {
          indexAxis:'y', responsive:true, plugins:{legend:{display:false}},
          scales:{
            x:{min:0,max:100, ticks:{color:'#9aa0a6'}, grid:{color:'#2a2f3a'}},
            y:{ticks:{color:'#9aa0a6'}, grid:{display:false}}
          }
        }
      });
    }
    const evolucao = evolucaoSemanal(state.checkins, hojeISO(), 12);
    criarOuAtualizarChart('chart-evolucao', {
      type: 'line',
      data: {
        labels: evolucao.map(b => b.semanaId.slice(5)),
        datasets: [{ data: evolucao.map(b => b.pct), spanGaps:false, borderColor: corAccent(), backgroundColor:'transparent', tension:.3 }]
      },
      options: {
        responsive:true, plugins:{legend:{display:false}},
        scales:{
          y:{min:0,max:100, ticks:{color:'#9aa0a6'}, grid:{color:'#2a2f3a'}},
          x:{ticks:{color:'#9aa0a6'}, grid:{display:false}}
        }
      }
    });
  }

  function renderScreen(){
    const app = document.getElementById('app');
    const openIdx = [...app.querySelectorAll('details')].reduce((acc,d,i)=>{ if(d.open) acc.push(i); return acc; }, []);
    const fieldValues = {};
    app.querySelectorAll('details input, details select, details textarea').forEach(el => { if(el.id) fieldValues[el.id] = el.value; });

    const map = {hoje:renderHoje, erros:renderErros, mapa:renderMapa, desempenho:renderDesempenho, dashboard:renderDashboard, config:renderConfig, planejamento:renderPlanejamento};
    app.innerHTML = map[currentTab]();
    if(currentTab==='hoje') attachHojeHandlers();
    if(currentTab==='erros') attachErrosHandlers();
    if(currentTab==='mapa') attachMapaHandlers();
    if(currentTab==='dashboard') attachDashboardHandlers();
    if(currentTab==='config') attachConfigHandlers();
    if(currentTab==='planejamento') attachPlanejamentoHandlers();
    if(currentTab==='desempenho') attachDesempenhoHandlers();

    app.querySelectorAll('details').forEach((d,i) => { if(openIdx.includes(i)) d.open = true; });
    Object.entries(fieldValues).forEach(([id,val]) => { const el = document.getElementById(id); if(el) el.value = val; });
  }

  function render(){ renderSidebar(); renderTabsNav(); renderScreen(); }

  attachSidebarHandlers();
  attachTabsHandlers();

  /* === INIT === */
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => reg.update())
        .catch(err => console.warn('SW falhou:', err));
    });
  }

  render();
  </script>
</body>
</html>
