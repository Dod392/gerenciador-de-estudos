<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciador de Estudos</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f5f6fa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Lumen — painel claro e denso, violeta como único motor de interação (ver DESIGN.md) */
    --bg:#f5f6fa; --surface:#ffffff; --card:#ffffff;
    --fg:#14161c; --muted:#5a6478;
    --accent:#6246e8; --accent-hover:#5238d6; --accent-soft:#efebff; --accent-fg:#ffffff;
    --ok:#05805a; --ok-soft:#e3f5ee; --warn:#a9640b; --warn-soft:#fdf1df; --bad:#c81e2c; --bad-soft:#fce9ea;
    --border:#e5e7f0; --border-strong:#cbcfde;
    --subject-1:#6246e8; --subject-2:#0e8f9e; --subject-3:#c2410c;
    --subject-4:#1d6fd6; --subject-5:#9333a8; --subject-6:#4d7c0f;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
    --radius-sm:8px; --radius:12px; --radius-lg:16px;
    --text-xs:12px; --text-sm:13px; --text-base:15px; --text-lg:16px; --text-xl:20px; --text-2xl:28px;
    --shadow-sm:0 1px 2px rgba(20,22,28,.04), 0 4px 12px rgba(20,22,28,.04);
    --shadow:0 12px 32px rgba(20,22,28,.14);
    --tap:44px;
    --font-display:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:'Inter',system-ui,sans-serif;
    --hoje-border:#e5e7f0; --hoje-shadow-card:var(--shadow-sm); --hoje-text-secondary:#5a6478;
    --status-not-started:#5a6478; --status-in-progress:#a9640b; --status-review:#9333a8; --status-completed:#05805a;
    --status-pending:#a9640b; --status-reviewed:#05805a; --status-high-priority:#c81e2c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:var(--font-body);font-variant-numeric:tabular-nums;}
  h1,h2,h3{font-family:var(--font-display);letter-spacing:-0.02em;font-weight:700;}
  .stat-value{font-family:var(--font-mono);font-weight:700;letter-spacing:-0.03em;}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  #app{max-width:480px;margin:0 auto;padding:var(--gap);}
  h1,h2,h3{margin:0 0 8px;}
  p{margin:0 0 8px;}
  .card{background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:var(--space-3);margin-bottom:var(--space-3);box-shadow:var(--shadow-sm);}
  button{font:inherit;min-height:var(--tap);border-radius:var(--radius);
    border:1px solid var(--border);background:var(--card);color:var(--fg);
    padding:0 16px;width:100%;margin-bottom:8px;}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600;}
  button.ok{background:var(--ok);border-color:var(--ok);color:var(--accent-fg);}
  button.bad{background:var(--bad);border-color:var(--bad);color:var(--accent-fg);}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;margin-bottom:0;}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px;}
  input,select,textarea{width:100%;min-height:var(--tap);border-radius:var(--radius);
    border:1px solid var(--border);background:var(--bg);color:var(--fg);padding:0 12px;font:inherit;}
  textarea{padding:12px;min-height:80px;}
  nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;
    background:var(--card);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);z-index:10;}
  nav#tabs button{margin:0;border:none;border-radius:0;background:none;
    min-height:56px;font-size:12px;color:var(--muted);}
  nav#tabs button.active{color:var(--accent);font-weight:700;}
  small.muted{color:var(--muted);}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--border);}
  .badge.atrasado{background:var(--bad);color:#0b0d10;}
  button.badge{width:auto;min-height:32px;display:inline-block;margin:4px 8px 0 0;padding:2px 10px;font-size:12px;}

  #layout{display:flex;min-height:100vh;}
  #main{flex:1;min-width:0;}
  #app{max-width:1180px;margin:0 auto;padding:var(--space-6);}
  #sidebar{display:none;}
  #mais-sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;}
  #mais-sheet.hidden{display:none;}
  #mais-sheet .sheet-content{background:var(--surface);width:100%;border-radius:16px 16px 0 0;
    padding:var(--space-4);padding-bottom:calc(var(--space-4) + env(safe-area-inset-bottom));}
  #mais-sheet button{display:flex;align-items:center;gap:var(--space-3);justify-content:flex-start;text-align:left;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-4);}
  .grid-2{display:grid;grid-template-columns:1fr;gap:var(--space-4);}
  .grid-2 > *{min-width:0;}
  .stat-card{position:relative;}
  .stat-card .stat-label{font-size:var(--text-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .stat-value{font-size:var(--text-2xl);font-weight:650;margin-top:4px;}
  .icone{display:inline-block;vertical-align:-3px;flex-shrink:0;}
  .disciplina-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;flex-shrink:0;}
  .historico-import-list{display:flex;flex-direction:column;}
  .historico-import-item{padding:var(--space-2) 0;border-bottom:1px solid var(--border);}
  .historico-import-item:last-child{border-bottom:none;}
  .historico-import-info b{display:block;font-size:var(--text-sm);}
  .historico-import-info small{display:block;margin-top:2px;}
  .stat-card .stat-icon{position:absolute;top:var(--space-4);right:var(--space-4);opacity:.5;font-size:18px;}
  .stat-icon .icone{width:18px;height:18px;}
  .empty-state-icon .icone{width:24px;height:24px;}
  .dashboard-quick-icon .icone,.config-action-icon .icone{width:20px;height:20px;}
  .hoje-header-icon .icone{width:20px;height:20px;}
  .item-icon .icone{width:18px;height:18px;}
  .progress{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:6px;}
  .progress > i{display:block;height:100%;background:var(--accent);}
  table.data{width:100%;border-collapse:collapse;font-size:var(--text-sm);}
  table.data th{text-align:left;color:var(--muted);font-weight:600;font-size:var(--text-xs);
    text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--border);}
  table.data td{padding:8px;border-bottom:1px solid var(--border);}
  table.data tr:nth-child(even) td{background:rgba(128,128,128,.07);}
  .table-wrap{overflow-x:auto;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-4);}

  @media (min-width:900px){
    body{padding-bottom:0;}
    nav#tabs{display:none;}
    #mais-sheet{display:none !important;}
    #sidebar{display:flex;flex-direction:column;width:220px;flex-shrink:0;
      background:var(--surface);border-right:1px solid var(--border);
      padding:var(--space-4);position:sticky;top:0;height:100vh;box-sizing:border-box;}
    #sidebar.collapsed{width:64px;}
    #sidebar.collapsed .nav-label,#sidebar.collapsed .brand-text{display:none;}
    #sidebar-brand{font-weight:650;font-size:var(--text-lg);display:flex;gap:8px;align-items:center;}
    #sidebar-nav{display:flex;flex-direction:column;gap:4px;margin-top:var(--space-6);flex:1;}
    #sidebar-nav button{width:100%;min-height:44px;background:transparent;border:none;
      color:var(--muted);border-radius:var(--radius-sm);display:flex;align-items:center;
      gap:var(--space-3);text-align:left;padding:0 var(--space-3);}
    #sidebar-nav button.active{background:var(--card);color:var(--accent);font-weight:650;}
    #sidebar-toggle{background:transparent;border:1px solid var(--border);color:var(--muted);}
    .grid-2{grid-template-columns:1fr 1fr;}
  }

  /* === PLANEJAMENTO (redesign) === */
  .planejamento-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3);}
  .planejamento-header{display:flex;align-items:flex-start;gap:var(--space-3);}
  .planejamento-nav{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:2px;}
  .planejamento-nav b{font-size:var(--text-sm);font-weight:600;color:var(--muted);}
  .planejamento-badges{margin-top:var(--space-3);}
  .planejamento-progresso{margin-top:var(--space-3);}
  .planejamento-progresso-label{display:flex;justify-content:space-between;font-size:var(--text-sm);margin-top:var(--space-2);}
  .planejamento-progresso-label span{color:var(--muted);}

  .dia-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-2);}
  @media(max-width:900px){.dia-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:560px){.dia-grid{grid-template-columns:repeat(2,1fr);}}
  .dia-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-sm);padding:var(--space-2);display:flex;flex-direction:column;gap:var(--space-1);min-height:120px;}
  .dia-card.hoje{border-color:var(--accent);}
  .dia-card-header{text-align:center;padding-bottom:4px;border-bottom:1px solid var(--border);}
  .dia-card-label{font-size:var(--text-xs);color:var(--muted);font-weight:650;}
  .dia-card-date{font-size:var(--text-sm);font-weight:650;}
  .dia-card-total{font-size:10px;color:var(--muted);}
  .dia-card-meta-row{margin:2px 0;}
  .dia-card-meta-input{width:100%;min-height:26px;height:26px;padding:0 6px;font-size:10px;
    border-radius:6px;text-align:center;}
  .dia-card-atividades{display:flex;flex-direction:column;gap:4px;flex:1;}
  .dia-atividade{display:flex;align-items:flex-start;gap:4px;background:var(--card);border-radius:var(--radius-sm);padding:4px;}
  .dia-atividade.concluida .dia-atividade-assunto{text-decoration:line-through;color:var(--muted);}
  .dia-atividade-check{width:20px;height:20px;min-height:20px;flex-shrink:0;padding:0;margin:2px 0 0;
    border-radius:50%;font-size:11px;line-height:1;color:var(--ok);border-color:var(--ok);}
  .dia-atividade-info{flex:1;min-width:0;}
  .dia-atividade-assunto{font-size:var(--text-xs);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dia-atividade-meta{font-size:10px;color:var(--muted);}
  .dia-atividade-remover{width:18px;height:18px;min-height:18px;flex-shrink:0;padding:0;margin:2px 0 0;
    border:none;background:transparent;color:var(--muted);font-size:14px;line-height:1;}
  .dia-card-add{width:100%;min-height:32px;font-size:var(--text-xs);background:transparent;color:var(--accent);
    border:1px dashed var(--border);margin:0;padding:0;}

  .assunto-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-2);}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:4px 6px 4px 12px;font-size:var(--text-sm);}
  .chip.atrasado{border-color:var(--warn);}
  .chip button{width:20px;height:20px;min-height:20px;flex-shrink:0;padding:0;margin:0;border:none;
    background:var(--border);border-radius:50%;font-size:13px;line-height:1;color:var(--fg);}
  .chip-sugestao{width:auto;min-height:28px;padding:4px 12px;margin:0;border-radius:999px;
    font-size:var(--text-xs);background:transparent;border:1px dashed var(--border);color:var(--muted);}
  .chip-sugestao:hover{border-color:var(--accent);color:var(--accent);}

  .dias-checkbox-row{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-2);}
  .dia-checkbox{display:flex;align-items:center;gap:6px;width:auto;font-size:var(--text-sm);color:var(--fg);margin:0;}
  .dia-checkbox input{width:auto;min-height:auto;flex-shrink:0;}
  .meta-opcionais{margin:var(--space-3) 0;border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);}
  .meta-opcionais summary{cursor:pointer;font-size:var(--text-sm);color:var(--muted);}

  .resumo-meta-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--border);}
  .resumo-meta-item:last-child{border-bottom:none;}
  .resumo-meta-item .stat-icon{font-size:20px;opacity:.8;}

  /* === MAPA (redesign) === */
  .mapa-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3);}
  .mapa-busca{flex:0 1 280px;min-width:200px;}
  .mapa-busca input{margin:0;}
  .mapa-filtros-row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2);}
  .mapa-filtros-label{font-size:var(--text-sm);color:var(--muted);flex:0 0 auto;}
  .mapa-filtros-botoes{display:flex;gap:6px;flex-wrap:wrap;}
  .mapa-filtro-btn{width:auto;min-height:32px;padding:0 12px;margin:0;font-size:var(--text-xs);
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;}
  .mapa-filtro-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600;}
  .mapa-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor;}
  .mapa-filtro-btn[data-filtro-status="nao_iniciado"] .mapa-dot{color:var(--status-not-started);}
  .mapa-filtro-btn[data-filtro-status="estudado"] .mapa-dot{color:var(--status-in-progress);}
  .mapa-filtro-btn[data-filtro-status="revisado"] .mapa-dot{color:var(--status-review);}
  .mapa-filtro-btn[data-filtro-status="dominado"] .mapa-dot{color:var(--status-completed);}
  .mapa-resumo-grid{margin-top:var(--space-4);}

  .mapa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);margin-bottom:var(--space-3);}
  @media(max-width:1100px){.mapa-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.mapa-grid{grid-template-columns:1fr;}}
  .mapa-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:var(--space-3);position:relative;transition:background .15s;}
  .mapa-card:hover{background:var(--surface);}
  .mapa-card-icon{font-size:22px;margin-bottom:6px;}
  .mapa-card-nome{font-weight:650;font-size:var(--text-base);margin-bottom:8px;padding-right:36px;}
  .mapa-status-badge{display:inline-block;margin-bottom:6px;border:none;}
  .mapa-status-badge.status-not-started{background:var(--status-not-started);color:#fff;}
  .mapa-status-badge.status-in-progress{background:var(--status-in-progress);color:#1a1206;}
  .mapa-status-badge.status-review{background:var(--status-review);color:#fff;}
  .selo{background:var(--ok-soft) !important;color:var(--ok);font-weight:600;}
  .mapa-status-badge.status-completed{background:var(--ok-soft);color:var(--ok);}
  .mapa-card-concursos{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .mapa-concurso-badge{background:rgba(79,157,222,.18);color:var(--accent);border:none;}
  .mapa-card-pct{position:absolute;bottom:var(--space-3);right:var(--space-3);font-size:var(--text-xs);color:var(--muted);}

  /* === ERROS (redesign) === */
  .erros-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3);}
  .erros-header-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;flex:0 1 420px;}
  .erros-header-actions input{margin:0;flex:1 1 220px;}
  .erros-header-actions button{width:auto;min-height:44px;margin:0;padding:0 16px;flex:0 0 auto;white-space:nowrap;}
  .erros-assunto-select{width:auto;min-height:32px;margin:0;padding:0 10px;font-size:var(--text-xs);flex:0 0 auto;margin-left:auto;}
  .erros-stat-delta{font-size:10px;color:var(--muted);margin-top:2px;}
  .erros-stat-delta.positivo{color:var(--ok);}
  .erros-stat-delta.negativo{color:var(--bad);}

  .erros-lista{display:flex;flex-direction:column;gap:var(--space-3);}
  .erro-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .erro-card-header{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3);cursor:pointer;}
  .erro-card-titulo{flex:1 1 200px;min-width:0;}
  .erro-card-assunto-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .erro-card-oque{font-size:var(--text-sm);margin-top:4px;color:var(--on-surface-muted,var(--muted));}
  .erro-card-preview{font-size:var(--text-sm);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .erro-card.expandido .erro-card-preview{display:none;}
  .erro-card-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;}
  .erro-prioridade-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:var(--text-xs);font-weight:600;white-space:nowrap;}
  .erro-prioridade-badge.prioridade-alta{background:var(--status-high-priority);color:#fff;}
  .erro-prioridade-badge.prioridade-media{background:var(--status-pending);color:#1a1206;}
  .erro-prioridade-badge.prioridade-baixa{background:var(--border);color:var(--muted);}
  .erro-card-data{font-size:var(--text-xs);color:var(--muted);white-space:nowrap;}
  .erro-card-chevron{width:auto;min-height:auto;padding:2px 6px;margin:0;background:transparent;border:none;color:var(--muted);flex:0 0 auto;}

  .erro-card-body{display:grid;grid-template-columns:1fr;gap:var(--space-3);padding:0 var(--space-3) var(--space-3);}
  @media(min-width:700px){.erro-card-body{grid-template-columns:1fr 1fr;}}
  .erro-card-col-titulo{font-size:var(--text-sm);font-weight:600;margin-bottom:4px;}
  .erro-col-bad{color:var(--bad);}
  .erro-col-ok{color:var(--ok);}
  .erro-card-pegadinha{background:var(--warn-soft);border-radius:var(--radius-sm);padding:var(--space-3);}
  .erro-card-pegadinha .erro-card-col-titulo{color:var(--warn);}
  .erro-form-panel{max-width:560px;}
  .erro-form-explicacao{min-height:132px;}
  .erro-form-contador{font-size:var(--text-xs);color:var(--muted);text-align:right;margin-top:2px;}
  .erro-form-contador.ok{color:var(--ok);}
  .erro-form-exemplo{margin:var(--space-2) 0;border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);}
  .erro-form-exemplo summary{cursor:pointer;font-size:var(--text-sm);color:var(--muted);}
  .erro-form-exemplo p{font-size:var(--text-sm);margin:6px 0 0;}
  .erro-form-erro{background:var(--bad-soft);color:var(--bad);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-size:var(--text-sm);margin:var(--space-2) 0;}
  .revisao-sm2-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .revisao-sm2-row button{margin:0;font-size:var(--text-sm);padding:0 8px;}
  .erro-card-footer{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);flex-wrap:wrap;
    padding:var(--space-2) var(--space-3);border-top:1px solid var(--border);}
  .erro-card-footer-info{font-size:var(--text-xs);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .erro-card-footer-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .erro-card-footer-actions button{width:auto;min-height:36px;margin:0;padding:0 14px;font-size:var(--text-sm);}
  .erro-menu-wrap{position:relative;}
  .erro-menu-wrap>button{min-height:36px;min-width:36px;padding:0;}
  .erro-menu-dropdown{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:5;min-width:120px;}
  .erro-menu-dropdown button{width:100%;margin:0;border:none;border-radius:0;}

  .erros-dica{padding:var(--space-2) 0;border-bottom:1px solid var(--border);}
  .erros-dica:last-child{border-bottom:none;}
  .erros-dica b{font-size:var(--text-sm);}
  .erros-dica p{margin:2px 0 0;font-size:var(--text-xs);}

  .revisao-sessao-panel{max-width:480px;}
  .revisao-sessao-progresso{font-size:var(--text-sm);color:var(--muted);margin-bottom:4px;}
  .revisao-sessao-secao{margin-top:var(--space-3);}
  .revisao-sessao-secao p{margin-top:4px;}

  /* === DASHBOARD (redesign) === */
  .dashboard-hero-row{display:flex;align-items:stretch;gap:var(--space-4);flex-wrap:wrap;}
  .dashboard-hero-divider{width:1px;background:var(--border);flex-shrink:0;align-self:stretch;}
  @media(max-width:700px){.dashboard-hero-divider{display:none;}}
  .dashboard-hero-progresso{flex:1 1 220px;min-width:200px;}
  .dashboard-hero-progresso-label{font-size:var(--text-sm);color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:4px;}
  .dashboard-hero-progresso-valor{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .dashboard-hero-progresso-valor b{font-size:var(--text-2xl);font-weight:650;}
  .dashboard-hero-dias{font-size:var(--text-sm);color:var(--muted);}

  .dashboard-kpi-meta{font-size:10px;color:var(--muted);margin-top:2px;}
  .dashboard-kpi-card .progress{margin-top:6px;height:6px;}

  .dashboard-progresso-row{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2);}
  .dashboard-progresso-label{flex:0 0 130px;font-size:var(--text-sm);color:var(--muted);}
  .dashboard-progresso-row .progress{flex:1;margin:0;}
  .dashboard-progresso-valor{flex:0 0 auto;font-size:var(--text-sm);white-space:nowrap;}
  .dashboard-dias-blocos{display:flex;gap:4px;flex:1;}
  .dashboard-dia-bloco{flex:1;height:8px;border-radius:4px;background:var(--border);}
  .dashboard-dia-bloco.feito{background:var(--accent);}

  .dashboard-badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:var(--space-2);}
  .dashboard-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;
    font-size:var(--text-sm);font-weight:600;border:1px solid var(--border);background:var(--bg);}

  .dashboard-atencao-item{display:flex;align-items:center;gap:var(--space-2);width:100%;text-align:left;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);
    margin-bottom:var(--space-2);cursor:pointer;font:inherit;color:var(--fg);}
  .dashboard-atencao-item:last-child{margin-bottom:0;}
  .dashboard-atencao-icon{flex-shrink:0;}
  .dashboard-atencao-texto{flex:1;font-size:var(--text-sm);}
  .dashboard-atencao-seta{color:var(--muted);flex-shrink:0;}

  .dashboard-status-badges{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2);margin-bottom:var(--space-3);}
  @media(min-width:480px){.dashboard-status-badges{grid-template-columns:repeat(4,1fr);}}
  .dashboard-status-badge{text-align:center;padding:var(--space-2);border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);}
  .dashboard-status-badge .stat-icon{position:static;opacity:1;font-size:16px;}
  .dashboard-status-badge b{display:block;font-size:var(--text-xl);margin-top:2px;}
  .dashboard-status-badge small{color:var(--muted);font-size:10px;}
  .dashboard-status-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--border);}
  .dashboard-status-bar span{height:100%;}

  .dashboard-quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3);}
  .dashboard-quick-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-3);
    min-height:auto;width:100%;margin:0;font:inherit;color:var(--fg);}
  .dashboard-quick-btn .dashboard-quick-icon{font-size:20px;margin-bottom:4px;}
  .dashboard-quick-btn b{font-size:var(--text-sm);}
  .dashboard-quick-btn small{color:var(--muted);font-size:var(--text-xs);}

  /* === DESEMPENHO (redesign) === */
  .desempenho-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:0 1 auto;}
  .desempenho-filtros select{width:auto;min-height:36px;margin:0;padding:0 10px;font-size:var(--text-xs);}
  .desempenho-filtros button{width:auto;min-height:36px;margin:0;padding:0 10px;font-size:var(--text-xs);}
  .desempenho-novo-ciclo-form{display:flex;gap:8px;align-items:center;margin-top:var(--space-2);flex-wrap:wrap;}
  .desempenho-novo-ciclo-form input{width:auto;min-height:36px;margin:0;flex:1 1 160px;}
  .desempenho-novo-ciclo-form button{width:auto;min-height:36px;margin:0;padding:0 12px;}

  .desempenho-kpi-card{position:relative;}
  .desempenho-kpi-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:4px;}
  .sparkline{flex-shrink:0;opacity:.9;}
  .desempenho-kpi-delta{font-size:10px;color:var(--muted);margin-top:6px;}
  .desempenho-kpi-delta.positivo{color:var(--ok);}
  .desempenho-kpi-delta.negativo{color:var(--bad);}

  .desempenho-disciplina-row{display:flex;align-items:center;gap:var(--space-3);padding:6px 0;}
  .desempenho-disciplina-nome{flex:0 0 140px;font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .desempenho-disciplina-bar-track{flex:1;height:10px;border-radius:999px;background:var(--border);overflow:hidden;}
  .desempenho-disciplina-bar-fill{height:100%;border-radius:999px;background:var(--accent);}
  .desempenho-disciplina-pct{flex:0 0 40px;text-align:right;font-size:var(--text-sm);color:var(--muted);}

  .desempenho-pizza-wrap{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;}
  .desempenho-pizza-canvas-wrap{position:relative;width:140px;height:140px;flex-shrink:0;}
  .desempenho-pizza-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  .desempenho-pizza-centro b{font-size:var(--text-lg);}
  .desempenho-pizza-centro small{color:var(--muted);font-size:var(--text-xs);}
  .desempenho-pizza-legend{flex:1;min-width:160px;}
  .desempenho-pizza-legend-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:var(--text-sm);}
  .desempenho-pizza-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .desempenho-pizza-legend-item span{flex:1;}

  .desempenho-constancia-table{width:100%;border-collapse:collapse;font-size:var(--text-xs);}
  .desempenho-constancia-table th,.desempenho-constancia-table td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--border);}
  .desempenho-constancia-table th:first-child,.desempenho-constancia-table td:first-child{text-align:left;color:var(--muted);}
  .desempenho-constancia-aderencia{font-weight:600;}

  .desempenho-assunto-row{padding:6px 0;}
  .desempenho-assunto-row-top{display:flex;justify-content:space-between;font-size:var(--text-sm);margin-bottom:3px;}
  .desempenho-assunto-bar-track{height:6px;border-radius:999px;background:var(--border);overflow:hidden;}
  .desempenho-assunto-bar-fill{height:100%;border-radius:999px;}
  .desempenho-assunto-bar-fill.boa{background:var(--ok);}
  .desempenho-assunto-bar-fill.ruim{background:var(--bad);}

  .desempenho-insight-card{background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(79,157,222,.08));border-color:rgba(168,85,247,.3);}
  .desempenho-insight-card p{margin:8px 0 12px;}

  .desempenho-meta-valor{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .desempenho-meta-valor b{font-size:var(--text-2xl);}
  .desempenho-meta-form{display:flex;gap:8px;align-items:center;margin-top:var(--space-2);}
  .desempenho-meta-form input{width:auto;min-height:36px;margin:0;flex:0 0 100px;}
  .desempenho-meta-form button{width:auto;min-height:36px;margin:0;padding:0 12px;}

  /* === HOJE (redesign) === */
  .hoje-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap;}
  .hoje-header{display:flex;align-items:flex-start;gap:var(--space-3);}
  .hoje-header .hoje-header-icon{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .hoje-header h2{margin:0;}
  .hoje-header small{display:block;margin-top:2px;}
  .hoje-header-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .hoje-header-actions button{width:auto;margin:0;padding:0 18px;white-space:nowrap;}
  .hoje-progress-label{display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--space-3);font-size:var(--text-sm);}
  .hoje-progress-label b{font-size:var(--text-lg);}
  .hoje-meta-dia-row{margin-top:var(--space-3);}
  .hoje-meta-dia-row label{font-size:var(--text-xs);color:var(--muted);margin:0;}
  .hoje-meta-dia-row .row input{flex:0 0 100px;margin:0;}
  .hoje-meta-dia-row .row button{width:auto;margin:0;padding:0 14px;white-space:nowrap;}

  .card-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-2);}
  .card-header-row h3{margin:0;}
  .card-link{width:auto;background:transparent;border:none;color:var(--accent);min-height:44px;padding:0;margin:0;font-size:var(--text-sm);}
  .section-icon{margin-right:4px;}
  .item-done-check{width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--accent-fg);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
  .add-activity-row{border:1px dashed var(--border);background:transparent;color:var(--muted);
    margin-top:var(--space-3);margin-bottom:0;min-height:44px;}
  .add-activity-row:hover{border-color:var(--accent);color:var(--accent);}

  .item-icon{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--surface);}
  .item-icon.tipo-questoes{background:rgba(79,157,222,.15);color:var(--accent);}
  .item-icon.tipo-teoria{background:rgba(224,168,62,.15);color:var(--warn);}
  .item-icon.tipo-revisao{background:rgba(62,207,142,.15);color:var(--ok);}
  .item-icon.tipo-anki{background:rgba(224,90,79,.15);color:var(--bad);}

  .hero-card{border-color:var(--accent);padding:var(--space-3);}
  .hero-card .hero-eyebrow{font-size:var(--text-xs);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;font-weight:650;margin-bottom:var(--space-2);}
  .hero-card .hero-top{display:flex;align-items:center;gap:var(--space-3);}
  .hero-card .hero-title-block{flex:1;min-width:0;}
  .hero-card h3{margin:0;font-size:var(--text-lg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hero-card .hero-subtitle{font-size:var(--text-xs);color:var(--muted);margin-top:1px;}
  .hero-card .hero-cta{width:auto;flex-shrink:0;padding:0 20px;margin:0;}
  .hero-card .hero-meta{font-size:var(--text-xs);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    margin:var(--space-2) 0 0 calc(38px + var(--space-3));}
  @media(max-width:480px){
    .hero-card .hero-top{flex-wrap:wrap;}
    .hero-card .hero-title-block{flex:1 1 calc(100% - 38px - var(--space-3));}
    .hero-card .hero-cta{flex:1 1 100%;width:100%;margin-left:0;}
    .hero-card .hero-meta{margin-left:calc(38px + var(--space-3));}
  }

  .status-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:var(--text-xs);font-weight:600;flex-shrink:0;white-space:nowrap;}
  button.status-pill{width:auto;min-height:auto;border:none;margin:0;cursor:pointer;}
  .status-pill.pendente{background:var(--border);color:var(--muted);}
  .status-pill.atrasada{background:var(--bad);color:var(--accent-fg);}
  .status-pill.concluida{background:var(--ok);color:var(--accent-fg);}
  .status-pill.andamento{background:rgba(224,168,62,.2);color:var(--warn);}

  .activity-list{display:flex;flex-direction:column;}
  .activity-item{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2) var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--border);}
  .activity-item:last-child{border-bottom:none;}
  .activity-item.concluida{opacity:.55;}
  .activity-item .activity-info{flex:1 1 160px;min-width:160px;}
  .activity-item .activity-title{font-weight:600;font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .activity-item.concluida .activity-title{text-decoration:line-through;}
  .activity-item .activity-meta{font-size:var(--text-xs);color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .activity-item .activity-footer{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;}
  .activity-item .activity-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .activity-item .activity-action{width:auto;min-height:36px;padding:0 12px;margin:0;font-size:var(--text-sm);}
  .activity-item .activity-action.primary{background:var(--accent);border-color:var(--accent);}
  @media(max-width:600px){
    .activity-item .activity-footer{flex-basis:100%;margin-left:0;}
  }

  .revisao-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--border);}
  .revisao-item:last-child{border-bottom:none;}
  .revisao-item .revisao-info{flex:1;min-width:0;}
  .revisao-item .revisao-title{font-weight:600;font-size:var(--text-sm);}
  .revisao-item .revisao-meta{font-size:var(--text-xs);color:var(--muted);margin-top:2px;}
  .revisao-item .revisao-actions{display:flex;gap:4px;flex-shrink:0;}
  .revisao-item .revisao-actions button{width:auto;min-height:36px;min-width:36px;padding:0 10px;margin:0;font-size:var(--text-sm);}

  .sessao-list{display:flex;flex-direction:column;}
  .sessao-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .sessao-item:last-child{border-bottom:none;}
  .sessao-info{flex:1 1 200px;min-width:200px;}
  .sessao-title{font-weight:600;font-size:var(--text-sm);}
  .sessao-meta{font-size:var(--text-xs);color:var(--muted);margin-top:2px;}
  .sessao-actions{display:flex;gap:6px;flex-shrink:0;margin-left:auto;}
  .sessao-actions button{width:auto;min-height:36px;padding:0 12px;margin:0;font-size:var(--text-sm);}

  .empty-state{text-align:center;padding:var(--space-4) var(--space-3);color:var(--muted);}
  .empty-state .empty-state-icon{font-size:24px;margin-bottom:6px;}
  .empty-state button{width:auto;margin:var(--space-3) auto 0;padding:0 20px;}

  .resumo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3);}
  @media(min-width:480px){.resumo-grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:900px){.resumo-grid{grid-template-columns:repeat(2,1fr);}}
  .resumo-grid .stat-card{padding:var(--space-3);}
  .resumo-grid .stat-icon{top:var(--space-3);right:var(--space-3);}
  .resumo-grid .stat-value{font-size:var(--text-xl);}

  .grid-hoje{display:grid;grid-template-columns:1fr;gap:var(--space-4);}
  .grid-hoje > *{min-width:0;}
  @media(min-width:900px){.grid-hoje{grid-template-columns:2fr 1fr;align-items:start;}}

  .timer-display{font-size:var(--text-2xl);font-weight:650;text-align:center;margin:var(--space-2) 0;font-variant-numeric:tabular-nums;}
  .timer-display.pausado{color:var(--muted);}
  .timer-secondary{font-size:var(--text-xs);color:var(--muted);text-align:center;margin-top:-4px;}
  .timer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:var(--space-2);}
  .timer-actions button{width:auto;flex:1 1 auto;min-height:44px;margin:0;padding:0 12px;white-space:nowrap;}

  .fechamento-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-1);}
  .fechamento-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;}
  .fechamento-actions button{width:auto;flex:0 1 auto;min-height:44px;margin:0;padding:0 16px;background:transparent;white-space:nowrap;}
  .fechamento-actions button.opt-ok{border-color:var(--ok);color:var(--ok);}
  .fechamento-actions button.opt-warn{border-color:var(--warn);color:var(--warn);}
  .fechamento-actions button.opt-bad{border-color:var(--bad);color:var(--bad);}
  .fechamento-actions button.opt-ok.active{background:var(--ok);color:var(--accent-fg);}
  .fechamento-actions button.opt-warn.active{background:var(--warn);color:var(--accent-fg);}
  .fechamento-actions button.opt-bad.active{background:var(--bad);color:var(--accent-fg);}
  @media(max-width:560px){.fechamento-actions{width:100%;} .fechamento-actions button{flex:1 1 auto;}}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:center;justify-content:center;padding:var(--space-4);}
  .modal-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    max-width:440px;width:100%;max-height:88vh;overflow-y:auto;padding:var(--space-4);box-shadow:var(--shadow);}
  .modal-panel h3{margin-top:0;}

  .combo{position:relative;}
  .combo-results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);
    border:1px solid var(--border);border-radius:var(--radius-sm);max-height:180px;overflow-y:auto;
    z-index:5;display:none;box-shadow:var(--shadow);}
  .combo-results.open{display:block;}
  .combo-item{padding:10px 12px;cursor:pointer;font-size:var(--text-sm);}
  .combo-item:hover,.combo-item.highlight{background:var(--border);}
  .combo-empty{padding:10px 12px;font-size:var(--text-sm);}

  /* === HOJE (polimento visual) === */
  .hoje-screen .card{
    border-color:var(--hoje-border);
    box-shadow:var(--hoje-shadow-card);
    padding:20px;
  }
  .hoje-screen .hero-card{border-color:var(--accent);}
  .hoje-screen .modal-panel{border-color:var(--hoje-border);}
  .hoje-screen .progress{height:6px;border-radius:4px;}
  .hoje-screen .resumo-grid .stat-card{padding:16px;}
  .hoje-screen .grid-hoje{gap:var(--space-6);}
  .hoje-screen .hoje-closing{margin-top:var(--space-6);}

  .hoje-screen .hero-subtitle,
  .hoje-screen .hero-meta,
  .hoje-screen .activity-meta,
  .hoje-screen .revisao-meta{
    color:var(--hoje-text-secondary);
    font-size:var(--text-sm);
    line-height:1.5;
  }

  .hoje-screen .status-pill{
    padding:4px 12px;
    border-radius:4px;
    font-weight:600;
  }
  .hoje-screen .status-pill.pendente{background:#4b5563;color:#f3f4f6;}
  .hoje-screen .status-pill.atrasada{background:var(--bad);color:var(--accent-fg);}
  .hoje-screen .status-pill.concluida{background:var(--ok);color:var(--accent-fg);}
  .hoje-screen .status-pill.andamento{background:var(--warn);color:var(--accent-fg);}

  .hoje-screen .card-link{text-decoration:none;cursor:pointer;}
  .hoje-screen .card-link:hover{text-decoration:underline;}

  .hoje-screen .item-icon.tipo-questoes{background:rgba(79,157,222,.22);}
  .hoje-screen .item-icon.tipo-teoria{background:rgba(224,168,62,.22);}
  .hoje-screen .item-icon.tipo-revisao{background:rgba(62,207,142,.22);}
  .hoje-screen .item-icon.tipo-anki{background:rgba(224,90,79,.22);}

  /* === CONFIGURAÇÕES (redesign) === */
  .config-header-row{display:flex;align-items:flex-start;gap:var(--space-3);}
  .config-header-icon{font-size:24px;}
  .config-status-grid{margin-bottom:var(--space-4);}
  .stat-sub{font-size:var(--text-xs);color:var(--muted);margin-top:2px;}

  .config-action-card{display:flex;align-items:center;gap:var(--space-3);text-align:left;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);

  .config-pref-item{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
    padding:var(--space-2) 0;border-bottom:1px solid var(--border);}
  .config-pref-item:last-child{border-bottom:none;}
  .config-pref-text b{display:block;font-size:var(--text-sm);}
  .config-pref-text small{color:var(--muted);font-size:var(--text-xs);}
  .config-pref-select{width:auto;min-height:40px;margin:0;flex-shrink:0;}

  .switch{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;margin:0;min-height:auto;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch-slider{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:background .15s;cursor:pointer;}
  .switch-slider::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:transform .15s;}
  .switch input:checked + .switch-slider{background:var(--accent);}
  .switch input:checked + .switch-slider::before{transform:translateX(18px);}
  .switch input:focus-visible + .switch-slider{outline:2px solid var(--accent);outline-offset:2px;}

  .config-avancado{margin-top:var(--space-3);border-top:1px solid var(--border);padding-top:var(--space-3);}
  .config-avancado summary{cursor:pointer;font-weight:600;color:var(--fg);list-style:none;}
  .config-avancado summary::-webkit-details-marker{display:none;}
  .config-avancado summary::before{content:'▸ ';color:var(--muted);}
  .config-avancado[open] summary::before{content:'▾ ';}
  .config-avancado small{display:block;margin-top:4px;}

  .config-danger-card{border-color:var(--bad);background:rgba(200,60,50,.07);}
  .config-danger-inner{background:var(--bg);border:1px solid var(--bad);border-radius:var(--radius-sm);
    padding:var(--space-3);margin-top:var(--space-2);}
  .config-danger-inner b{color:var(--bad);}
  .config-danger-inner p{font-size:var(--text-sm);color:var(--muted);margin:4px 0 var(--space-2);}
  .config-danger-warn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:var(--space-3);
    background:rgba(224,168,62,.12);border:1px solid var(--warn);border-radius:var(--radius-sm);
    padding:var(--space-2) var(--space-3);font-size:var(--text-sm);color:var(--fg);}
  .config-danger-warn button{margin:0 0 0 auto;}

  .sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex-shrink:0;}
  .sync-dot.signed-out{background:var(--border-strong);}
  .sync-dot.syncing{background:var(--warn);animation:sync-pulse 1s ease-in-out infinite;}
  .sync-dot.synced{background:var(--ok);}
  .sync-dot.error{background:var(--bad);}
  @keyframes sync-pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .sync-conta-row{display:flex;align-items:center;gap:10px;margin-top:var(--space-3);}
  .sync-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;}

  function icone(nome, tamanho){
    const conteudo = ICONES[nome] || ICONES.circle;
    const px = tamanho || 16;
    return `<svg class="icone" width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${conteudo}</svg>`;
  }
  function hojeISO(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function addDays(iso, n){
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }
  function segundaFeiraDaSemana(iso){
    const d = new Date(iso + 'T00:00:00');
    const diaSemana = d.getDay(); // 0=domingo .. 6=sábado
    const offset = diaSemana === 0 ? -6 : 1 - diaSemana;
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0,10);
  }
  function formatarData(iso, formato){
    if(!iso) return '';
    const f = formato || state?.preferencias?.formatoData || 'DD/MM/AAAA';
    const [ano, mes, dia] = iso.slice(0,10).split('-');
    if(f === 'MM/DD/AAAA') return `${mes}/${dia}/${ano}`;
    if(f === 'AAAA-MM-DD') return `${ano}-${mes}-${dia}`;
    return `${dia}/${mes}/${ano}`;
  }
  function formatarDataHora(isoDateTime){
    if(!isoDateTime) return null;
    const d = new Date(isoDateTime);
    const dataFormatada = formatarData(d.toISOString().slice(0,10));
    const hora = String(d.getHours()).padStart(2,'0');
    const min = String(d.getMinutes()).padStart(2,'0');
    return `${dataFormatada} às ${hora}:${min}`;
  }

  /* === STATE (Tarefa 2) === */

  function estadoValido(obj){
    return !!obj && typeof obj.meta === 'object' && obj.meta !== null &&
      Array.isArray(obj.checkins) && Array.isArray(obj.erros) &&
      Array.isArray(obj.conteudo) && Array.isArray(obj.planejamento);
  }

  function loadState(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return seedState();
      const parsed = JSON.parse(raw);
      if(!estadoValido(parsed)) return seedState();
      return normalizarCamposNovos(parsed);

  function saveState(s){

      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));

  /* === SINCRONIZAÇÃO ENTRE APARELHOS (Firebase Auth + Firestore) ===
     Os valores abaixo (apiKey, projectId etc.) são identificadores públicos
     do projeto Firebase — não são senhas e é seguro deixá-los neste arquivo
     público. A segurança de verdade vem das regras do Firestore (que
     restringem cada documento ao dono autenticado), configuradas no console
     do Firebase, não aqui no código. Veja as regras recomendadas no final
     deste bloco.

     Pra ativar: crie um projeto em console.firebase.google.com, ative
     Firestore (modo produção) e o provedor de login "Google" em
     Authentication, depois cole os valores de Configurações do projeto
     (ícone de engrenagem → Configurações do projeto → seus apps → SDK
     setup) nos campos abaixo.

     Regras do Firestore recomendadas (colar na aba "Regras"):
       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /estados/{uid} {
             allow read, write: if request.auth != null && request.auth.uid == uid;
           }
         }
       }
  */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDt6WnaU0uwCoYKIM8UHES8ofiCjPmv2oI",
    authDomain: "gerenciador-de-estudos-f804c.firebaseapp.com",
    projectId: "gerenciador-de-estudos-f804c",
    storageBucket: "gerenciador-de-estudos-f804c.firebasestorage.app",
    messagingSenderId: "318344366702",
    appId: "1:318344366702:web:39fdd5ec8ef36d64a6b47f",
  };
  const FIREBASE_SDK_VERSAO = '10.7.1';
  const SYNC_ATIVO_KEY = 'estudos_sync_ativo';
  const SYNC_DEVICE_KEY = 'estudos_device_id';

  let firebaseApp = null, firebaseAuth = null, firebaseDb = null;
  let firebaseAuthMod = null, firebaseFsMod = null;
  let firebaseSdkPromise = null;
  let usuarioSincronizado = null; // { uid, email, nome, foto }
  let syncStatus = 'signed-out'; // 'signed-out' | 'syncing' | 'synced' | 'error'
  let syncDebounceTimer = null;
  let syncUnsubscribe = null;
  let syncAplicandoRemoto = false;

  function firebaseConfigurado(){
    return Object.values(FIREBASE_CONFIG).every(v => v && v !== 'COLE_AQUI');
  }
  function obterDeviceId(){
    let id = localStorage.getItem(SYNC_DEVICE_KEY);
    if(!id){
      id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(36).slice(2)));
      localStorage.setItem(SYNC_DEVICE_KEY, id);
    }
    return id;
  }
  function carregarFirebaseSdk(){
    if(firebaseSdkPromise) return firebaseSdkPromise;
    firebaseSdkPromise = (async () => {
      const [appMod, authMod, fsMod] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSAO}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSAO}/firebase-auth.js`),
        import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSAO}/firebase-firestore.js`),
      ]);
      firebaseAuthMod = authMod;
      firebaseFsMod = fsMod;
      firebaseApp = appMod.initializeApp(FIREBASE_CONFIG);
      firebaseAuth = authMod.getAuth(firebaseApp);
      firebaseDb = fsMod.getFirestore(firebaseApp);
    })();
    return firebaseSdkPromise;
  }

  function atualizarIndicadorSyncDOM(){
    const dot = document.getElementById('sync-status-dot');
    if(!dot) return;
    dot.className = 'sync-dot ' + syncStatus;
    dot.title = textoStatusSync();
  }
  function textoStatusSync(){
    if(!usuarioSincronizado) return 'Sincronização desativada';
    if(syncStatus === 'syncing') return 'Sincronizando...';
    if(syncStatus === 'error') return 'Erro ao sincronizar — verifique sua conexão';
    return 'Sincronizado — ' + (usuarioSincronizado.email || '');
  }
  function temDadosReais(s){
    return !!((s.sessoes && s.sessoes.length) || (s.checkins && s.checkins.length) ||
      (s.erros && s.erros.length) || (s.conteudo && s.conteudo.some(c => c.status !== 'nao_iniciado')));
  }
  function podeRerenderizarComSeguranca(){
    const ativo = document.activeElement;
    if(!ativo) return true;
    if(ativo.tagName === 'TEXTAREA') return false;
    if(ativo.tagName === 'INPUT' && !['checkbox','radio','button'].includes(ativo.type)) return false;
    return true;
  }

  async function entrarComGoogle(){
    if(!firebaseConfigurado()){
      alert('Sincronização ainda não configurada neste app (falta a chave do Firebase). Veja o comentário no código-fonte.');
      return;
    }
    try {
      syncStatus = 'syncing';
      atualizarIndicadorSyncDOM();
      await carregarFirebaseSdk();
      if(!authListenerAtivo) inicializarAuthListener();
      const provider = new firebaseAuthMod.GoogleAuthProvider();
      await firebaseAuthMod.signInWithPopup(firebaseAuth, provider);
      localStorage.setItem(SYNC_ATIVO_KEY, '1');
    } catch(e){
      syncStatus = 'error';
      atualizarIndicadorSyncDOM();
      alert('Não foi possível entrar com Google: ' + (e && e.message ? e.message : e));
    }
  }
  async function sairDaConta(){
    try {
      if(syncUnsubscribe){ syncUnsubscribe(); syncUnsubscribe = null; }
      localStorage.removeItem(SYNC_ATIVO_KEY);
      if(firebaseAuth && firebaseAuthMod) await firebaseAuthMod.signOut(firebaseAuth);
    } catch(e){ /* best-effort */ }
    usuarioSincronizado = null;
    syncStatus = 'signed-out';
    atualizarIndicadorSyncDOM();
    render();
  }

  let authListenerAtivo = false;
  function inicializarAuthListener(){
    if(authListenerAtivo) return;
    authListenerAtivo = true;
    firebaseAuthMod.onAuthStateChanged(firebaseAuth, async (user) => {
      if(!user){
        usuarioSincronizado = null;
        syncStatus = 'signed-out';
        if(syncUnsubscribe){ syncUnsubscribe(); syncUnsubscribe = null; }
        atualizarIndicadorSyncDOM();
        return;
      }
      usuarioSincronizado = { uid: user.uid, email: user.email, nome: user.displayName, foto: user.photoURL };
      await conectarDocumentoNuvem();
      render();
    });
  }

  async function conectarDocumentoNuvem(){
    if(!usuarioSincronizado) return;
    syncStatus = 'syncing';
    atualizarIndicadorSyncDOM();
    try {
      const ref = firebaseFsMod.doc(firebaseDb, 'estados', usuarioSincronizado.uid);
      const snap = await firebaseFsMod.getDoc(ref);
      if(!snap.exists()){

      if(dados.origemDispositivo === obterDeviceId()) return; // veio da própria escrita deste aparelho
      if(!dados.estado || !estadoValido(dados.estado)) return;
      syncAplicandoRemoto = true;
      state = normalizarCamposNovos(dados.estado);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      syncAplicandoRemoto = false;

  let state = loadState();
  /* === HOJE (Tarefa 3) === */
  function diasAte(hojeIso, alvoIso){

      .filter(([, data]) => !!data)

      .sort((a,b) => a.data.localeCompare(b.data));

  function calcularErros(questoes, acertos){

  function iniciarSessaoEmAndamento(state, {assunto, tipo, origem}){
    state.sessaoEmAndamento = { assunto: assunto || null, tipo: tipo || null, origem: origem || null, inicioEm: new Date().toISOString(), acumuladoMs: 0, pausado: false, pomodoro: null };

  function elapsedMsSessao(sessao){
    if(!sessao) return 0;

  function retomarSessaoEmAndamento(state){
    const sessao = state.sessaoEmAndamento;

  const POMODORO_FOCO_MIN = 25;
  const POMODORO_PAUSA_MIN = 5;
  function ativarPomodoro(state){
    const sessao = state.sessaoEmAndamento;
    if(!sessao) return;
    if(sessao.pausado) retomarSessaoEmAndamento(state);
    sessao.pomodoro = { fase: 'foco', faseIniciadaEm: new Date().toISOString() };
  }
  function desativarPomodoro(state){

  function tickPomodoro(state){
    const sessao = state.sessaoEmAndamento;
    if(!sessao || !sessao.pomodoro) return null;
    const duracaoMin = sessao.pomodoro.fase === 'foco' ? POMODORO_FOCO_MIN : POMODORO_PAUSA_MIN;
    const decorridoMs = Date.now() - new Date(sessao.pomodoro.faseIniciadaEm).getTime();
    if(decorridoMs < duracaoMin * 60000) return null;
    if(sessao.pomodoro.fase === 'foco'){
      pausarSessaoEmAndamento(state);
      sessao.pomodoro = { fase: 'pausa', faseIniciadaEm: new Date().toISOString() };
      return 'pausa';
    }
    retomarSessaoEmAndamento(state);
    sessao.pomodoro = { fase: 'foco', faseIniciadaEm: new Date().toISOString() };
    return 'foco';
  }
  function finalizarSessaoEmAndamento(state){
    const sessao = state.sessaoEmAndamento;
    if(!sessao) return null;
    const minutos = Math.max(1, Math.round(elapsedMsSessao(sessao) / 60000));

  function atualizarSessao(state, id, dados){

  function normalizarCamposNovos(s){
    if(!Array.isArray(s.sessoes)) s.sessoes = [];
    if(!s.sessaoEmAndamento || typeof s.sessaoEmAndamento !== 'object') s.sessaoEmAndamento = null;
    if(s.sessaoEmAndamento){
      if(typeof s.sessaoEmAndamento.acumuladoMs !== 'number') s.sessaoEmAndamento.acumuladoMs = 0;
      if(typeof s.sessaoEmAndamento.pausado !== 'boolean') s.sessaoEmAndamento.pausado = false;
      if(!('pomodoro' in s.sessaoEmAndamento)) s.sessaoEmAndamento.pomodoro = null;

    if(!Array.isArray(s.concursos) || !s.concursos.length) s.concursos = ['Transpetro', 'INEA'];
    if(!Array.isArray(s.ciclos) || !s.ciclos.length) s.ciclos = [{ id: 'ciclo-1', nome: '1º Ciclo', inicio: s.meta?.cicloInicio || hojeISO() }];
    if(typeof s.contadorRevisoes !== 'number') s.contadorRevisoes = 0;
    if(!s.preferencias || typeof s.preferencias !== 'object') s.preferencias = {};
    if(!['DD/MM/AAAA','MM/DD/AAAA','AAAA-MM-DD'].includes(s.preferencias.formatoData)) s.preferencias.formatoData = 'DD/MM/AAAA';
    if(typeof s.preferencias.confirmacoes !== 'boolean') s.preferencias.confirmacoes = true;

  /* === ERROS/FLASHCARDS — migração pro modelo v2 ===
     Não-destrutiva: cada Erro do formato antigo (grau/proximaRevisao/
     regraCorreta como "lembrete") vira um Erro completo do formato novo
     + exatamente 1 Flashcard que herda a proximaRevisao/prioridade

     flashcardIds. */
  function migrarErrosParaModeloV2(s){
    if(!Array.isArray(s.erros) || !s.erros.length) return;
    s.erros.forEach(e => {
      if(Array.isArray(e.flashcardIds)) return; // já migrado
      const grauAntigo = e.grau;
      const prioridadeAntiga = { deficiencia:'alta', erro_novo:'media', reforcado:'baixa', corrigido:'baixa' }[grauAntigo] || 'media';
      const intervaloAntigo = { deficiencia:1, erro_novo:2, reforcado:7, corrigido:21 }[grauAntigo] || 2;
      const fc = {
        id: 'fc-' + String(Date.now()) + Math.random().toString(36).slice(2,7),
        erroId: e.id,
        frente: e.oQueErrei || e.assunto,
        verso: e.regraCorreta || '(sem verso registrado)',
        criadoEm: e.criadoEm || hojeISO(),
        intervalo: intervaloAntigo,
        facilidade: 2.5,
        repeticoes: 0,
        proximaRevisao: e.proximaRevisao || hojeISO(),
        historico: [],
        precisaCompletar: true,
      };
      s.flashcards.push(fc);
      e.disciplinaId = e.disciplinaId || e.assunto;
      e.origem = e.origem || (e.origemQuestao ? 'questao_prova' : 'leitura');
      e.fonte = e.fonte ?? null;
      e.enunciadoResumo = e.enunciadoResumo ?? '';
      e.explicacao = e.explicacao ?? '';
      e.pegadinha = e.pegadinha ?? null;
      e.baseLegal = e.baseLegal ?? (e.regraCorreta || null);
      e.tipoErro = e.tipoErro || 'conteudo';
      e.prioridade = e.prioridade || prioridadeAntiga;
      e.flashcardIds = [fc.id];
      e.precisaCompletar = true;
      delete e.grau;
      delete e.proximaRevisao;
      delete e.regraCorreta;
      delete e.ultimaRevisao;
      delete e.origemQuestao;
    });
  }

  /* === ERROS (Tarefa 4) === */
  const ORIGEM_LABEL = { questao_prova:'Questão de prova', simulado:'Simulado', leitura:'Leitura', aula:'Aula' };
  const TIPO_ERRO_LABEL = { conteudo:'Conteúdo', interpretacao:'Interpretação', distracao:'Distração' };

  function validarExplicacao(texto){
    const limpo = (texto || '').trim();
    if(limpo.length < EXPLICACAO_MIN_CHARS){
      return `Isso é um lembrete, não uma explicação. Escreva o conteúdo em si — o que você precisa saber para acertar da próxima vez. (mínimo ${EXPLICACAO_MIN_CHARS} caracteres, tem ${limpo.length})`;
    }
    const normalizado = limpo.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    if(EXPLICACAO_PREFIXOS_PROIBIDOS.some(p => normalizado.startsWith(p))){

  function aplicarResultadoRevisao(flashcard, resultado){
    const hoje = hojeISO();
    const facilidade = flashcard.facilidade || 2.5;
    const intervaloAtual = flashcard.intervalo || 1;
    let novoIntervalo;
    if(resultado === 'errei') novoIntervalo = 1;
    else if(resultado === 'dificil') novoIntervalo = Math.max(1, Math.round(intervaloAtual * 1.2));
    else if(resultado === 'bom') novoIntervalo = Math.max(1, Math.round(intervaloAtual * facilidade));
    else if(resultado === 'facil') novoIntervalo = Math.max(1, Math.round(intervaloAtual * facilidade * 1.3));
    else novoIntervalo = intervaloAtual;
    flashcard.intervalo = novoIntervalo;
    flashcard.repeticoes = (flashcard.repeticoes || 0) + 1;
    flashcard.proximaRevisao = addDays(hoje, novoIntervalo);
    if(!Array.isArray(flashcard.historico)) flashcard.historico = [];
    flashcard.historico.push({ data: hoje, resultado });

  }

  function ordenarFlashcardsPorRevisao(flashcards){

  function filaFlashcardsRevisao(state, hojeIso){

  function filtrarErros(state, erros, { filtro, assunto, busca, concurso, tipoErro, prioridade, hojeIso }){
    return erros.filter(e => {
      const cards = flashcardsDoErro(state, e.id);

      if(filtro === 'pendentes' && !pendente) return false;

          .flatMap(f => f.historico || [])

        if(!ultimoResultado || ultimoResultado.resultado !== 'errei') return false;

      if(tipoErro && tipoErro !== 'todos' && e.tipoErro !== tipoErro) return false;

      if(concurso && concurso !== 'todos' && !assuntoPertenceAoConcurso(state, e.assunto, concurso)) return false;
      if(busca){

  function statsErros(state, hojeIso){
    const erros = state.erros;
    const flashcards = state.flashcards || [];
    const total = erros.length;
    const pendentes = filaFlashcardsRevisao(state, hojeIso).length;
    const seteDiasAtras = addDays(hojeIso, -7);
    const catorzeDiasAtras = addDays(hojeIso, -14);
    const criadosUltimos7Dias = erros.filter(e => e.criadoEm >= seteDiasAtras).length;
    const historicoTodos = flashcards.flatMap(f => f.historico || []);
    const revisadosEstaSemana = historicoTodos.filter(h => h.data >= seteDiasAtras).length;
    const revisadosSemanaAnterior = historicoTodos.filter(h => h.data >= catorzeDiasAtras && h.data < seteDiasAtras).length;
    const revisoesHoje = historicoTodos.filter(h => h.data === hojeIso).length;
    const errosComRevisao = new Set(flashcards.filter(f => f.historico && f.historico.length).map(f => f.erroId)).size;
    const taxaRevisao = total ? Math.round((errosComRevisao / total) * 100) : 0;
    const porAssunto = {};
    erros.forEach(e => { porAssunto[e.assunto] = (porAssunto[e.assunto]||0) + 1; });
    let assuntoMaisFrequente = null, maxCount = 0;
    Object.entries(porAssunto).forEach(([nome, count]) => { if(count > maxCount){ maxCount = count; assuntoMaisFrequente = nome; } });
    return { total, pendentes, criadosUltimos7Dias, revisadosEstaSemana, deltaRevisados: revisadosEstaSemana - revisadosSemanaAnterior, revisoesHoje, taxaRevisao, assuntoMaisFrequente, assuntoMaisFrequenteCount: maxCount };
  }

  function ordenarErros(state, erros, criterio){
    const copia = [...erros];
    if(criterio === 'prioridade'){
      const peso = { alta:0, media:1, baixa:2 };
      return copia.sort((a,b) => peso[prioridadeErro(a)] - peso[prioridadeErro(b)]);
    }
    if(criterio === 'assunto') return copia.sort((a,b) => a.assunto.localeCompare(b.assunto));
    if(criterio === 'recente') return copia.sort((a,b) => b.criadoEm.localeCompare(a.criadoEm));
    if(criterio === 'mais_errados'){
      const errosCount = id => flashcardsDoErro(state, id).flatMap(f => f.historico||[]).filter(h => h.resultado==='errei').length;
      return copia.sort((a,b) => errosCount(b.id) - errosCount(a.id));
    }
    // 'proxima_revisao' (padrão)
    const proximaDoErro = id => {
      const cards = flashcardsDoErro(state, id);
      if(!cards.length) return '9999-12-31';
      return cards.reduce((min,f) => f.proximaRevisao < min ? f.proximaRevisao : min, cards[0].proximaRevisao);
    };
    return copia.sort((a,b) => proximaDoErro(a.id) < proximaDoErro(b.id) ? -1 : proximaDoErro(a.id) > proximaDoErro(b.id) ? 1 : 0);
  }
  function diasAtrasoLabel(proximaRevisao, hojeIso){
    if(proximaRevisao > hojeIso) return `Próxima ${proximaRevisao}`;
    const dias = diasAte(proximaRevisao, hojeIso);
    return dias === 0 ? 'Vence hoje' : `Atrasada há ${dias} dia${dias===1?'':'s'}`;
  }
  function iniciarSessaoRevisao(state, hojeIso){
    const fila = filaFlashcardsRevisao(state, hojeIso).map(f => f.id);
    if(!fila.length) return null;
    return { fila, indice: 0, revelado: false };
  }
  function contarErrosPorAssunto(erros, assunto, excluirId){
    return erros.filter(e => e.assunto === assunto && e.id !== excluirId).length;
  }

  /* === MAPA (Tarefa 6) === */
  const STATUS_CONTEUDO_ORDEM = ['nao_iniciado','estudado','revisado','dominado'];
  const STATUS_CONTEUDO_LABEL = { nao_iniciado:'Não iniciado', estudado:'Em andamento', revisado:'Revisão', dominado:'Concluído' };
  const STATUS_CONTEUDO_COR = { nao_iniciado:'not-started', estudado:'in-progress', revisado:'review', dominado:'completed' };
  const STATUS_CONTEUDO_PCT = { nao_iniciado:0, estudado:33, revisado:67, dominado:100 };
  function proximoStatusConteudo(atual){
    const i = STATUS_CONTEUDO_ORDEM.indexOf(atual);
    return STATUS_CONTEUDO_ORDEM[(i+1) % STATUS_CONTEUDO_ORDEM.length];
  }
  function slugConcurso(nome){
    return nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'');
  }
  function ordemConcursoDinamica(state){
    return ['ambos', ...(state.concursos||[]).map(slugConcurso)];
  }
  function proximoConcurso(atual, ordem){
    const i = ordem.indexOf(atual);
    const seguro = i === -1 ? 0 : i;
    return ordem[(seguro+1) % ordem.length];
  }
  function concursoLabel(state, valor){
    if(valor === 'ambos') return 'Múltiplos';
    const nome = (state.concursos||[]).find(n => slugConcurso(n) === valor);
    return nome || valor;
  }
  function concursosDoItem(state, concurso){
    if(concurso === 'ambos') return state.concursos && state.concursos.length ? state.concursos : ['Múltiplos'];
    return [concursoLabel(state, concurso)];
  }
  function adicionarConcurso(state, nome){
    const trimmed = (nome || '').trim();
    if(!trimmed) return null;
    if(!state.concursos) state.concursos = [];
    const slug = slugConcurso(trimmed);
    const existe = state.concursos.some(n => slugConcurso(n) === slug);
    if(existe) return null;
    state.concursos.push(trimmed);
    return trimmed;
  }
  function iconePorAssunto(nome){
    const n = nome.toLowerCase();
    if(n.includes('água') || n.includes('agua') || n.includes('hídric') || n.includes('hidric')) return icone('droplet');
    if(n.includes('resíduo') || n.includes('residuo') || n.includes('esgoto')) return icone('trash');
    if(n.includes('licenciamento')) return icone('landmark');
    if(n.includes('conama') || n.includes('nbr') || n.includes('pnrs') || n.includes('pnma') || n.includes('snuc') || n.includes('pnrh') || n.includes('lc ')) return icone('file-text');
    if(n.includes('inglês') || n.includes('ingles') || n.includes('português') || n.includes('portugues')) return icone('book-open');
    return icone('book');
  }
  function adicionarAssunto(state, nome){
    const trimmed = (nome || '').trim();
    if(!trimmed) return null;
    const existe = state.conteudo.some(c => c.assunto.toLowerCase() === trimmed.toLowerCase());
    if(existe) return null;
    const novo = { assunto: trimmed, status: 'nao_iniciado', concurso: 'ambos', atualizadoEm: null };
    state.conteudo.push(novo);
    return novo;
  }
  function filtrarConteudo(conteudo, { status, concurso, busca }){
    return conteudo.filter(c => {
      if(status && status !== 'todos' && c.status !== status) return false;
      if(concurso && concurso !== 'todos'){
        if(concurso === 'ambos'){
          if(c.concurso !== 'ambos') return false;
        } else if(c.concurso !== concurso && c.concurso !== 'ambos'){
          return false;
        }
      }
      if(busca && !c.assunto.toLowerCase().includes(busca.toLowerCase())) return false;
      return true;
    });
  }

          <div class="card stat-card"><div class="stat-label">Concluídos</div><div class="stat-value">${totalPorStatus.dominado||0}</div><div class="stat-icon" style="color:var(--status-completed)">●</div></div>
          <div class="card stat-card"><div class="stat-label">Progresso geral</div><div class="stat-value">${progressoGeral}%</div><div class="stat-icon">${icone('target')}</div></div>
        </div>

    const gridHtml = `
      <div class="mapa-grid">
        ${listaFiltrada.map(c => `
          <div class="mapa-card" style="border-left:3px solid ${corDisciplina(c.assunto)};">

            <div><button data-status-assunto="${escapeHtml(c.assunto)}" class="badge mapa-status-badge status-${STATUS_CONTEUDO_COR[c.status]} ${c.status==='dominado'?'selo':''}">${STATUS_CONTEUDO_LABEL[c.status]}</button></div>
            <div class="mapa-card-concursos">
              ${concursosDoItem(state, c.concurso).map(nome => `<button data-concurso-assunto="${escapeHtml(c.assunto)}" class="badge mapa-concurso-badge">${escapeHtml(nome)}</button>`).join('')}
            </div>
            <div class="mapa-card-pct">${STATUS_CONTEUDO_PCT[c.status]}%</div>

    const addAssuntoHtml = mapaAssuntoAberto ? `

        <label>Novo assunto</label>
        <div class="row">
          <input type="text" id="mapa-novo-assunto" placeholder="Nome do assunto">

    return `<div class="mapa-screen">${headerHtml}${gridHtml}${addAssuntoHtml}</div>`;

  /* === SEMANA (Tarefa 7) === */
  function semanaAtualId(){
    return segundaFeiraDaSemana(hojeISO());
  }

  function obterPlano(state, semanaId){
    return state.planejamento.find(p => p.semanaId === semanaId);
  }

  function salvarPlano(state, semanaId, {assuntosAlvo, diasAlvo, horasAlvo, diasDisponiveis, horario, concursosPrioritarios}){
    const existente = obterPlano(state, semanaId);
    if(existente){
      existente.assuntosAlvo = assuntosAlvo;
      existente.diasAlvo = diasAlvo;
      existente.horasAlvo = horasAlvo;
      existente.diasDisponiveis = diasDisponiveis || [];
      existente.horario = horario || '';
      existente.concursosPrioritarios = concursosPrioritarios || [];
      return existente;
    }
    const novo = { semanaId, assuntosAlvo, diasAlvo, horasAlvo,
      diasDisponiveis: diasDisponiveis || [], horario: horario || '', concursosPrioritarios: concursosPrioritarios || [],
      atividadesPorDia: {} };
    state.planejamento.push(novo);
    return novo;
  }

  const ATIVIDADE_DIA_TIPO_LABEL = { teoria:'Teoria', questoes:'Questões', revisao:'Revisão' };

  function adicionarAtividadeDia(state, semanaId, dataIso, {assunto, tipo, minutos}){
    let plano = obterPlano(state, semanaId);
    if(!plano){
      plano = { semanaId, assuntosAlvo: [], diasAlvo: 0, horasAlvo: 0, diasDisponiveis: [], horario: '', concursosPrioritarios: [], atividadesPorDia: {} };
      state.planejamento.push(plano);
    }
    if(!plano.atividadesPorDia) plano.atividadesPorDia = {};
    if(!plano.atividadesPorDia[dataIso]) plano.atividadesPorDia[dataIso] = [];
    const atividade = { id: String(Date.now()) + Math.random().toString(36).slice(2,7), assunto: assunto || null, tipo, minutos: Number(minutos) || 0, concluida: false };
    plano.atividadesPorDia[dataIso].push(atividade);
    return atividade;
  }

  const TIPO_PLANO_EXTERNO_MAP = { conteudo:'teoria', questoes:'questoes', revisao:'revisao', misto:'teoria', simulado:'questoes' };
  function mesclarPlanoExterno(state, planoExterno){
    if(!planoExterno || typeof planoExterno !== 'object' || !Array.isArray(planoExterno.dias)){
      throw new Error('formato não reconhecido — esperava um objeto com um array "dias"');
    }
    let adicionadas = 0;
    planoExterno.dias.forEach(dia => {
      if(!dia || !dia.data || !Array.isArray(dia.blocos)) return;
      const semanaId = segundaFeiraDaSemana(dia.data);
      const concluidoNoDia = dia.status === 'concluido';
      dia.blocos.forEach(bloco => {
        if(!bloco) return;
        const tipo = TIPO_PLANO_EXTERNO_MAP[bloco.tipo] || 'teoria';
        const minutos = Number(bloco.min) || 0;
        const assunto = bloco.tema || null;
        const plano = obterPlano(state, semanaId);
        const jaExiste = plano?.atividadesPorDia?.[dia.data]?.some(a =>
          a.assunto === assunto && a.tipo === tipo && a.minutos === minutos);
        if(jaExiste) return;
        const atividade = adicionarAtividadeDia(state, semanaId, dia.data, { assunto, tipo, minutos });
        if(concluidoNoDia) atividade.concluida = true;
        adicionadas++;
      });
    });
    const regras = Array.isArray(planoExterno.regras) ? planoExterno.regras.filter(r => typeof r === 'string') : [];
    const foraDoCiclo = Array.isArray(planoExterno.foraDoCiclo) ? planoExterno.foraDoCiclo.filter(r => typeof r === 'string') : [];
    if(planoExterno.ciclo && planoExterno.ciclo.nome){
      let cicloAlvo = state.ciclos.find(c => c.nome === planoExterno.ciclo.nome);
      if(!cicloAlvo){
        cicloAlvo = { id: 'ciclo-' + String(Date.now()).slice(-6), nome: planoExterno.ciclo.nome, inicio: planoExterno.ciclo.dataInicio || hojeISO() };
        state.ciclos.push(cicloAlvo);
      }
      if(regras.length) cicloAlvo.regras = regras;
      if(foraDoCiclo.length) cicloAlvo.foraDoCiclo = foraDoCiclo;
    }
    const datas = planoExterno.dias.filter(d => d?.data).map(d => d.data).sort();
    if(!Array.isArray(state.historicoImportacoes)) state.historicoImportacoes = [];
    state.historicoImportacoes.push({
      id: String(Date.now()) + Math.random().toString(36).slice(2,7),
      tipo: 'plano',
      quando: new Date().toISOString(),
      cicloNome: planoExterno.ciclo?.nome || null,
      atividadesAdicionadas: adicionadas,
      diasCobertos: datas.length,
      periodoInicio: datas[0] || null,
      periodoFim: datas[datas.length-1] || null,
    });
    return adicionadas;
  }

  function normalizarListaErrosExternos(entrada){
    if(Array.isArray(entrada)) return entrada;
    if(Array.isArray(entrada?.erros)) return entrada.erros;
    // Formato "histórico do caderno de erros": um resumo por tema, com
    // dificuldades/pegadinhas em vez de erro+regra separados. Cada item
    // vira um erro, usando o texto da dificuldade/pegadinha como oQueErrei
    // e a lei (quando houver) como pista de regraCorreta — sem inventar
    // enunciado nem taxa de acerto que o arquivo não informa.
    if(Array.isArray(entrada?.historico)){
      const convertidos = [];
      entrada.historico.forEach(item => {
        if(!item || !item.tema) return;
        const fontes = [
          ...(Array.isArray(item.pegadinhas_relevantes) ? item.pegadinhas_relevantes : []),
          ...(Array.isArray(item.dificuldades_principais) ? item.dificuldades_principais : []),
          ...(Array.isArray(item.dificuldades) ? item.dificuldades : []),
        ];
        fontes.forEach(texto => {
          if(typeof texto !== 'string' || !texto.trim()) return;
          convertidos.push({
            assunto: item.tema,
            oQueErrei: texto.trim(),
            regraCorreta: item.lei ? `Revisar base legal: ${item.lei}` : 'Revisar teoria deste ponto',
            origemQuestao: true,
          });
        });
      });
      return convertidos;
    }
    return null;
  }
  function mesclarErrosExternos(state, entrada){
    const lista = normalizarListaErrosExternos(entrada);
    if(!lista) throw new Error('formato não reconhecido — esperava um array de erros, um objeto com "erros" ou um "histórico" por tema');
    let adicionados = 0;
    lista.forEach(item => {
      if(!item || !item.assunto || !item.oQueErrei || !item.regraCorreta) return;
      const jaExiste = state.erros.some(e => e.assunto === item.assunto && e.oQueErrei === item.oQueErrei);
      if(jaExiste) return;
      criarErro(state, {
        assunto: item.assunto,
        oQueErrei: item.oQueErrei,
        baseLegal: item.regraCorreta,
        origem: item.origemQuestao ? 'questao_prova' : 'leitura',
        explicacao: '',
        precisaCompletar: true,
      });
      adicionados++;
    });
    if(!Array.isArray(state.historicoImportacoes)) state.historicoImportacoes = [];
    state.historicoImportacoes.push({
      id: String(Date.now()) + Math.random().toString(36).slice(2,7),
      tipo: 'erros',
      quando: new Date().toISOString(),
      errosAdicionados: adicionados,
    });
    return adicionados;
  }

  function removerAtividadeDia(state, semanaId, dataIso, atividadeId){
    const lista = obterPlano(state, semanaId)?.atividadesPorDia?.[dataIso];
    if(!lista) return false;
    const idx = lista.findIndex(a => a.id === atividadeId);
    if(idx === -1) return false;
    lista.splice(idx, 1);
    return true;
  }

  function alternarConcluidaAtividadeDia(state, semanaId, dataIso, atividadeId){
    const item = obterPlano(state, semanaId)?.atividadesPorDia?.[dataIso]?.find(a => a.id === atividadeId);
    if(!item) return null;
    item.concluida = !item.concluida;
    if(item.concluida) avancarStatusPorAtividade(state, item.assunto, dataIso);
    return item;
  }

  function dentroDaSemana(dataIso, semanaId){
    return dataIso >= semanaId && dataIso <= addDays(semanaId, 6);
  }

  function diasRealizadosNaSemana(checkins, sessoes, semanaId){
    const diasComCheckin = checkins.filter(c => c.status !== 'nao' && dentroDaSemana(c.data, semanaId)).map(c => c.data);
    const diasComSessao = sessoes.filter(s => dentroDaSemana(s.data, semanaId)).map(s => s.data);
    return new Set([...diasComCheckin, ...diasComSessao]).size;
  }

  function horasRealizadasNaSemana(checkins, sessoes, semanaId){
    const diasComDados = new Set([
      ...checkins.filter(c => dentroDaSemana(c.data, semanaId)).map(c => c.data),
      ...sessoes.filter(s => dentroDaSemana(s.data, semanaId)).map(s => s.data),
    ]);
    const minutos = [...diasComDados].reduce((soma, data) => {
      const c = checkins.find(x => x.data === data);
      const sessoesDoDia = sessoes.filter(s => s.data === data);
      return soma + minutosNoDia(c, sessoesDoDia);
    }, 0);
    return Math.round((minutos / 60) * 10) / 10;
  }

  function assuntosTocadosNaSemana(state, semanaId){
    const doCheckin = state.checkins
      .filter(c => dentroDaSemana(c.data, semanaId) && c.assunto)
      .map(c => c.assunto);
    const doMapa = state.conteudo
      .filter(c => c.atualizadoEm && dentroDaSemana(c.atualizadoEm, semanaId))
      .map(c => c.assunto);
    const doSessoes = (state.sessoes || [])
      .filter(s => dentroDaSemana(s.data, semanaId) && s.assunto)
      .map(s => s.assunto);
    return [...new Set([...doCheckin, ...doMapa, ...doSessoes])];
  }

  function assuntosAtrasadosNaSemana(assuntosAlvo, tocados){
    return assuntosAlvo.filter(a => !tocados.includes(a));
  }

  /* === DESEMPENHO (Tarefa 8) === */
  function agregarPorAssunto(checkins, sessoes = []){
    const map = new Map();
    for(const c of checkins){
      if(!c.assunto || !c.questoes) continue;
      const cur = map.get(c.assunto) || {assunto:c.assunto, questoes:0, acertos:0};
      cur.questoes += c.questoes;
      cur.acertos += c.acertos || 0;
      map.set(c.assunto, cur);
    }
    for(const s of sessoes){
      if(s.tipo !== 'questoes' || !s.assunto || !s.questoes) continue;
      const cur = map.get(s.assunto) || {assunto:s.assunto, questoes:0, acertos:0};
      cur.questoes += s.questoes;
      cur.acertos += s.acertos || 0;
      map.set(s.assunto, cur);
    }
    return [...map.values()].map(x => ({...x, pct: x.questoes ? Math.round((x.acertos/x.questoes)*100) : 0}));
  }

  function diasEstudados(checkins, sessoes){
    const diasComCheckin = checkins.filter(c => c.status !== 'nao').map(c => c.data);
    const diasComSessao = sessoes.map(s => s.data);
    return new Set([...diasComCheckin, ...diasComSessao]).size;
  }

  function diasDeCiclo(cicloInicioIso, hojeIso){
    const a = new Date(cicloInicioIso + 'T00:00:00');
    const b = new Date(hojeIso + 'T00:00:00');
    return Math.round((b - a) / 86400000) + 1;
  }

  function piores5(agregado){
    return [...agregado].filter(a => a.questoes > 0).sort((a,b) => a.pct - b.pct).slice(0,5);
  }

  function totalQuestoes(checkins){ return checkins.reduce((s,c) => s + (c.questoes||0), 0); }
  function totalHorasEstudadas(checkins, sessoes){
    const diasComDados = new Set([...checkins.map(c => c.data), ...sessoes.map(s => s.data)]);
    const minutos = [...diasComDados].reduce((soma, data) => {
      const c = checkins.find(x => x.data === data);
      const sessoesDoDia = sessoes.filter(s => s.data === data);
      return soma + minutosNoDia(c, sessoesDoDia);
    }, 0);
    return Math.round((minutos/60)*10)/10;
  }

  /* === EXPORT (Tarefa 9) === */

  function baixarArquivo(nome, conteudo, tipo){
    const blob = new Blob([conteudo], {type: tipo});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function verificarNotificacoesPendentes(){
    if(!state.preferencias.notificacoes) return;
    if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const hojeIso = hojeISO();

    if(plano && plano.horasAlvo){
      const horasFeitas = horasRealizadasNaSemana(state.checkins, state.sessoes, semanaId);
      const pctFeito = Math.round((horasFeitas / plano.horasAlvo) * 100);
      const diaSemanaIdx = new Date(hojeIso + 'T00:00:00').getDay(); // 0=dom..6=sáb
      const diasDecorridos = (diaSemanaIdx + 6) % 7; // seg=0 ... dom=6
      const pctEsperado = Math.round(((diasDecorridos + 1) / 7) * 100);
      if(pctFeito < pctEsperado - 20){
        avisos.push(`meta semanal em ${pctFeito}% (esperado por volta de ${pctEsperado}% a essa altura da semana)`);

  function tocarBeepPomodoro(fase){
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      const ctx = new Ctx();
      const tons = fase === 'pausa' ? [660, 440] : [440, 660];
      tons.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const inicio = ctx.currentTime + i * 0.18;
        osc.start(inicio);
        osc.stop(inicio + 0.15);
      });
      setTimeout(() => ctx.close(), 800);
    } catch(e){ /* áudio indisponível — sem problema, é best-effort. */ }
  }
  function avisarTrocaDeFase(fase){
    tocarBeepPomodoro(fase);
    if(!state.preferencias.notificacoes) return;
    if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    try {
      new Notification('Gerenciador de Estudos', {
        body: fase === 'pausa' ? 'Pomodoro: 25 min de foco concluídos. Pausa de 5 min.' : 'Pomodoro: pausa concluída. De volta ao foco.',
        icon: './icons/icon-192.png',
      });
    } catch(e){ /* best-effort */ }
  }
