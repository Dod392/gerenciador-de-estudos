<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciador de Estudos</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0d11">
<style>
  :root{
    --bg:#0b0d11; --surface:#14171d; --card:#1a1e26;
    --fg:#e8eaed; --muted:#9aa0a6;
    --accent:#4f9dde; --accent-fg:#06121c;
    --ok:#3ecf8e; --warn:#e0a83e; --bad:#e05a4f;
    --border:#2a2f3a;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
    --radius-sm:8px; --radius:12px; --radius-lg:16px;
    --text-xs:12px; --text-sm:13px; --text-base:14px; --text-lg:16px; --text-xl:20px; --text-2xl:28px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 4px 16px rgba(0,0,0,.4);
    --tap:48px;
    --hoje-border:#374151; --hoje-shadow-card:0 4px 12px rgba(0,0,0,.4); --hoje-text-secondary:#b0b9c6;
    --status-not-started:#6b7280; --status-in-progress:#f59e0b; --status-review:#a855f7; --status-completed:#10b981;
    --status-pending:#f59e0b; --status-reviewed:#10b981; --status-high-priority:#ef4444;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  #app{max-width:480px;margin:0 auto;padding:var(--gap);}
  h1,h2,h3{margin:0 0 8px;}
  p{margin:0 0 8px;}
  .card{background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:var(--space-3);margin-bottom:var(--space-3);box-shadow:var(--shadow-sm);}
  button{font:inherit;min-height:var(--tap);border-radius:var(--radius);
    border:1px solid var(--border);background:var(--card);color:var(--fg);
    padding:0 16px;width:100%;margin-bottom:8px;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b0d10;font-weight:600;}
  button.ok{background:var(--ok);border-color:var(--ok);color:#0b0d10;}
  button.bad{background:var(--bad);border-color:var(--bad);color:#0b0d10;}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;margin-bottom:0;}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px;}
  input,select,textarea{width:100%;min-height:var(--tap);border-radius:var(--radius);
    border:1px solid var(--border);background:var(--bg);color:var(--fg);padding:0 12px;font:inherit;}
  textarea{padding:12px;min-height:80px;}
  nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;
    background:var(--card);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);z-index:10;}
  nav#tabs button{margin:0;border:none;border-radius:0;background:none;
    min-height:56px;font-size:12px;color:var(--muted);}
  nav#tabs button.active{color:var(--accent);font-weight:700;}
  small.muted{color:var(--muted);}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--border);}
  .badge.atrasado{background:var(--bad);color:#0b0d10;}
  button.badge{width:auto;min-height:32px;display:inline-block;margin:4px 8px 0 0;padding:2px 10px;font-size:12px;}

  #layout{display:flex;min-height:100vh;}
  #main{flex:1;min-width:0;}
  #app{max-width:1280px;margin:0 auto;padding:var(--space-6);}
  #sidebar{display:none;}
  #mais-sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;}
  #mais-sheet.hidden{display:none;}
  #mais-sheet .sheet-content{background:var(--surface);width:100%;border-radius:16px 16px 0 0;
    padding:var(--space-4);padding-bottom:calc(var(--space-4) + env(safe-area-inset-bottom));}
  #mais-sheet button{display:flex;align-items:center;gap:var(--space-3);justify-content:flex-start;text-align:left;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-4);}
  .grid-2{display:grid;grid-template-columns:1fr;gap:var(--space-4);}
  .stat-card{position:relative;}
  .stat-card .stat-label{font-size:var(--text-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .stat-value{font-size:var(--text-2xl);font-weight:650;margin-top:4px;}
  .stat-card .stat-icon{position:absolute;top:var(--space-4);right:var(--space-4);opacity:.5;font-size:18px;}
  .progress{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:6px;}
  .progress > i{display:block;height:100%;background:var(--accent);}
  table.data{width:100%;border-collapse:collapse;font-size:var(--text-sm);}
  table.data th{text-align:left;color:var(--muted);font-weight:600;font-size:var(--text-xs);
    text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--border);}
  table.data td{padding:8px;border-bottom:1px solid var(--border);}
  table.data tr:nth-child(even) td{background:rgba(255,255,255,.02);}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-4);}

  @media (min-width:900px){
    body{padding-bottom:0;}
    nav#tabs{display:none;}
    #mais-sheet{display:none !important;}
    #sidebar{display:flex;flex-direction:column;width:220px;flex-shrink:0;
      background:var(--surface);border-right:1px solid var(--border);
      padding:var(--space-4);position:sticky;top:0;height:100vh;box-sizing:border-box;}
    #sidebar.collapsed{width:64px;}
    #sidebar.collapsed .nav-label,#sidebar.collapsed .brand-text{display:none;}
    #sidebar-brand{font-weight:650;font-size:var(--text-lg);display:flex;gap:8px;align-items:center;}
    #sidebar-nav{display:flex;flex-direction:column;gap:4px;margin-top:var(--space-6);flex:1;}
    #sidebar-nav button{width:100%;min-height:44px;background:transparent;border:none;
      color:var(--muted);border-radius:var(--radius-sm);display:flex;align-items:center;
      gap:var(--space-3);text-align:left;padding:0 var(--space-3);}
    #sidebar-nav button.active{background:var(--card);color:var(--accent);font-weight:650;}
    #sidebar-toggle{background:transparent;border:1px solid var(--border);color:var(--muted);}
    .grid-2{grid-template-columns:1fr 1fr;}
  }

  /* === PLANEJAMENTO (redesign) === */
  .planejamento-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3);}
  .planejamento-header{display:flex;align-items:flex-start;gap:var(--space-3);}
  .planejamento-nav{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:2px;}
  .planejamento-nav b{font-size:var(--text-sm);font-weight:600;color:var(--muted);}
  .planejamento-badges{margin-top:var(--space-3);}
  .planejamento-progresso{margin-top:var(--space-3);}
  .planejamento-progresso-label{display:flex;justify-content:space-between;font-size:var(--text-sm);margin-top:var(--space-2);}
  .planejamento-progresso-label span{color:var(--muted);}

  .dia-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-2);}
  @media(max-width:900px){.dia-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:560px){.dia-grid{grid-template-columns:repeat(2,1fr);}}
  .dia-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-sm);padding:var(--space-2);display:flex;flex-direction:column;gap:var(--space-1);min-height:120px;}
  .dia-card.hoje{border-color:var(--accent);}
  .dia-card-header{text-align:center;padding-bottom:4px;border-bottom:1px solid var(--border);}
  .dia-card-label{font-size:var(--text-xs);color:var(--muted);font-weight:650;}
  .dia-card-date{font-size:var(--text-sm);font-weight:650;}
  .dia-card-total{font-size:10px;color:var(--muted);}
  .dia-card-meta-row{margin:2px 0;}
  .dia-card-meta-input{width:100%;min-height:26px;height:26px;padding:0 6px;font-size:10px;
    border-radius:6px;text-align:center;}
  .dia-card-atividades{display:flex;flex-direction:column;gap:4px;flex:1;}
  .dia-atividade{display:flex;align-items:flex-start;gap:4px;background:var(--card);border-radius:var(--radius-sm);padding:4px;}
  .dia-atividade.concluida .dia-atividade-assunto{text-decoration:line-through;color:var(--muted);}
  .dia-atividade-check{width:20px;height:20px;min-height:20px;flex-shrink:0;padding:0;margin:2px 0 0;
    border-radius:50%;font-size:11px;line-height:1;color:var(--ok);border-color:var(--ok);}
  .dia-atividade-info{flex:1;min-width:0;}
  .dia-atividade-assunto{font-size:var(--text-xs);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dia-atividade-meta{font-size:10px;color:var(--muted);}
  .dia-atividade-remover{width:18px;height:18px;min-height:18px;flex-shrink:0;padding:0;margin:2px 0 0;
    border:none;background:transparent;color:var(--muted);font-size:14px;line-height:1;}
  .dia-card-add{width:100%;min-height:32px;font-size:var(--text-xs);background:transparent;color:var(--accent);
    border:1px dashed var(--border);margin:0;padding:0;}

  .assunto-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-2);}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:4px 6px 4px 12px;font-size:var(--text-sm);}
  .chip.atrasado{border-color:var(--warn);}
  .chip button{width:20px;height:20px;min-height:20px;flex-shrink:0;padding:0;margin:0;border:none;
    background:var(--border);border-radius:50%;font-size:13px;line-height:1;color:var(--fg);}
  .chip-sugestao{width:auto;min-height:28px;padding:4px 12px;margin:0;border-radius:999px;
    font-size:var(--text-xs);background:transparent;border:1px dashed var(--border);color:var(--muted);}
  .chip-sugestao:hover{border-color:var(--accent);color:var(--accent);}

  .dias-checkbox-row{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-2);}
  .dia-checkbox{display:flex;align-items:center;gap:6px;width:auto;font-size:var(--text-sm);color:var(--fg);margin:0;}
  .dia-checkbox input{width:auto;min-height:auto;flex-shrink:0;}
  .meta-opcionais{margin:var(--space-3) 0;border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);}
  .meta-opcionais summary{cursor:pointer;font-size:var(--text-sm);color:var(--muted);}

  .resumo-meta-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--border);}
  .resumo-meta-item:last-child{border-bottom:none;}
  .resumo-meta-item .stat-icon{font-size:20px;opacity:.8;}

  /* === MAPA (redesign) === */
  .mapa-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3);}
  .mapa-busca{flex:0 1 280px;min-width:200px;}
  .mapa-busca input{margin:0;}
  .mapa-filtros-row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2);}
  .mapa-filtros-label{font-size:var(--text-sm);color:var(--muted);flex:0 0 auto;}
  .mapa-filtros-botoes{display:flex;gap:6px;flex-wrap:wrap;}
  .mapa-filtro-btn{width:auto;min-height:32px;padding:0 12px;margin:0;font-size:var(--text-xs);
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;}
  .mapa-filtro-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600;}
  .mapa-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor;}
  .mapa-filtro-btn[data-filtro-status="nao_iniciado"] .mapa-dot{color:var(--status-not-started);}
  .mapa-filtro-btn[data-filtro-status="estudado"] .mapa-dot{color:var(--status-in-progress);}
  .mapa-filtro-btn[data-filtro-status="revisado"] .mapa-dot{color:var(--status-review);}
  .mapa-filtro-btn[data-filtro-status="dominado"] .mapa-dot{color:var(--status-completed);}
  .mapa-resumo-grid{margin-top:var(--space-4);}

  .mapa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);margin-bottom:var(--space-3);}
  @media(max-width:1100px){.mapa-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.mapa-grid{grid-template-columns:1fr;}}
  .mapa-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:var(--space-3);position:relative;transition:background .15s;}
  .mapa-card:hover{background:var(--surface);}
  .mapa-card-icon{font-size:22px;margin-bottom:6px;}
  .mapa-card-nome{font-weight:650;font-size:var(--text-base);margin-bottom:8px;padding-right:36px;}
  .mapa-status-badge{display:inline-block;margin-bottom:6px;border:none;}
  .mapa-status-badge.status-not-started{background:var(--status-not-started);color:#fff;}
  .mapa-status-badge.status-in-progress{background:var(--status-in-progress);color:#1a1206;}
  .mapa-status-badge.status-review{background:var(--status-review);color:#fff;}
  .mapa-status-badge.status-completed{background:var(--status-completed);color:#062117;}
  .mapa-card-concursos{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .mapa-concurso-badge{background:rgba(79,157,222,.18);color:var(--accent);border:none;}
  .mapa-card-pct{position:absolute;bottom:var(--space-3);right:var(--space-3);font-size:var(--text-xs);color:var(--muted);}

  /* === ERROS (redesign) === */
  .erros-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3);}
  .erros-header-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;flex:0 1 420px;}
  .erros-header-actions input{margin:0;flex:1 1 220px;}
  .erros-header-actions button{width:auto;min-height:44px;margin:0;padding:0 16px;flex:0 0 auto;white-space:nowrap;}
  .erros-assunto-select{width:auto;min-height:32px;margin:0;padding:0 10px;font-size:var(--text-xs);flex:0 0 auto;margin-left:auto;}
  .erros-stat-delta{font-size:10px;color:var(--muted);margin-top:2px;}
  .erros-stat-delta.positivo{color:var(--ok);}
  .erros-stat-delta.negativo{color:var(--bad);}

  .erros-lista{display:flex;flex-direction:column;gap:var(--space-3);}
  .erro-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .erro-card-header{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3);cursor:pointer;}
  .erro-card-titulo{flex:1 1 200px;min-width:0;}
  .erro-card-assunto-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .erro-card-preview{font-size:var(--text-sm);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .erro-card.expandido .erro-card-preview{display:none;}
  .erro-card-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;}
  .erro-prioridade-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:var(--text-xs);font-weight:600;white-space:nowrap;}
  .erro-prioridade-badge.prioridade-alta{background:var(--status-high-priority);color:#fff;}
  .erro-prioridade-badge.prioridade-media{background:var(--status-pending);color:#1a1206;}
  .erro-prioridade-badge.prioridade-baixa{background:var(--border);color:var(--muted);}
  .erro-card-data{font-size:var(--text-xs);color:var(--muted);white-space:nowrap;}
  .erro-card-chevron{width:auto;min-height:auto;padding:2px 6px;margin:0;background:transparent;border:none;color:var(--muted);flex:0 0 auto;}

  .erro-card-body{display:grid;grid-template-columns:1fr;gap:var(--space-3);padding:0 var(--space-3) var(--space-3);}
  @media(min-width:700px){.erro-card-body{grid-template-columns:1fr 1fr;}}
  .erro-card-col-titulo{font-size:var(--text-sm);font-weight:600;margin-bottom:4px;}
  .erro-col-bad{color:var(--bad);}
  .erro-col-ok{color:var(--ok);}
  .erro-card-footer{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);flex-wrap:wrap;
    padding:var(--space-2) var(--space-3);border-top:1px solid var(--border);}
  .erro-card-footer-info{font-size:var(--text-xs);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .erro-card-footer-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .erro-card-footer-actions button{width:auto;min-height:36px;margin:0;padding:0 14px;font-size:var(--text-sm);}
  .erro-menu-wrap{position:relative;}
  .erro-menu-wrap>button{min-height:36px;min-width:36px;padding:0;}
  .erro-menu-dropdown{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:5;min-width:120px;}
  .erro-menu-dropdown button{width:100%;margin:0;border:none;border-radius:0;}

  .erros-dica{padding:var(--space-2) 0;border-bottom:1px solid var(--border);}
  .erros-dica:last-child{border-bottom:none;}
  .erros-dica b{font-size:var(--text-sm);}
  .erros-dica p{margin:2px 0 0;font-size:var(--text-xs);}

  .revisao-sessao-panel{max-width:480px;}
  .revisao-sessao-progresso{font-size:var(--text-sm);color:var(--muted);margin-bottom:4px;}
  .revisao-sessao-secao{margin-top:var(--space-3);}
  .revisao-sessao-secao p{margin-top:4px;}

  /* === DESEMPENHO (redesign) === */
  .desempenho-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:0 1 auto;}
  .desempenho-filtros select{width:auto;min-height:36px;margin:0;padding:0 10px;font-size:var(--text-xs);}
  .desempenho-filtros button{width:auto;min-height:36px;margin:0;padding:0 10px;font-size:var(--text-xs);}
  .desempenho-novo-ciclo-form{display:flex;gap:8px;align-items:center;margin-top:var(--space-2);flex-wrap:wrap;}
  .desempenho-novo-ciclo-form input{width:auto;min-height:36px;margin:0;flex:1 1 160px;}
  .desempenho-novo-ciclo-form button{width:auto;min-height:36px;margin:0;padding:0 12px;}

  .desempenho-kpi-card{position:relative;}
  .desempenho-kpi-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:4px;}
  .sparkline{flex-shrink:0;opacity:.9;}
  .desempenho-kpi-delta{font-size:10px;color:var(--muted);margin-top:6px;}
  .desempenho-kpi-delta.positivo{color:var(--ok);}
  .desempenho-kpi-delta.negativo{color:var(--bad);}

  .desempenho-disciplina-row{display:flex;align-items:center;gap:var(--space-3);padding:6px 0;}
  .desempenho-disciplina-nome{flex:0 0 140px;font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .desempenho-disciplina-bar-track{flex:1;height:10px;border-radius:999px;background:var(--border);overflow:hidden;}
  .desempenho-disciplina-bar-fill{height:100%;border-radius:999px;background:var(--accent);}
  .desempenho-disciplina-pct{flex:0 0 40px;text-align:right;font-size:var(--text-sm);color:var(--muted);}

  .desempenho-pizza-wrap{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;}
  .desempenho-pizza-canvas-wrap{position:relative;width:140px;height:140px;flex-shrink:0;}
  .desempenho-pizza-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  .desempenho-pizza-centro b{font-size:var(--text-lg);}
  .desempenho-pizza-centro small{color:var(--muted);font-size:var(--text-xs);}
  .desempenho-pizza-legend{flex:1;min-width:160px;}
  .desempenho-pizza-legend-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:var(--text-sm);}
  .desempenho-pizza-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .desempenho-pizza-legend-item span{flex:1;}

  .desempenho-constancia-table{width:100%;border-collapse:collapse;font-size:var(--text-xs);}
  .desempenho-constancia-table th,.desempenho-constancia-table td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--border);}
  .desempenho-constancia-table th:first-child,.desempenho-constancia-table td:first-child{text-align:left;color:var(--muted);}

<body>
  <div id="layout">
    <aside id="sidebar">
      <div id="sidebar-brand">📚 <span class="brand-text">Estudos</span></div>
      <nav id="sidebar-nav"></nav>
      <button id="sidebar-toggle" title="Recolher menu">«</button>
    </aside>
    <div id="main">
      <div id="app"></div>
    </div>
  </div>
  <nav id="tabs"></nav>
  <div id="mais-sheet" class="hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
  /* === HELPERS (Tarefa 2) === */
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function hojeISO(){ return new Date().toISOString().slice(0,10); }
  function addDays(iso, n){
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }
  function segundaFeiraDaSemana(iso){
    const d = new Date(iso + 'T00:00:00');
    const diaSemana = d.getDay(); // 0=domingo .. 6=sábado
    const offset = diaSemana === 0 ? -6 : 1 - diaSemana;
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0,10);
  }
  /* === STATE (Tarefa 2) === */
  const STORAGE_KEY = 'estudos_v1';
  const SEED_CONTEUDO = [
    'PNMA (6.938/81)','SNUC (9.985/00)','LC 140/2011','PNRH','CONAMA 357',
    'CONAMA 430','PNRS','NBR 10004','licenciamento ambiental',
    'abastecimento de água','tratamento de água','qualidade da água',
    'tratamento de esgoto','poluição hídrica','efluentes',
    'resíduos sólidos','Português','Inglês'
  ];

  function seedState(){
    return {
      meta: { provaData: '2026-11-29', cicloInicio: hojeISO() },
      checkins: [],
      erros: [],
      conteudo: SEED_CONTEUDO.map(assunto => ({ assunto, status:'nao_iniciado', concurso:'ambos', atualizadoEm: hojeISO() })),
      concursos: ['Transpetro', 'INEA'],
      planejamento: [],
      sessoes: [],
      sessaoEmAndamento: null,
      ciclos: [{ id: 'ciclo-1', nome: '1º Ciclo', inicio: hojeISO() }],
      contadorRevisoes: 0,
    };
  }

  function estadoValido(obj){
    return !!obj && typeof obj.meta === 'object' && obj.meta !== null &&
      Array.isArray(obj.checkins) && Array.isArray(obj.erros) &&
      Array.isArray(obj.conteudo) && Array.isArray(obj.planejamento);
  }

  function loadState(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return seedState();
      const parsed = JSON.parse(raw);
      if(!estadoValido(parsed)) return seedState();
      return normalizarCamposNovos(parsed);
    } catch(e){
      return seedState();
    }
  }

  function saveState(s){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      return true;
    } catch(e){
      alert('Não foi possível salvar: armazenamento indisponível ou cheio.');
      return false;
    }
  }

  let state = loadState();
  /* === HOJE (Tarefa 3) === */
  function diasAte(hojeIso, alvoIso){
    const a = new Date(hojeIso + 'T00:00:00');
    const b = new Date(alvoIso + 'T00:00:00');
    return Math.round((b - a) / 86400000);
  }

  function registrarCheckin(state, data, status){
    const idx = state.checkins.findIndex(c => c.data === data);
    if(idx === -1){
      state.checkins.push({ data, status, minutos:null, assunto:null, questoes:null, acertos:null, obs:'' });
    } else {
      state.checkins[idx].status = status;
    }
    return state;
  }

  function checkinDeHoje(){
    return state.checkins.find(c => c.data === hojeISO());
  }

  /* === HOJE (redesign — sessões) === */
  function calcularErros(questoes, acertos){
    if(questoes == null || acertos == null) return null;
    return Math.max(0, questoes - acertos);
  }
  function calcularAproveitamento(questoes, acertos){
    if(!questoes) return null;
    return Math.round(((acertos||0) / questoes) * 100);
  }
  function criarSessao({data, tipo, assunto, minutos, questoes, acertos, paginas, concluida, dificuldade, cartoes, obs}){
    return {
      id: String(Date.now()) + Math.random().toString(36).slice(2,7),
      data, tipo, assunto: assunto || null, minutos: Number(minutos) || 0,
      questoes: tipo === 'questoes' ? (Number(questoes) || 0) : null,
      acertos: tipo === 'questoes' ? (Number(acertos) || 0) : null,
      paginas: tipo === 'teoria' && paginas ? Number(paginas) : null,
      concluida: tipo === 'teoria' ? !!concluida : null,
      dificuldade: tipo === 'revisao' ? (dificuldade || null) : null,
      cartoes: tipo === 'anki' && cartoes ? Number(cartoes) : null,
      obs: obs || '',
      criadoEm: new Date().toISOString(),
    };
  }
  function avancarStatusPorAtividade(state, assunto, hojeIso){
    if(!assunto) return null;
    const item = state.conteudo.find(c => c.assunto === assunto);
    if(!item || item.status !== 'nao_iniciado') return null;
    item.status = 'estudado';
    item.atualizadoEm = hojeIso;
    return item;
  }
  function registrarSessao(state, hojeIso, dados){
    const sessao = criarSessao({data: hojeIso, ...dados});
    state.sessoes.push(sessao);
    avancarStatusPorAtividade(state, sessao.assunto, hojeIso);
    return sessao;
  }
  function iniciarSessaoEmAndamento(state, {assunto, tipo, origem}){
    state.sessaoEmAndamento = { assunto: assunto || null, tipo: tipo || null, origem: origem || null, inicioEm: new Date().toISOString() };
    return state.sessaoEmAndamento;
  }
  function finalizarSessaoEmAndamento(state){
    const sessao = state.sessaoEmAndamento;
    if(!sessao) return null;
    const minutos = Math.max(1, Math.round((Date.now() - new Date(sessao.inicioEm).getTime()) / 60000));
    state.sessaoEmAndamento = null;
    return { assunto: sessao.assunto, tipo: sessao.tipo, origem: sessao.origem, minutos };
  }
  function atualizarSessao(state, id, dados){
    const idx = state.sessoes.findIndex(s => s.id === id);
    if(idx === -1) return null;
    const original = state.sessoes[idx];
    const atualizado = criarSessao({data: original.data, ...dados});
    atualizado.id = original.id;
    atualizado.criadoEm = original.criadoEm;
    state.sessoes[idx] = atualizado;
    return atualizado;
  }
  function excluirSessao(state, id){
    const idx = state.sessoes.findIndex(s => s.id === id);
    if(idx === -1) return false;
    state.sessoes.splice(idx, 1);
    return true;
  }
  function normalizarCamposNovos(s){
    if(!Array.isArray(s.sessoes)) s.sessoes = [];
    if(!s.sessaoEmAndamento || typeof s.sessaoEmAndamento !== 'object') s.sessaoEmAndamento = null;
    if(!Array.isArray(s.concursos) || !s.concursos.length) s.concursos = ['Transpetro', 'INEA'];
    if(!Array.isArray(s.ciclos) || !s.ciclos.length) s.ciclos = [{ id: 'ciclo-1', nome: '1º Ciclo', inicio: s.meta?.cicloInicio || hojeISO() }];
    if(typeof s.contadorRevisoes !== 'number') s.contadorRevisoes = 0;
    return s;
  }

  /* === ERROS (Tarefa 4) === */
  const GRAU_ORDEM = ['deficiencia','erro_novo','reforcado','corrigido'];
  const GRAU_DIAS = { deficiencia:1, erro_novo:2, reforcado:7, corrigido:21 };
  const GRAU_LABEL = { deficiencia:'deficiência confirmada', erro_novo:'erro novo', reforcado:'reforçado', corrigido:'corrigido' };

  function criarErro(state, {assunto, oQueErrei, regraCorreta, origemQuestao}){
    const hoje = hojeISO();
    const erro = {
      id: String(Date.now()) + Math.random().toString(36).slice(2,7),
      assunto, oQueErrei, regraCorreta,
      origemQuestao: !!origemQuestao,
      grau: 'erro_novo',
      proximaRevisao: addDays(hoje, GRAU_DIAS.erro_novo),
      ultimaRevisao: null,
      criadoEm: hoje,
    };
    state.erros.push(erro);
    return erro;
  }

  function graduarAcerto(erro){
    const i = GRAU_ORDEM.indexOf(erro.grau);
    const novoGrau = i < GRAU_ORDEM.length - 1 ? GRAU_ORDEM[i+1] : erro.grau;
    erro.grau = novoGrau;
    erro.proximaRevisao = addDays(hojeISO(), GRAU_DIAS[novoGrau]);
    erro.ultimaRevisao = hojeISO();
    return erro;
  }

  function graduarErro(erro){
    erro.grau = 'deficiencia';
    erro.proximaRevisao = addDays(hojeISO(), GRAU_DIAS.deficiencia);
    erro.ultimaRevisao = hojeISO();
    return erro;
  }

  function atualizarErro(state, id, dados){
    const erro = state.erros.find(e => e.id === id);
    if(!erro) return null;
    erro.assunto = dados.assunto;
    erro.oQueErrei = dados.oQueErrei;
    erro.regraCorreta = dados.regraCorreta;
    erro.origemQuestao = !!dados.origemQuestao;
    return erro;
  }

  function excluirErro(state, id){
    const idx = state.erros.findIndex(e => e.id === id);
    if(idx === -1) return false;
    state.erros.splice(idx, 1);
    return true;
  }

  function categoriaPorAssunto(nome){
    const n = nome.toLowerCase();
    if(n.includes('resolução') || n.includes('resolucao') || n.includes('conama') || n.includes('nbr')) return 'Resolução';
    if(n.includes('lei') || n.includes('lc ') || n.includes('pn') || n.includes('constituição') || n.includes('constituicao')) return 'Legislação';
    return 'Geral';
  }

  const PRIORIDADE_POR_GRAU = { deficiencia:'alta', erro_novo:'media', reforcado:'baixa', corrigido:'baixa' };
  const PRIORIDADE_LABEL = { alta:'Alta prioridade', media:'Média prioridade', baixa:'Baixa prioridade' };
  function prioridadeErro(erro){
    return PRIORIDADE_POR_GRAU[erro.grau] || 'baixa';
  }

  function filtrarErros(erros, { filtro, assunto, busca, hojeIso }){
    return erros.filter(e => {
      if(filtro === 'pendentes' && e.proximaRevisao > hojeIso) return false;
      if(filtro === 'revisados' && !e.ultimaRevisao) return false;
      if(filtro === 'alta_prioridade' && prioridadeErro(e) !== 'alta') return false;
      if(assunto && assunto !== 'todos' && e.assunto !== assunto) return false;
      if(busca){
        const termo = busca.toLowerCase();
        if(!e.assunto.toLowerCase().includes(termo) && !e.oQueErrei.toLowerCase().includes(termo)) return false;
      }
      return true;
    });
  }

  function statsErros(erros, hojeIso){
    const total = erros.length;
    const pendentes = erros.filter(e => e.proximaRevisao <= hojeIso).length;
    const seteDiasAtras = addDays(hojeIso, -7);
    const catorzeDiasAtras = addDays(hojeIso, -14);
    const criadosUltimos7Dias = erros.filter(e => e.criadoEm >= seteDiasAtras).length;
    const revisadosEstaSemana = erros.filter(e => e.ultimaRevisao && e.ultimaRevisao >= seteDiasAtras).length;
    const revisadosSemanaAnterior = erros.filter(e => e.ultimaRevisao && e.ultimaRevisao >= catorzeDiasAtras && e.ultimaRevisao < seteDiasAtras).length;
    const revisoesHoje = erros.filter(e => e.ultimaRevisao === hojeIso).length;
    const taxaRevisao = total ? Math.round((erros.filter(e => e.ultimaRevisao).length / total) * 100) : 0;
    const porAssunto = {};
    erros.forEach(e => { porAssunto[e.assunto] = (porAssunto[e.assunto]||0) + 1; });
    let assuntoMaisFrequente = null, maxCount = 0;
    Object.entries(porAssunto).forEach(([nome, count]) => { if(count > maxCount){ maxCount = count; assuntoMaisFrequente = nome; } });
    return { total, pendentes, criadosUltimos7Dias, revisadosEstaSemana, deltaRevisados: revisadosEstaSemana - revisadosSemanaAnterior, revisoesHoje, taxaRevisao, assuntoMaisFrequente, assuntoMaisFrequenteCount: maxCount };
  }

  function ordenarErrosPorRevisao(erros){
    return [...erros].sort((a,b) => a.proximaRevisao < b.proximaRevisao ? -1 : a.proximaRevisao > b.proximaRevisao ? 1 : 0);
  }

  function filaRevisao(erros, hojeIso){
    return ordenarErrosPorRevisao(erros.filter(e => e.proximaRevisao <= hojeIso));
  }

  function ordenarErros(erros, criterio){
    const copia = [...erros];
    if(criterio === 'prioridade'){
      const peso = { alta:0, media:1, baixa:2 };
      return copia.sort((a,b) => peso[prioridadeErro(a)] - peso[prioridadeErro(b)]);
    }
    if(criterio === 'assunto') return copia.sort((a,b) => a.assunto.localeCompare(b.assunto));
    if(criterio === 'recente') return copia.sort((a,b) => b.criadoEm.localeCompare(a.criadoEm));
    return ordenarErrosPorRevisao(copia);
  }
  function diasAtrasoLabel(proximaRevisao, hojeIso){
    if(proximaRevisao > hojeIso) return `Próxima ${proximaRevisao}`;
    const dias = diasAte(proximaRevisao, hojeIso);
    return dias === 0 ? 'Vence hoje' : `Atrasada há ${dias} dia${dias===1?'':'s'}`;
  }
  function iniciarSessaoRevisao(erros, hojeIso){
    const fila = filaRevisao(erros, hojeIso).map(e => e.id);
    if(!fila.length) return null;
    return { fila, indice: 0, revelado: false };
  }
  function contarErrosPorAssunto(erros, assunto, excluirId){
    return erros.filter(e => e.assunto === assunto && e.id !== excluirId).length;

  /* === MAPA (Tarefa 6) === */
  const STATUS_CONTEUDO_ORDEM = ['nao_iniciado','estudado','revisado','dominado'];
  const STATUS_CONTEUDO_LABEL = { nao_iniciado:'Não iniciado', estudado:'Em andamento', revisado:'Revisão', dominado:'Concluído' };
  const STATUS_CONTEUDO_COR = { nao_iniciado:'not-started', estudado:'in-progress', revisado:'review', dominado:'completed' };
  const STATUS_CONTEUDO_PCT = { nao_iniciado:0, estudado:33, revisado:67, dominado:100 };
  function proximoStatusConteudo(atual){
    const i = STATUS_CONTEUDO_ORDEM.indexOf(atual);
    return STATUS_CONTEUDO_ORDEM[(i+1) % STATUS_CONTEUDO_ORDEM.length];
  }
  function slugConcurso(nome){
    return nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'');
  }
  function ordemConcursoDinamica(state){
    return ['ambos', ...(state.concursos||[]).map(slugConcurso)];
  }
  function proximoConcurso(atual, ordem){
    const i = ordem.indexOf(atual);
    const seguro = i === -1 ? 0 : i;
    return ordem[(seguro+1) % ordem.length];
  }
  function concursoLabel(state, valor){
    if(valor === 'ambos') return 'Múltiplos';
    const nome = (state.concursos||[]).find(n => slugConcurso(n) === valor);
    return nome || valor;
  }
  function concursosDoItem(state, concurso){
    if(concurso === 'ambos') return state.concursos && state.concursos.length ? state.concursos : ['Múltiplos'];
    return [concursoLabel(state, concurso)];
  }
  function adicionarConcurso(state, nome){
    const trimmed = (nome || '').trim();
    if(!trimmed) return null;
    if(!state.concursos) state.concursos = [];
    const slug = slugConcurso(trimmed);
    const existe = state.concursos.some(n => slugConcurso(n) === slug);
    if(existe) return null;
    state.concursos.push(trimmed);
    return trimmed;
  }
  function iconePorAssunto(nome){
    const n = nome.toLowerCase();
    if(n.includes('água') || n.includes('agua') || n.includes('hídric') || n.includes('hidric')) return '💧';
    if(n.includes('resíduo') || n.includes('residuo') || n.includes('esgoto')) return '🗑️';
    if(n.includes('licenciamento')) return '🏛️';
    if(n.includes('conama') || n.includes('nbr') || n.includes('pnrs') || n.includes('pnma') || n.includes('snuc') || n.includes('pnrh') || n.includes('lc ')) return '📜';
    if(n.includes('inglês') || n.includes('ingles') || n.includes('português') || n.includes('portugues')) return '🗣️';
    return '📘';
  }
  function adicionarAssunto(state, nome){
    const trimmed = (nome || '').trim();
    if(!trimmed) return null;
    const existe = state.conteudo.some(c => c.assunto.toLowerCase() === trimmed.toLowerCase());
    if(existe) return null;
    const novo = { assunto: trimmed, status: 'nao_iniciado', concurso: 'ambos', atualizadoEm: null };
    state.conteudo.push(novo);

  function filtrarConteudo(conteudo, { status, concurso, busca }){

      if(busca && !c.assunto.toLowerCase().includes(busca.toLowerCase())) return false;
      return true;
    });
  }

  /* === SEMANA (Tarefa 7) === */
  function semanaAtualId(){
    return segundaFeiraDaSemana(hojeISO());
  }

  function obterPlano(state, semanaId){
    return state.planejamento.find(p => p.semanaId === semanaId);
  }

  function salvarPlano(state, semanaId, {assuntosAlvo, diasAlvo, horasAlvo, diasDisponiveis, horario, concursosPrioritarios}){
    const existente = obterPlano(state, semanaId);
    if(existente){
      existente.assuntosAlvo = assuntosAlvo;
      existente.diasAlvo = diasAlvo;
      existente.horasAlvo = horasAlvo;
      existente.diasDisponiveis = diasDisponiveis || [];
      existente.horario = horario || '';
      existente.concursosPrioritarios = concursosPrioritarios || [];
      return existente;
    }
    const novo = { semanaId, assuntosAlvo, diasAlvo, horasAlvo,
      diasDisponiveis: diasDisponiveis || [], horario: horario || '', concursosPrioritarios: concursosPrioritarios || [],
      atividadesPorDia: {} };
    state.planejamento.push(novo);
    return novo;
  }

  const ATIVIDADE_DIA_TIPO_LABEL = { teoria:'Teoria', questoes:'Questões', revisao:'Revisão' };

  function adicionarAtividadeDia(state, semanaId, dataIso, {assunto, tipo, minutos}){
    let plano = obterPlano(state, semanaId);
    if(!plano){
      plano = { semanaId, assuntosAlvo: [], diasAlvo: 0, horasAlvo: 0, diasDisponiveis: [], horario: '', concursosPrioritarios: [], atividadesPorDia: {} };
      state.planejamento.push(plano);
    }
    if(!plano.atividadesPorDia) plano.atividadesPorDia = {};
    if(!plano.atividadesPorDia[dataIso]) plano.atividadesPorDia[dataIso] = [];
    const atividade = { id: String(Date.now()) + Math.random().toString(36).slice(2,7), assunto: assunto || null, tipo, minutos: Number(minutos) || 0, concluida: false };
    plano.atividadesPorDia[dataIso].push(atividade);
    return atividade;
  }

  function removerAtividadeDia(state, semanaId, dataIso, atividadeId){
    const lista = obterPlano(state, semanaId)?.atividadesPorDia?.[dataIso];
    if(!lista) return false;
    const idx = lista.findIndex(a => a.id === atividadeId);
    if(idx === -1) return false;
    lista.splice(idx, 1);
    return true;
  }

  function alternarConcluidaAtividadeDia(state, semanaId, dataIso, atividadeId){
    const item = obterPlano(state, semanaId)?.atividadesPorDia?.[dataIso]?.find(a => a.id === atividadeId);
    if(!item) return null;
    item.concluida = !item.concluida;
    if(item.concluida) avancarStatusPorAtividade(state, item.assunto, dataIso);
    return item;
  }

  function dentroDaSemana(dataIso, semanaId){
    return dataIso >= semanaId && dataIso <= addDays(semanaId, 6);
  }

  function diasRealizadosNaSemana(checkins, sessoes, semanaId){
    const diasComCheckin = checkins.filter(c => c.status !== 'nao' && dentroDaSemana(c.data, semanaId)).map(c => c.data);
    const diasComSessao = sessoes.filter(s => dentroDaSemana(s.data, semanaId)).map(s => s.data);
    return new Set([...diasComCheckin, ...diasComSessao]).size;
  }

  function horasRealizadasNaSemana(checkins, sessoes, semanaId){
    const diasComDados = new Set([
      ...checkins.filter(c => dentroDaSemana(c.data, semanaId)).map(c => c.data),
      ...sessoes.filter(s => dentroDaSemana(s.data, semanaId)).map(s => s.data),
    ]);
    const minutos = [...diasComDados].reduce((soma, data) => {
      const c = checkins.find(x => x.data === data);
      const sessoesDoDia = sessoes.filter(s => s.data === data);
      return soma + minutosNoDia(c, sessoesDoDia);
    }, 0);
    return Math.round((minutos / 60) * 10) / 10;
  }

  function assuntosTocadosNaSemana(state, semanaId){
    const doCheckin = state.checkins
      .filter(c => dentroDaSemana(c.data, semanaId) && c.assunto)
      .map(c => c.assunto);
    const doMapa = state.conteudo
      .filter(c => c.atualizadoEm && dentroDaSemana(c.atualizadoEm, semanaId))
      .map(c => c.assunto);
    const doSessoes = (state.sessoes || [])
      .filter(s => dentroDaSemana(s.data, semanaId) && s.assunto)
      .map(s => s.assunto);
    return [...new Set([...doCheckin, ...doMapa, ...doSessoes])];
  }

  function assuntosAtrasadosNaSemana(assuntosAlvo, tocados){
    return assuntosAlvo.filter(a => !tocados.includes(a));
  }

  /* === DESEMPENHO (Tarefa 8) === */
  function agregarPorAssunto(checkins, sessoes = []){
    const map = new Map();
    for(const c of checkins){
      if(!c.assunto || !c.questoes) continue;
      const cur = map.get(c.assunto) || {assunto:c.assunto, questoes:0, acertos:0};
      cur.questoes += c.questoes;
      cur.acertos += c.acertos || 0;
      map.set(c.assunto, cur);
    }
    for(const s of sessoes){
      if(s.tipo !== 'questoes' || !s.assunto || !s.questoes) continue;
      const cur = map.get(s.assunto) || {assunto:s.assunto, questoes:0, acertos:0};
      cur.questoes += s.questoes;
      cur.acertos += s.acertos || 0;
      map.set(s.assunto, cur);
    }
    return [...map.values()].map(x => ({...x, pct: x.questoes ? Math.round((x.acertos/x.questoes)*100) : 0}));
  }

  function diasEstudados(checkins, sessoes){
    const diasComCheckin = checkins.filter(c => c.status !== 'nao').map(c => c.data);
    const diasComSessao = sessoes.map(s => s.data);
    return new Set([...diasComCheckin, ...diasComSessao]).size;
  }

  function diasDeCiclo(cicloInicioIso, hojeIso){
    const a = new Date(cicloInicioIso + 'T00:00:00');
    const b = new Date(hojeIso + 'T00:00:00');
    return Math.round((b - a) / 86400000) + 1;
  }

  function piores5(agregado){
    return [...agregado].filter(a => a.questoes > 0).sort((a,b) => a.pct - b.pct).slice(0,5);
  }

  function totalQuestoes(checkins){ return checkins.reduce((s,c) => s + (c.questoes||0), 0); }
  function totalHorasEstudadas(checkins, sessoes){
    const diasComDados = new Set([...checkins.map(c => c.data), ...sessoes.map(s => s.data)]);
    const minutos = [...diasComDados].reduce((soma, data) => {
      const c = checkins.find(x => x.data === data);
      const sessoesDoDia = sessoes.filter(s => s.data === data);
      return soma + minutosNoDia(c, sessoesDoDia);
    }, 0);
    return Math.round((minutos/60)*10)/10;
  }

  function baixarArquivo(nome, conteudo, tipo){
    const blob = new Blob([conteudo], {type: tipo});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

    if(!estadoValido(parsed)){
      throw new Error('JSON inválido: formato inesperado');

    state = normalizarCamposNovos(parsed);
    saveState(state);

  function copiarTexto(texto){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(
        () => alert('JSON copiado! Cole em um app de notas/mensagens pra guardar, ou direto no campo "colar JSON" no outro aparelho.'),
        () => copiarTextoFallback(texto)
      );
    } else {
      copiarTextoFallback(texto);
    }
  }

  function copiarTextoFallback(texto){
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try {
      document.execCommand('copy');
      alert('JSON copiado! Cole em um app de notas/mensagens pra guardar, ou direto no campo "colar JSON" no outro aparelho.');
    } catch(e){
      alert('Não foi possível copiar automaticamente. Selecione o texto exportado manualmente.');
    }
    document.body.removeChild(ta);
  }

  /* === DASHBOARD (redesign, Tarefa 2) === */
  function calcularSequencia(checkins, sessoes, hojeIso){
    const diasComCheckin = checkins.filter(c => c.status !== 'nao').map(c => c.data);
    const diasComSessao = sessoes.map(s => s.data);
    const estudados = new Set([...diasComCheckin, ...diasComSessao]);
    let dia = hojeIso;
    if(!estudados.has(dia)) dia = addDays(dia, -1);
    let sequencia = 0;
    while(estudados.has(dia)){ sequencia++; dia = addDays(dia, -1); }
    return sequencia;
  }
  function pctCronograma(conteudo){
    if(!conteudo.length) return 0;
    const tocados = conteudo.filter(c => c.status !== 'nao_iniciado').length;
    return Math.round((tocados / conteudo.length) * 100);
  }
  function minutosNoDia(checkin, sessoesDoDia){
    const minutosSessoes = sessoesDoDia.reduce((s,x) => s + (x.minutos||0), 0);
    const minutosManual = checkin?.minutos || 0;
    return minutosSessoes + minutosManual;
  }
  function horasNoDia(checkins, sessoes, dataIso){
    const c = checkins.find(x => x.data === dataIso);
    const sessoesDoDia = sessoes.filter(s => s.data === dataIso);
    const minutos = minutosNoDia(c, sessoesDoDia);
    return Math.round((minutos/60)*10)/10;
  }
  function horasPorDiaDaSemana(checkins, sessoes, semanaId){
    const dias = [];
    for(let i=0;i<7;i++) dias.push(horasNoDia(checkins, sessoes, addDays(semanaId, i)));
    return dias;
  }
  function melhores5(agregado){
    return [...agregado].filter(a => a.questoes > 0).sort((a,b) => b.pct - a.pct).slice(0,5);
  }
  function evolucaoSemanal(checkins, sessoes = [], hojeIso, numSemanas){
    const semanaFim = segundaFeiraDaSemana(hojeIso);
    const buckets = [];
    for(let i = numSemanas - 1; i >= 0; i--){
      const semanaId = addDays(semanaFim, -7*i);
      const fimSemana = addDays(semanaId, 6);
      const doSemanaCheckins = checkins.filter(c => c.data >= semanaId && c.data <= fimSemana && c.questoes);
      const doSemanaSessoes = sessoes.filter(s => s.tipo === 'questoes' && s.data >= semanaId && s.data <= fimSemana && s.questoes);
      const questoes = doSemanaCheckins.reduce((s,c) => s + c.questoes, 0) + doSemanaSessoes.reduce((s,x) => s + x.questoes, 0);
      const acertos = doSemanaCheckins.reduce((s,c) => s + (c.acertos||0), 0) + doSemanaSessoes.reduce((s,x) => s + (x.acertos||0), 0);
      buckets.push({ semanaId, pct: questoes ? Math.round((acertos/questoes)*100) : null });
    }
    return buckets;
  }

  /* === DESEMPENHO (redesign) === */
  function criarCiclo(state, nome, hojeIso){
    const trimmed = (nome || '').trim();
    if(!trimmed) return null;
    if(!state.ciclos) state.ciclos = [];
    const novo = { id: String(Date.now()) + Math.random().toString(36).slice(2,7), nome: trimmed, inicio: hojeIso };
    state.ciclos.push(novo);
    return novo;
  }
  function limitesCiclo(ciclos, cicloId, hojeIso){
    const idx = ciclos.findIndex(c => c.id === cicloId);
    if(idx === -1) return null;
    const inicio = ciclos[idx].inicio;
    const fim = idx < ciclos.length - 1 ? addDays(ciclos[idx+1].inicio, -1) : hojeIso;
    return { inicio, fim };
  }
  function filtrarPorPeriodo(lista, inicio, fim){
    return lista.filter(x => x.data >= inicio && x.data <= fim);
  }
  function periodoAnterior(inicio, fim){
    const dias = diasAte(inicio, fim) + 1;
    const fimAnterior = addDays(inicio, -1);
    const inicioAnterior = addDays(fimAnterior, -(dias-1));
    return { inicio: inicioAnterior, fim: fimAnterior };
  }
  function variacaoPct(atual, anterior){
    if(!anterior) return atual ? null : 0;
    return Math.round(((atual - anterior) / anterior) * 1000) / 10;
  }
  function incrementarContadorRevisoes(state){
    state.contadorRevisoes = (state.contadorRevisoes || 0) + 1;
    return state.contadorRevisoes;
  }
  function definirMetaAcerto(state, valor){
    const n = Number(valor);
    if(!Number.isFinite(n) || n <= 0 || n > 100) return null;
    state.metaAcertoAlvo = n;
    return n;
  }
  function distribuicaoTempoPorTipo(sessoes){
    const acc = { teoria:0, questoes:0, revisao:0, anki:0 };
    for(const s of sessoes){
      if(acc[s.tipo] !== undefined) acc[s.tipo] += (s.minutos||0);
    }
    return acc;
  }
  function gerarInsightAutomatico(piores){
    if(!piores.length) return null;
    const nomes = piores.slice(0,2).map(p => p.assunto);
    if(nomes.length === 1) return `${nomes[0]} está com acerto abaixo da média; priorize revisão nesta semana.`;
    return `${nomes.join(' e ')} estão com acerto abaixo da média; priorize revisão nesta semana.`;
  }
  function bucketsSemanais(dataInicio, dataFim, calculadora){
    const buckets = [];
    let cursor = dataInicio;
    while(cursor <= dataFim){
      const fimBucket = addDays(cursor, 6) > dataFim ? dataFim : addDays(cursor, 6);
      buckets.push(calculadora(cursor, fimBucket));
      cursor = addDays(cursor, 7);
    }
    return buckets;
  }
  function revisoesNoPeriodo(erros, inicio, fim){
    return erros.filter(e => e.ultimaRevisao && e.ultimaRevisao >= inicio && e.ultimaRevisao <= fim).length;
  }
  function tempoMedioPorSessao(sessoes){
    if(!sessoes.length) return 0;
    return Math.round(sessoes.reduce((s,x) => s + (x.minutos||0), 0) / sessoes.length);
  }
  function constanciaSemanaMinutos(checkins, sessoes, semanaId){
    const dias = [];
    for(let i=0;i<7;i++){
      const dataIso = addDays(semanaId, i);
      const c = checkins.find(x => x.data === dataIso);
      const sessoesDoDia = sessoes.filter(s => s.data === dataIso);
      dias.push(minutosNoDia(c, sessoesDoDia));
    }
    return dias;
  }
  function metaDiariaSemana(state, semanaId){
    const plano = obterPlano(state, semanaId);
    const dias = [];
    for(let i=0;i<7;i++){
      const dataIso = addDays(semanaId, i);
      dias.push(planejadoMinutosHoje(plano, dataIso));
    }
    return dias;
  }
  function aderenciaSemana(minutosReais, minutosMeta){
    const totalReal = minutosReais.reduce((s,x)=>s+x, 0);
    const totalMeta = minutosMeta.reduce((s,x)=>s+x, 0);
    if(!totalMeta) return 0;
    return Math.min(100, Math.round((totalReal/totalMeta)*100));
  }
  function calcularRangeDesempenho(state, cicloId, periodo, hojeIso){
    const ciclo = limitesCiclo(state.ciclos, cicloId, hojeIso);
    if(!ciclo) return null;
    if(periodo === 'ciclo') return ciclo;
    const dias = Number(periodo);
    const inicioJanela = addDays(hojeIso, -(dias-1));
    const inicio = inicioJanela > ciclo.inicio ? inicioJanela : ciclo.inicio;
    return { inicio, fim: ciclo.fim };
  }
  function assuntoPertenceAoConcurso(state, assunto, concursoFiltro){
    if(concursoFiltro === 'todos') return true;
    const item = state.conteudo.find(c => c.assunto === assunto);
    if(!item) return true;
    if(concursoFiltro === 'ambos') return item.concurso === 'ambos';
    return item.concurso === concursoFiltro || item.concurso === 'ambos';
  }
  function filtrarPorConcurso(state, lista, concursoFiltro){
    if(concursoFiltro === 'todos') return lista;
    return lista.filter(x => x.assunto && assuntoPertenceAoConcurso(state, x.assunto, concursoFiltro));
  }
  function sparklineSvg(valores, cor){
    if(!valores || !valores.length) return '';
    const w = 80, h = 28, pad = 2;
    const max = Math.max(...valores, 1);
    const min = Math.min(...valores, 0);
    const range = max - min || 1;
    const pontos = valores.map((v,i) => {
      const x = valores.length > 1 ? (i/(valores.length-1))*(w-pad*2)+pad : w/2;
      const y = h - pad - ((v-min)/range)*(h-pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="sparkline"><polyline points="${pontos}" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  function kpiDeltaHtml(delta, sufixo){
    if(delta === null || delta === undefined) return '';
    const sinal = delta > 0 ? '+' : '';
    return `<div class="desempenho-kpi-delta ${delta>=0?'positivo':'negativo'}">${sinal}${delta}${sufixo} vs. período anterior</div>`;
  }

  function attachConfigHandlers(){
    document.getElementById('btn-export-md')?.addEventListener('click', exportarMarkdown);

      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        if(!tentarImportar(reader.result)) e.target.value = '';
      };
      reader.readAsText(file);
    });
    const btnImportPaste = document.getElementById('btn-import-paste');
    if(btnImportPaste){
      btnImportPaste.addEventListener('click', () => {
        const textarea = document.getElementById('input-import-paste');
        const texto = textarea.value.trim();
        if(!texto) return;
        if(tentarImportar(texto)) textarea.value = '';
      });
    }

      btn.addEventListener('click', () => {

        sessaoEditando = s;
        render();
      });
    });

      sessaoEditando = null;
      render();

    if(editarTipoSel){

      editarTipoSel.addEventListener('change', () => atualizarCamposPorTipo(editarTipoSel.value, 'editar-sessao-form'));

    document.getElementById('editar-questoes')?.addEventListener('input', () => atualizarCalculoQuestoes('editar'));
    document.getElementById('editar-acertos')?.addEventListener('input', () => atualizarCalculoQuestoes('editar'));
    if(document.getElementById('editar-calculo')) atualizarCalculoQuestoes('editar');

    document.getElementById('editar-sessao-salvar')?.addEventListener('click', () => {

        dados.questoes = Number(document.getElementById('editar-questoes').value) || 0;
        dados.acertos = Number(document.getElementById('editar-acertos').value) || 0;

      } else if(tipo === 'anki'){
        dados.cartoes = Number(document.getElementById('editar-cartoes').value) || null;
      }
      atualizarSessao(state, sessaoEditando.id, dados);
      saveState(state);
      sessaoEditando = null;
      render();

  function atividadesPlanoDoDia(plano, conteudo, checkins, sessoes, hojeIso){
    if(!plano || !plano.assuntosAlvo || !plano.assuntosAlvo.length) return [];
    const semanaId = segundaFeiraDaSemana(hojeIso);
    const tocadosSemana = assuntosTocadosNaSemana({checkins, conteudo, sessoes}, semanaId);
    const atrasados = assuntosAtrasadosNaSemana(plano.assuntosAlvo, tocadosSemana);
    const checkinHoje = checkins.find(c => c.data === hojeIso);
    const sessoesHoje = sessoes.filter(s => s.data === hojeIso);
    return plano.assuntosAlvo.map(assunto => {
      const item = conteudo.find(c => c.assunto === assunto) || null;
      const tocadoHoje = (item && item.atualizadoEm === hojeIso && item.status !== 'nao_iniciado')
        || (checkinHoje && checkinHoje.assunto === assunto)
        || sessoesHoje.some(s => s.assunto === assunto);
      const estado = tocadoHoje ? 'concluida' : (atrasados.includes(assunto) ? 'atrasada' : 'pendente');
      return {
        assunto, estado,
        statusLabel: item ? STATUS_CONTEUDO_LABEL[item.status] : null,
        tag: item ? concursoLabel(state, item.concurso) : null,
        tipo: null, atividadeDiaId: null,
      };
    });
  }
  function atividadesDoDiaCombinadas(plano, conteudo, checkins, sessoes, hojeIso){
    const doDia = (plano?.atividadesPorDia?.[hojeIso] || []).map(a => ({
      assunto: a.assunto || 'Estudo livre',
      estado: a.concluida ? 'concluida' : 'pendente',
      statusLabel: null, tag: null,
      tipo: a.tipo, atividadeDiaId: a.id,
    }));
    const daSemana = atividadesPlanoDoDia(plano, conteudo, checkins, sessoes, hojeIso)
      .filter(a => !doDia.some(d => d.assunto === a.assunto));
    return [...doDia, ...daSemana];
  }
  function planejadoMinutosHoje(plano, hojeIso){
    if(!plano) return 150;
    const metaDireta = plano.metaMinutosPorDia?.[hojeIso];
    if(metaDireta) return metaDireta;
    const atividadesHoje = plano.atividadesPorDia?.[hojeIso];
    if(atividadesHoje && atividadesHoje.length){
      return atividadesHoje.reduce((s,a) => s + (a.minutos||0), 0);
    }
    if(plano.horasAlvo && plano.diasAlvo){
      return Math.round((plano.horasAlvo * 60) / plano.diasAlvo);
    }
    return 150;
  }
  function concluirAtividadeDiaPorAssunto(state, semanaId, dataIso, assunto){
    if(!assunto) return null;
    const lista = obterPlano(state, semanaId)?.atividadesPorDia?.[dataIso];
    const item = lista?.find(a => a.assunto === assunto && !a.concluida);
    if(!item) return null;
    item.concluida = true;
    return item;
  }
  function definirMetaMinutosDia(state, semanaId, dataIso, minutos){
    let plano = obterPlano(state, semanaId);
    if(!plano){
      plano = { semanaId, assuntosAlvo: [], diasAlvo: 0, horasAlvo: 0, diasDisponiveis: [], horario: '', concursosPrioritarios: [], atividadesPorDia: {}, metaMinutosPorDia: {} };
      state.planejamento.push(plano);
    }
    if(!plano.metaMinutosPorDia) plano.metaMinutosPorDia = {};
    const min = Number(minutos) || 0;
    if(min > 0) plano.metaMinutosPorDia[dataIso] = min;
    else delete plano.metaMinutosPorDia[dataIso];
    return plano.metaMinutosPorDia[dataIso] ?? null;
  }
  function proximaAtividadeDoDia(atividades, filaErros){
    const atrasada = atividades.find(a => a.estado === 'atrasada');
    if(atrasada) return {origem:'conteudo', ...atrasada};
    const pendente = atividades.find(a => a.estado === 'pendente');
    if(pendente) return {origem:'conteudo', ...pendente};
    if(filaErros.length) return {origem:'erro', erro: filaErros[0]};
    return null;
  }
  function formatarDataExtenso(iso){
    const d = new Date(iso + 'T00:00:00');
    const weekday = d.toLocaleDateString('pt-BR', {weekday:'long'});
    const day = d.getDate();
    const month = d.toLocaleDateString('pt-BR', {month:'long'});
    return `${weekday} ${day} de ${month}`;
  }
  function iconeTipo(tipo){
    return {questoes:'❓', teoria:'📘', revisao:'🔁', anki:'🗂️'}[tipo] || '📄';
  }
  function formatarDuracaoMin(totalMinRaw){
    const totalMin = Math.round(totalMinRaw);
    if(totalMin < 60) return `${totalMin} min`;
    const h = Math.floor(totalMin/60), m = totalMin%60;
    return m ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`;
  }

  function attachHojeHandlers(){

    app.querySelectorAll('button[data-acertei]').forEach(btn => {
      btn.addEventListener('click', () => {
        const e = state.erros.find(x => x.id === btn.dataset.acertei);
        graduarAcerto(e);
        incrementarContadorRevisoes(state);
        saveState(state);
        render();
      });
    });
    app.querySelectorAll('button[data-errei]').forEach(btn => {
      btn.addEventListener('click', () => {
        const e = state.erros.find(x => x.id === btn.dataset.errei);
        graduarErro(e);
        incrementarContadorRevisoes(state);
        saveState(state);
        render();

    });

    app.querySelectorAll('[data-abrir-registro]').forEach(btn => {
      btn.addEventListener('click', () => {
        registroAberto = { assunto: btn.dataset.abrirRegistro, tipo: btn.dataset.tipoSugerido || 'questoes', minutosPreenchidos: null };
        render();
      });
    });

      registroAberto = { assunto: null, tipo: 'questoes', minutosPreenchidos: null };
      render();
    });
    document.getElementById('registro-cancelar')?.addEventListener('click', () => {
      registroAberto = null;
      render();
    });
    document.getElementById('registro-backdrop')?.addEventListener('click', (e) => {
      if(e.target.id !== 'registro-backdrop') return;
      if(registroAberto?.minutosPreenchidos != null && !confirm('Você tem uma sessão cronometrada aguardando registro. Fechar sem salvar descarta esse tempo. Continuar?')) return;
      registroAberto = null;
      render();
    });
    document.querySelectorAll('[data-ir-planejamento]').forEach(btn => {
      btn.addEventListener('click', () => { currentTab = 'planejamento'; render(); });
    });
    document.querySelectorAll('[data-ir-erros]').forEach(btn => {
      btn.addEventListener('click', () => { currentTab = 'erros'; render(); });
    });

    document.getElementById('btn-iniciar-sessao')?.addEventListener('click', () => { iniciarAberto = {}; render(); });
    document.querySelectorAll('[data-abrir-iniciar]').forEach(btn => {
      btn.addEventListener('click', () => { iniciarAberto = {}; render(); });
    });
    document.getElementById('iniciar-cancelar')?.addEventListener('click', () => { iniciarAberto = null; render(); });
    document.getElementById('iniciar-backdrop')?.addEventListener('click', (e) => {
      if(e.target.id === 'iniciar-backdrop'){ iniciarAberto = null; render(); }
    });
    document.getElementById('iniciar-confirmar')?.addEventListener('click', () => {
      if(state.sessaoEmAndamento && !confirm('Já existe uma sessão em andamento. Descartar e iniciar outra?')) return;
      const assunto = resolverAssuntoBusca('iniciar-assunto-busca', 'iniciar-assunto');
      const tipo = document.getElementById('iniciar-tipo').value;
      iniciarSessaoEmAndamento(state, { assunto, tipo, origem: 'header' });
      saveState(state);
      iniciarAberto = null;
      render();
    });
    document.querySelectorAll('[data-continuar-timer]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('timer-card')?.scrollIntoView({behavior:'smooth', block:'center'});
      });
    });
    attachComboBusca('registro-assunto-busca', 'registro-assunto', 'registro-assunto-resultados');
    attachComboBusca('iniciar-assunto-busca', 'iniciar-assunto', 'iniciar-assunto-resultados');

    const selTipo = document.getElementById('registro-tipo');
    if(selTipo){
      atualizarCamposPorTipo(selTipo.value);
      selTipo.addEventListener('change', () => atualizarCamposPorTipo(selTipo.value));
    }
    document.getElementById('registro-questoes')?.addEventListener('input', atualizarCalculoQuestoes);
    document.getElementById('registro-acertos')?.addEventListener('input', atualizarCalculoQuestoes);
    if(document.getElementById('registro-calculo')) atualizarCalculoQuestoes();

    document.getElementById('registro-salvar')?.addEventListener('click', () => {
      const tipo = document.getElementById('registro-tipo').value;
      const assunto = registroAberto.assunto || resolverAssuntoBusca('registro-assunto-busca', 'registro-assunto');
      const minutos = Number(document.getElementById('registro-minutos').value) || 0;
      if(minutos <= 0){ alert('Informe os minutos estudados.'); return; }
      const dados = { tipo, assunto, minutos, obs: document.getElementById('registro-obs').value };
      if(tipo === 'questoes'){
        dados.questoes = Number(document.getElementById('registro-questoes').value) || 0;
        dados.acertos = Number(document.getElementById('registro-acertos').value) || 0;
      } else if(tipo === 'teoria'){
        dados.paginas = Number(document.getElementById('registro-paginas').value) || null;
        dados.concluida = document.getElementById('registro-concluida').checked;
      } else if(tipo === 'revisao'){
        dados.dificuldade = document.getElementById('registro-dificuldade').value || null;
      } else if(tipo === 'anki'){
        dados.cartoes = Number(document.getElementById('registro-cartoes').value) || null;
      }
      registrarSessao(state, hojeISO(), dados);
      concluirAtividadeDiaPorAssunto(state, semanaAtualId(), hojeISO(), dados.assunto);
      saveState(state);
      registroAberto = null;
      render();
    });

    if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; }
    const timerEl = document.getElementById('timer-elapsed');
    if(timerEl){
      const inicio = new Date(timerEl.dataset.inicio).getTime();
      const tick = () => {
        const segundos = Math.floor((Date.now() - inicio) / 1000);
        const mm = String(Math.floor(segundos/60)).padStart(2,'0');
        const ss = String(segundos%60).padStart(2,'0');
        timerEl.textContent = `${mm}:${ss}`;
      };
      tick();
      timerIntervalId = setInterval(tick, 1000);
    }
    document.getElementById('timer-finalizar')?.addEventListener('click', () => {
      const resultado = finalizarSessaoEmAndamento(state);
      saveState(state);
      if(resultado){
        registroAberto = { assunto: resultado.assunto, tipo: resultado.tipo || 'questoes', minutosPreenchidos: resultado.minutos };
      }
      render();
    });
    app.querySelectorAll('[data-iniciar-timer]').forEach(btn => {
      btn.addEventListener('click', () => {
        if(state.sessaoEmAndamento && !confirm('Já existe uma sessão em andamento. Descartar e iniciar outra?')) return;
        iniciarSessaoEmAndamento(state, { assunto: btn.dataset.iniciarTimer || null, tipo: btn.dataset.tipoSugerido || null, origem: btn.dataset.origem || null });
        saveState(state);
        render();
      });
    });
    app.querySelectorAll('[data-toggle-atividade-dia]').forEach(btn => {
      btn.addEventListener('click', () => {
        alternarConcluidaAtividadeDia(state, semanaAtualId(), hojeISO(), btn.dataset.toggleAtividadeDia);
        saveState(state);
        render();
      });
    });

  }

  function attachComboBusca(buscaId, hiddenId, resultadosId){
    const busca = document.getElementById(buscaId);
    const hidden = document.getElementById(hiddenId);
    const resultados = document.getElementById(resultadosId);
    if(!busca || !hidden || !resultados) return;
    function renderizarResultados(filtro){
      const termo = filtro.trim().toLowerCase();
      const opcoes = state.conteudo.filter(c => typeof c.assunto === 'string' && c.assunto.toLowerCase().includes(termo)).slice(0, 8);
      resultados.innerHTML = opcoes.length
        ? opcoes.map(c => `<div class="combo-item" data-valor="${escapeHtml(c.assunto)}">${escapeHtml(c.assunto)}</div>`).join('')
        : '<div class="combo-empty muted">Nenhum assunto encontrado</div>';
      resultados.classList.add('open');
    }
    busca.addEventListener('focus', () => renderizarResultados(busca.value));
    busca.addEventListener('input', () => { hidden.value = ''; renderizarResultados(busca.value); });
    busca.addEventListener('blur', () => resultados.classList.remove('open'));
    // mousedown (not click) + preventDefault stops the input's blur from firing before the
    // selection registers, so a tap on a result never races the list closing.
    resultados.addEventListener('mousedown', (e) => {
      const item = e.target.closest('.combo-item');
      if(!item) return;
      e.preventDefault();
      busca.value = item.dataset.valor;
      hidden.value = item.dataset.valor;
      resultados.classList.remove('open');
    });
  }
  function resolverAssuntoBusca(buscaId, hiddenId){
    const hidden = document.getElementById(hiddenId);
    if(hidden && hidden.value) return hidden.value;
    const busca = document.getElementById(buscaId);
    if(!busca || !busca.value.trim()) return null;
    const texto = busca.value.trim().toLowerCase();
    const match = state.conteudo.find(c => typeof c.assunto === 'string' && c.assunto.toLowerCase() === texto);
    return match ? match.assunto : null;
  }

  }

  function attachErrosHandlers(){
    const app = document.getElementById('app');

    document.querySelectorAll('[data-erros-filtro]').forEach(btn => {
      btn.addEventListener('click', () => { errosFiltro = btn.dataset.errosFiltro; render(); });
    });
    document.getElementById('erros-assunto-select')?.addEventListener('change', (e) => {
      errosFiltroAssunto = e.target.value;
      render();
    });
    document.getElementById('erros-ordenar-select')?.addEventListener('change', (e) => {
      errosOrdenacao = e.target.value;
      render();
    });
    const buscaInput = document.getElementById('erros-busca-input');
    if(buscaInput){
      buscaInput.addEventListener('input', () => {
        errosBusca = buscaInput.value;
        renderPreservandoFoco();
      });
    }

    document.querySelectorAll('[data-toggle-erro]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.toggleErro;
        if(errosExpandidos.has(id)) errosExpandidos.delete(id); else errosExpandidos.add(id);
        render();
      });
    });

    document.querySelectorAll('[data-revisar-agora]').forEach(btn => {
      btn.addEventListener('click', () => {
        errosRevisando.add(btn.dataset.revisarAgora);
        render();
      });
    });
    app.querySelectorAll('button[data-acertei]').forEach(btn => {
      btn.addEventListener('click', () => {
        const e = state.erros.find(x => x.id === btn.dataset.acertei);
        if(e){ graduarAcerto(e); incrementarContadorRevisoes(state); }
        errosRevisando.delete(btn.dataset.acertei);
        saveState(state);
        render();
      });
    });
    app.querySelectorAll('button[data-errei]').forEach(btn => {
      btn.addEventListener('click', () => {
        const e = state.erros.find(x => x.id === btn.dataset.errei);
        if(e){ graduarErro(e); incrementarContadorRevisoes(state); }
        errosRevisando.delete(btn.dataset.errei);
        saveState(state);
        render();
      });
    });

    document.querySelectorAll('[data-editar-erro]').forEach(btn => {
      btn.addEventListener('click', () => {
        erroModalAberto = { modo:'editar', id: btn.dataset.editarErro };
        render();
      });
    });
    document.querySelectorAll('[data-erro-menu]').forEach(btn => {
      btn.addEventListener('click', () => {
        erroMenuAberto = erroMenuAberto === btn.dataset.erroMenu ? null : btn.dataset.erroMenu;
        render();
      });
    });
    document.querySelectorAll('[data-excluir-erro]').forEach(btn => {
      btn.addEventListener('click', () => {
        if(!confirm('Excluir este erro registrado? Essa ação não pode ser desfeita.')) return;
        excluirErro(state, btn.dataset.excluirErro);
        erroMenuAberto = null;
        saveState(state);
        render();
      });
    });

    document.getElementById('erros-novo-btn')?.addEventListener('click', () => {
      erroModalAberto = { modo:'novo' };
      render();
    });
    document.getElementById('erros-novo-rodape')?.addEventListener('click', () => {
      erroModalAberto = { modo:'novo' };
      render();
    });
    document.getElementById('erro-form-cancelar')?.addEventListener('click', () => {
      erroModalAberto = null;
      render();
    });
    document.getElementById('erro-modal-backdrop')?.addEventListener('click', (e) => {
      if(e.target.id === 'erro-modal-backdrop'){ erroModalAberto = null; render(); }
    });
    document.getElementById('erro-form-assunto')?.addEventListener('change', (e) => {
      const assunto = e.target.value;
      const excluirId = erroModalAberto?.modo === 'editar' ? erroModalAberto.id : null;
      const count = contarErrosPorAssunto(state.erros, assunto, excluirId);
      const aviso = document.getElementById('erro-form-aviso');
      if(aviso) aviso.textContent = count ? `Você já tem ${count} erro${count===1?'':'s'} registrado${count===1?'':'s'} para este assunto.` : '';
    });
    document.getElementById('erro-form-salvar')?.addEventListener('click', () => {
      const assunto = document.getElementById('erro-form-assunto').value;
      const oQueErrei = document.getElementById('erro-form-oque').value.trim();
      const regraCorreta = document.getElementById('erro-form-regra').value.trim();
      const origemQuestao = document.getElementById('erro-form-questao').checked;
      if(!oQueErrei || !regraCorreta){ alert('Preencha "o que errei" e a "regra correta".'); return; }
      if(erroModalAberto.modo === 'editar'){
        atualizarErro(state, erroModalAberto.id, { assunto, oQueErrei, regraCorreta, origemQuestao });
      } else {
        criarErro(state, { assunto, oQueErrei, regraCorreta, origemQuestao });
      }
      saveState(state);
      erroModalAberto = null;
      render();
    });

    document.getElementById('erros-revisar-pendentes-btn')?.addEventListener('click', () => {
      revisaoSessao = iniciarSessaoRevisao(state.erros, hojeISO());
      render();
    });
    document.getElementById('revisao-sessao-revelar')?.addEventListener('click', () => {
      revisaoSessao.revelado = true;
      render();
    });
    document.getElementById('revisao-sessao-acertei')?.addEventListener('click', () => {
      const erroAtual = state.erros.find(e => e.id === revisaoSessao.fila[revisaoSessao.indice]);
      if(erroAtual){ graduarAcerto(erroAtual); incrementarContadorRevisoes(state); }
      saveState(state);
      revisaoSessao.indice++;
      revisaoSessao.revelado = false;
      render();
    });
    document.getElementById('revisao-sessao-errei')?.addEventListener('click', () => {
      const erroAtual = state.erros.find(e => e.id === revisaoSessao.fila[revisaoSessao.indice]);
      if(erroAtual){ graduarErro(erroAtual); incrementarContadorRevisoes(state); }
      saveState(state);
      revisaoSessao.indice++;
      revisaoSessao.revelado = false;
      render();
    });
    document.getElementById('revisao-sessao-fechar')?.addEventListener('click', () => {

      revisaoSessao = null;
      render();

    document.getElementById('revisao-sessao-backdrop')?.addEventListener('click', (e) => {
      if(e.target.id === 'revisao-sessao-backdrop'){ revisaoSessao = null; render(); }
    });
  }

    const chipsHtml = assuntosAtuais.map(a => `

    const sugestoesAssuntos = (() => {
      const jaSelecionados = new Set(assuntosAtuais);
      const naoIniciados = state.conteudo.filter(c => c.status === 'nao_iniciado' && !jaSelecionados.has(c.assunto)).map(c => c.assunto);
      const agregadoGeral = agregarPorAssunto(state.checkins, state.sessoes);
      const fracos = piores5(agregadoGeral).map(p => p.assunto).filter(a => !jaSelecionados.has(a) && !naoIniciados.includes(a));
      return [...naoIniciados.slice(0,3), ...fracos.slice(0,3)].slice(0,5);
    })();

    const metaFormHtml = `
      <div class="card">
        <h3>Definir meta da semana</h3>
        <small class="muted">Selecione os assuntos e defina sua meta de estudo para esta semana.</small>

        <div class="assunto-chips" id="meta-assuntos-chips">${chipsHtml || '<span class="muted">Nenhum assunto selecionado ainda.</span>'}</div>
        <div class="combo">
          <input type="text" id="meta-assunto-busca" placeholder="Adicionar assunto..." autocomplete="off">
          <input type="hidden" id="meta-assunto-hidden">
          <div class="combo-results" id="meta-assunto-resultados"></div>

          <div class="assunto-chips">
            ${sugestoesAssuntos.map(a => `<button type="button" class="chip-sugestao" data-sugestao-assunto="${escapeHtml(a)}">+ ${escapeHtml(a)}</button>`).join('')}

        <div class="row">
          <div>
            <label>Dias-alvo</label>
            <input type="number" id="meta-dias-alvo" value="${diasAlvoAtual}">

            <label>Horas disponíveis</label>
            <input type="number" id="meta-horas" value="${horasAlvoAtual}">
          </div>

        <details class="meta-opcionais">
          <summary>Mais opções (opcional)</summary>
          <label>Dias disponíveis</label>
          <div class="dias-checkbox-row">
            ${DIAS_SEMANA_KEY.map((k,i) => `<label class="dia-checkbox"><input type="checkbox" id="meta-dia-${k}" ${diasDisponiveisAtual.includes(k)?'checked':''}> ${DIAS_SEMANA_LABEL[i]}</label>`).join('')}
          </div>
          <label>Horário (opcional)</label>
          <input type="text" id="meta-horario" placeholder="ex: 14h - 18h" value="${escapeHtml(plano?.horario || '')}">
          <label>Concursos prioritários (opcional)</label>
          <div class="dias-checkbox-row">
            <label class="dia-checkbox"><input type="checkbox" id="meta-concurso-transpetro" ${concursosPrioritariosAtual.includes('transpetro')?'checked':''}> Transpetro</label>
            <label class="dia-checkbox"><input type="checkbox" id="meta-concurso-inea" ${concursosPrioritariosAtual.includes('inea')?'checked':''}> INEA</label>
          </div>

        <button id="semana-salvar" class="primary">Salvar meta</button>
      </div>`;

    const resumoMetaHtml = `
      <div class="card">
        <h3>Resumo da meta</h3>
        <div class="resumo-meta-item"><span class="stat-icon">📅</span><div><b>${diasAlvoAtual}</b><br><small class="muted">de 7 dias da semana</small></div></div>
        <div class="resumo-meta-item"><span class="stat-icon">⏱️</span><div><b>${horasAlvoAtual}h</b><br><small class="muted">de estudo na semana</small></div></div>
        <div class="resumo-meta-item"><span class="stat-icon">📚</span><div><b>${assuntosAtuais.length}</b><br><small class="muted">assuntos-alvo</small></div></div>

    return `
      <div class="planejamento-screen">
        ${headerHtml}
