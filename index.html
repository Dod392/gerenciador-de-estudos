  function copiarTextoFallback(texto){

    ta.style.opacity = '0';
    document.body.appendChild(ta);

  /* === DASHBOARD (redesign, Tarefa 2) === */
  function calcularSequencia(checkins, sessoes, hojeIso){
    const diasComCheckin = checkins.filter(c => c.status !== 'nao').map(c => c.data);
    const diasComSessao = sessoes.map(s => s.data);
    const estudados = new Set([...diasComCheckin, ...diasComSessao]);
    let dia = hojeIso;
    if(!estudados.has(dia)) dia = addDays(dia, -1);
    let sequencia = 0;
    while(estudados.has(dia)){ sequencia++; dia = addDays(dia, -1); }
    return sequencia;
  }
  function pctCronograma(conteudo){
    if(!conteudo.length) return 0;
    const tocados = conteudo.filter(c => c.status !== 'nao_iniciado').length;
    return Math.round((tocados / conteudo.length) * 100);
  }
  function minutosNoDia(checkin, sessoesDoDia){
    const minutosSessoes = sessoesDoDia.reduce((s,x) => s + (x.minutos||0), 0);
    const minutosManual = checkin?.minutos || 0;
    return minutosSessoes + minutosManual;
  }
  function horasNoDia(checkins, sessoes, dataIso){
    const c = checkins.find(x => x.data === dataIso);
    const sessoesDoDia = sessoes.filter(s => s.data === dataIso);
    const minutos = minutosNoDia(c, sessoesDoDia);
    return Math.round((minutos/60)*10)/10;
  }
  function horasPorDiaDaSemana(checkins, sessoes, semanaId){
    const dias = [];
    for(let i=0;i<7;i++) dias.push(horasNoDia(checkins, sessoes, addDays(semanaId, i)));
    return dias;
  }
  function melhores5(agregado){
    return [...agregado].filter(a => a.questoes > 0).sort((a,b) => b.pct - a.pct).slice(0,5);
  }
  function evolucaoSemanal(checkins, sessoes = [], hojeIso, numSemanas){
    const semanaFim = segundaFeiraDaSemana(hojeIso);
    const buckets = [];
    for(let i = numSemanas - 1; i >= 0; i--){
      const semanaId = addDays(semanaFim, -7*i);
      const fimSemana = addDays(semanaId, 6);
      const doSemanaCheckins = checkins.filter(c => c.data >= semanaId && c.data <= fimSemana && c.questoes);
      const doSemanaSessoes = sessoes.filter(s => s.tipo === 'questoes' && s.data >= semanaId && s.data <= fimSemana && s.questoes);
      const questoes = doSemanaCheckins.reduce((s,c) => s + c.questoes, 0) + doSemanaSessoes.reduce((s,x) => s + x.questoes, 0);
      const acertos = doSemanaCheckins.reduce((s,c) => s + (c.acertos||0), 0) + doSemanaSessoes.reduce((s,x) => s + (x.acertos||0), 0);
      buckets.push({ semanaId, pct: questoes ? Math.round((acertos/questoes)*100) : null });
    }
    return buckets;
  }

  /* === DESEMPENHO (redesign) === */
  function criarCiclo(state, nome, hojeIso){
    const trimmed = (nome || '').trim();
    if(!trimmed) return null;
    if(!state.ciclos) state.ciclos = [];
    const novo = { id: String(Date.now()) + Math.random().toString(36).slice(2,7), nome: trimmed, inicio: hojeIso };
    state.ciclos.push(novo);
    return novo;
  }
  function limitesCiclo(ciclos, cicloId, hojeIso){
    const idx = ciclos.findIndex(c => c.id === cicloId);
    if(idx === -1) return null;
    const inicio = ciclos[idx].inicio;
    const fim = idx < ciclos.length - 1 ? addDays(ciclos[idx+1].inicio, -1) : hojeIso;
    return { inicio, fim };
  }
  function filtrarPorPeriodo(lista, inicio, fim){
    return lista.filter(x => x.data >= inicio && x.data <= fim);
  }
  function periodoAnterior(inicio, fim){
    const dias = diasAte(inicio, fim) + 1;
    const fimAnterior = addDays(inicio, -1);
    const inicioAnterior = addDays(fimAnterior, -(dias-1));
    return { inicio: inicioAnterior, fim: fimAnterior };
  }
  function variacaoPct(atual, anterior){
    if(!anterior) return atual ? null : 0;
    return Math.round(((atual - anterior) / anterior) * 1000) / 10;
  }
  function incrementarContadorRevisoes(state){
    state.contadorRevisoes = (state.contadorRevisoes || 0) + 1;
    return state.contadorRevisoes;
  }
  function definirMetaAcerto(state, valor){
    const n = Number(valor);
    if(!Number.isFinite(n) || n <= 0 || n > 100) return null;
    state.metaAcertoAlvo = n;
    return n;
  }
  function distribuicaoTempoPorTipo(sessoes){
    const acc = { teoria:0, questoes:0, revisao:0, anki:0 };
    for(const s of sessoes){
      if(acc[s.tipo] !== undefined) acc[s.tipo] += (s.minutos||0);
    }
    return acc;
  }
  function gerarInsightAutomatico(piores){
    if(!piores.length) return null;
    const nomes = piores.slice(0,2).map(p => p.assunto);
    if(nomes.length === 1) return `${nomes[0]} está com acerto abaixo da média; priorize revisão nesta semana.`;
    return `${nomes.join(' e ')} estão com acerto abaixo da média; priorize revisão nesta semana.`;
  }
  function bucketsSemanais(dataInicio, dataFim, calculadora){
    const buckets = [];
    let cursor = dataInicio;
    while(cursor <= dataFim){
      const fimBucket = addDays(cursor, 6) > dataFim ? dataFim : addDays(cursor, 6);
      buckets.push(calculadora(cursor, fimBucket));
      cursor = addDays(cursor, 7);
    }
    return buckets;
  }
  function revisoesNoPeriodo(flashcards, inicio, fim){
    return flashcards.reduce((soma, f) => soma + (Array.isArray(f.historico) ? f.historico.filter(h => h.data >= inicio && h.data <= fim).length : 0), 0);
  }
  function tempoMedioPorSessao(sessoes){
    if(!sessoes.length) return 0;
    return Math.round(sessoes.reduce((s,x) => s + (x.minutos||0), 0) / sessoes.length);
  }
  function constanciaSemanaMinutos(checkins, sessoes, semanaId){
    const dias = [];
    for(let i=0;i<7;i++){
      const dataIso = addDays(semanaId, i);
      const c = checkins.find(x => x.data === dataIso);
      const sessoesDoDia = sessoes.filter(s => s.data === dataIso);
      dias.push(minutosNoDia(c, sessoesDoDia));
    }
    return dias;
  }
  function metaDiariaSemana(state, semanaId){
    const plano = obterPlano(state, semanaId);
    const dias = [];
    for(let i=0;i<7;i++){
      const dataIso = addDays(semanaId, i);
      dias.push(planejadoMinutosHoje(plano, dataIso));
    }
    return dias;
  }
  function aderenciaSemana(minutosReais, minutosMeta){
    const totalReal = minutosReais.reduce((s,x)=>s+x, 0);
    const totalMeta = minutosMeta.reduce((s,x)=>s+x, 0);
    if(!totalMeta) return 0;
    return Math.min(100, Math.round((totalReal/totalMeta)*100));
  }
  function calcularRangeDesempenho(state, cicloId, periodo, hojeIso){
    const ciclo = limitesCiclo(state.ciclos, cicloId, hojeIso);
    if(!ciclo) return null;
    if(periodo === 'ciclo') return ciclo;
    const dias = Number(periodo);
    const inicioJanela = addDays(hojeIso, -(dias-1));
    const inicio = inicioJanela > ciclo.inicio ? inicioJanela : ciclo.inicio;
    return { inicio, fim: ciclo.fim };
  }
  function assuntoPertenceAoConcurso(state, assunto, concursoFiltro){
    if(concursoFiltro === 'todos') return true;
    const item = state.conteudo.find(c => c.assunto === assunto);
    if(!item) return true;
    if(concursoFiltro === 'ambos') return item.concurso === 'ambos';
    return item.concurso === concursoFiltro || item.concurso === 'ambos';
  }
  function filtrarPorConcurso(state, lista, concursoFiltro){
    if(concursoFiltro === 'todos') return lista;
    return lista.filter(x => x.assunto && assuntoPertenceAoConcurso(state, x.assunto, concursoFiltro));
  }
  function sparklineSvg(valores, cor){
    if(!valores || !valores.length) return '';
    const w = 80, h = 28, pad = 2;
    const max = Math.max(...valores, 1);
    const min = Math.min(...valores, 0);
    const range = max - min || 1;
    const pontos = valores.map((v,i) => {
      const x = valores.length > 1 ? (i/(valores.length-1))*(w-pad*2)+pad : w/2;
      const y = h - pad - ((v-min)/range)*(h-pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="sparkline"><polyline points="${pontos}" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  function kpiDeltaHtml(delta, sufixo){
    if(delta === null || delta === undefined) return '';
    const sinal = delta > 0 ? '+' : '';
    return `<div class="desempenho-kpi-delta ${delta>=0?'positivo':'negativo'}">${sinal}${delta}${sufixo} vs. período anterior</div>`;
  }

            <input type="number" id="editar-paginas" value="${sessaoEditando.paginas ?? ''}">

      <div class="historico-import-list">

          <div class="historico-import-item">
            <div class="historico-import-info">
              <b>${icone('notebook')} Caderno de Erros</b>

            </div>

            <div class="historico-import-info">
              <b>${icone('calendar')} ${escapeHtml(h.cicloNome || 'Plano sem nome de ciclo')}</b>
              <small class="muted">${formatarDataHora(h.quando)} · ${h.atividadesAdicionadas} ${h.atividadesAdicionadas===1?'atividade':'atividades'}${h.periodoInicio ? ` · ${formatarData(h.periodoInicio)} a ${formatarData(h.periodoFim)}` : ''}</small>

    return `

          <div class="stat-sub">${usuarioSincronizado ? 'Entre aparelhos, via ' + escapeHtml(usuarioSincronizado.email || '') : 'Somente neste aparelho'}</div>

            ${usuarioSincronizado ? `
              <div class="sync-conta-row">
                ${usuarioSincronizado.foto ? `<img class="sync-avatar" src="${escapeHtml(usuarioSincronizado.foto)}" alt="">` : `<span class="item-icon">${icone('cloud')}</span>`}

            <textarea id="input-import-plano" placeholder="Cole aqui o plano de estudos (JSON)" style="margin-top:var(--space-2);"></textarea>

            <textarea id="input-import-erros" placeholder='Cole aqui os erros (JSON), ex: [{"assunto":"PNRS","oQueErrei":"...","regraCorreta":"..."}]' style="margin-top:var(--space-2);"></textarea>
            <button id="btn-import-erros" class="primary">Importar erros</button>

          <div class="card">

          ${sessoesHtml}

        <div>
          <div class="card">
            <h3>${icone('sliders')} Preferências</h3>

              <div class="config-pref-item">
                <div class="config-pref-text"><b>${icone('calendar')} Formato de data</b><small>Escolha como as datas são exibidas.</small></div>
                <select id="pref-formato-data" class="config-pref-select">
                  <option value="DD/MM/AAAA" ${prefs.formatoData==='DD/MM/AAAA'?'selected':''}>DD/MM/AAAA</option>
                  <option value="MM/DD/AAAA" ${prefs.formatoData==='MM/DD/AAAA'?'selected':''}>MM/DD/AAAA</option>
                  <option value="AAAA-MM-DD" ${prefs.formatoData==='AAAA-MM-DD'?'selected':''}>AAAA-MM-DD</option>
                </select>
              </div>
              <div class="config-pref-item">
                <div class="config-pref-text"><b>${icone('check-circle')} Confirmações</b><small>Exibir confirmações antes de ações críticas.</small></div>
                <label class="switch"><input type="checkbox" id="pref-confirmacoes-toggle" ${prefs.confirmacoes?'checked':''}><span class="switch-slider"></span></label>
              </div>
              <div class="config-pref-item">
                <div class="config-pref-text"><b>${icone('bell')} Notificações</b><small>Receber lembretes e alertas do app.</small></div>
                <label class="switch"><input type="checkbox" id="pref-notificacoes-toggle" ${prefs.notificacoes?'checked':''}><span class="switch-slider"></span></label>
              </div>
            </div>
            <details class="config-avancado">
              <summary>Avançado</summary>
              <small class="muted">Configurações e ferramentas avançadas de manutenção.</small>
              <button type="button" id="btn-forcar-atualizacao" style="margin-top:var(--space-3);">${icone('refresh')} Forçar atualização do app</button>
              <small class="muted">Limpa o cache local do app (não mexe nos seus dados) e recarrega a versão mais recente. Use se a tela parecer desatualizada após uma atualização.</small>
            </details>

          <div class="card">
            <h3>${icone('flag')} Provas</h3>
            <small class="muted">Data da prova de cada concurso — usada pra calcular os dias que faltam.</small>

              ${state.concursos.map(nome => `
                <div class="config-pref-item">
                  <div class="config-pref-text"><b>${escapeHtml(nome)}</b></div>
                  <input type="date" data-prova-concurso="${escapeHtml(nome)}" class="config-pref-select" value="${escapeHtml(state.provasPorConcurso[nome] || '')}">
                </div>`).join('')}
            </div>
            <button type="button" id="btn-salvar-provas" class="primary" style="margin-top:var(--space-2);">Salvar datas</button>
            <label style="margin-top:var(--space-3);">Adicionar prova (concurso novo)</label>
            <div class="row">
              <input type="text" id="nova-prova-nome" placeholder="Nome do concurso">
              <input type="date" id="nova-prova-data">

            <button type="button" id="btn-adicionar-prova">${icone('flag')} Adicionar prova</button>
          </div>

          <div class="card config-danger-card">

              <p>Todos os seus dados de estudo serão removidos deste aparelho.</p>
              <label>Digite EXCLUIR para confirmar</label>
              <input type="text" id="config-excluir-input" placeholder="Digite EXCLUIR para confirmar" value="${escapeHtml(configExcluirTexto)}" autocomplete="off">
              <button class="bad" id="btn-limpar-dados" ${configExcluirTexto.trim()==='EXCLUIR' ? '' : 'disabled'}>${icone('trash')} Limpar todos os dados</button>
            </div>
            <div class="config-danger-warn">
              <span>${icone('shield')} Recomendamos fazer um backup antes de prosseguir.</span>
              <button type="button" class="card-link" id="btn-export-antes">Exportar backup antes</button>
            </div>
          </div>
        </div>

      ${editarSessaoModalHtml}

  function attachConfigHandlers(){
    document.getElementById('btn-sync-entrar')?.addEventListener('click', entrarComGoogle);
    document.getElementById('btn-sync-sair')?.addEventListener('click', sairDaConta);
    document.getElementById('btn-export-md')?.addEventListener('click', exportarMarkdown);
    document.getElementById('btn-export-backup')?.addEventListener('click', () => { exportarJSON(); render(); });
    document.getElementById('btn-export-antes')?.addEventListener('click', () => { exportarJSON(); render(); });
    document.getElementById('btn-import-backup-trigger')?.addEventListener('click', () => {
      document.getElementById('input-import-json')?.click();
    });
    document.getElementById('btn-copy-json')?.addEventListener('click', () => {
      copiarTexto(JSON.stringify(state, null, 2));
    });
    document.getElementById('input-import-json')?.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        if(!tentarImportar(reader.result)) e.target.value = '';
      };
      reader.readAsText(file);
    });
    const btnImportPaste = document.getElementById('btn-import-paste');
    if(btnImportPaste){
      btnImportPaste.addEventListener('click', () => {
        const textarea = document.getElementById('input-import-paste');
        const texto = textarea.value.trim();
        if(!texto) return;
        if(tentarImportar(texto)) textarea.value = '';
      });
    }
    document.getElementById('btn-import-plano')?.addEventListener('click', () => {
      const textarea = document.getElementById('input-import-plano');
      const texto = textarea.value.trim();
      if(!texto) return;
      try {
        const parsed = JSON.parse(texto);
        const n = mesclarPlanoExterno(state, parsed);
        saveState(state);
        textarea.value = '';
        render();
        alert(n > 0 ? `Plano importado: ${n} ${n===1?'atividade adicionada':'atividades adicionadas'} ao Planejamento.` : 'Nada novo pra importar — essas atividades já estavam no Planejamento.');
      } catch(err){
        alert('Falha ao importar plano: ' + err.message);
      }
    });
    document.getElementById('btn-import-erros')?.addEventListener('click', () => {
      const textarea = document.getElementById('input-import-erros');
      const texto = textarea.value.trim();
      if(!texto) return;
      try {
        const parsed = JSON.parse(texto);
        const n = mesclarErrosExternos(state, parsed);
        saveState(state);
        textarea.value = '';
        render();
        alert(n > 0 ? `Erros importados: ${n} novo${n===1?'':'s'} adicionado${n===1?'':'s'} ao Caderno de Erros.` : 'Nada novo pra importar — esses erros já estavam registrados.');
      } catch(err){
        alert('Falha ao importar erros: ' + err.message);
      }
    });

    const buscaSessaoInput = document.getElementById('config-sessao-busca');
    if(buscaSessaoInput){
      buscaSessaoInput.addEventListener('input', () => {
        configSessaoBusca = buscaSessaoInput.value;
        renderPreservandoFoco();
      });
    }
    document.getElementById('config-sessao-tipo-select')?.addEventListener('change', (e) => {
      configSessaoFiltroTipo = e.target.value;
      render();
    });

    document.getElementById('pref-formato-data')?.addEventListener('change', (e) => {
      state.preferencias.formatoData = e.target.value;
      saveState(state);
      render();
    });
    document.getElementById('pref-confirmacoes-toggle')?.addEventListener('change', (e) => {
      state.preferencias.confirmacoes = e.target.checked;
      saveState(state);
      render();
    });
    document.getElementById('pref-notificacoes-toggle')?.addEventListener('change', (e) => {
      state.preferencias.notificacoes = e.target.checked;
      saveState(state);
      if(e.target.checked && typeof Notification !== 'undefined' && Notification.permission === 'default'){
        Notification.requestPermission().then((permissao) => {
          if(permissao === 'granted') verificarNotificacoesPendentes();
          else if(permissao === 'denied') alert('Permissão de notificação negada pelo navegador. Pra ativar, permita notificações pra este site nas configurações do navegador.');
        });
      }
      render();
    });
    document.getElementById('btn-forcar-atualizacao')?.addEventListener('click', () => {
      if(!confirmarAcao('Isso vai limpar o cache local do app e recarregar a versão mais atual. Seus dados de estudo não são afetados. Continuar?')) return;
      forcarAtualizacaoApp();
    });
    document.getElementById('btn-salvar-provas')?.addEventListener('click', () => {
      document.querySelectorAll('[data-prova-concurso]').forEach(input => {
        const nome = input.dataset.provaConcurso;
        if(input.value) state.provasPorConcurso[nome] = input.value;
        else delete state.provasPorConcurso[nome];
      });
      saveState(state);
      render();
    });
    document.getElementById('btn-adicionar-prova')?.addEventListener('click', () => {
      const nomeInput = document.getElementById('nova-prova-nome');
      const dataInput = document.getElementById('nova-prova-data');
      const nome = nomeInput.value.trim();
      if(!nome){ alert('Informe o nome do concurso.'); return; }
      const adicionado = adicionarConcurso(state, nome);
      const nomeFinal = adicionado || state.concursos.find(n => slugConcurso(n) === slugConcurso(nome)) || nome;
      if(dataInput.value) state.provasPorConcurso[nomeFinal] = dataInput.value;
      saveState(state);
      render();
    });

    const excluirInput = document.getElementById('config-excluir-input');
    if(excluirInput){
      excluirInput.addEventListener('input', () => {
        configExcluirTexto = excluirInput.value;
        renderPreservandoFoco();
      });
    }
    document.getElementById('btn-limpar-dados')?.addEventListener('click', () => {
      if(configExcluirTexto.trim() !== 'EXCLUIR') return;
      if(!confirm('Isso vai apagar TODOS os seus dados de estudo deste aparelho. Essa ação não pode ser desfeita. Tem certeza?')) return;
      limparTodosDados();
      configExcluirTexto = '';
      render();
    });

    document.querySelectorAll('[data-editar-sessao]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = state.sessoes.find(x => x.id === btn.dataset.editarSessao);
        if(!s) return;
        sessaoEditando = s;
        render();
      });
    });
    document.querySelectorAll('[data-excluir-sessao]').forEach(btn => {
      btn.addEventListener('click', () => {
        if(!confirmarAcao('Excluir esta sessão registrada? Essa ação não pode ser desfeita.')) return;
        excluirSessao(state, btn.dataset.excluirSessao);
        saveState(state);
        render();
      });
    });
    document.getElementById('editar-sessao-cancelar')?.addEventListener('click', () => {
      sessaoEditando = null;
      render();
    });
    document.getElementById('editar-sessao-backdrop')?.addEventListener('click', (e) => {
      if(e.target.id === 'editar-sessao-backdrop'){ sessaoEditando = null; render(); }
    });
    const editarTipoSel = document.getElementById('editar-tipo');
    if(editarTipoSel){
      atualizarCamposPorTipo(editarTipoSel.value, 'editar-sessao-form');
      editarTipoSel.addEventListener('change', () => atualizarCamposPorTipo(editarTipoSel.value, 'editar-sessao-form'));
    }
    document.getElementById('editar-questoes')?.addEventListener('input', () => atualizarCalculoQuestoes('editar'));
    document.getElementById('editar-acertos')?.addEventListener('input', () => atualizarCalculoQuestoes('editar'));
    if(document.getElementById('editar-calculo')) atualizarCalculoQuestoes('editar');
    attachComboBusca('editar-assunto-busca', 'editar-assunto', 'editar-assunto-resultados');

    document.getElementById('editar-sessao-salvar')?.addEventListener('click', () => {
      const tipo = document.getElementById('editar-tipo').value;
      const assunto = resolverAssuntoBusca('editar-assunto-busca', 'editar-assunto');
      const minutos = Number(document.getElementById('editar-minutos').value) || 0;
      if(minutos <= 0){ alert('Informe os minutos estudados.'); return; }
      const dados = { tipo, assunto, minutos, obs: document.getElementById('editar-obs').value };
      if(tipo === 'questoes'){
        dados.questoes = Number(document.getElementById('editar-questoes').value) || 0;
        dados.acertos = Number(document.getElementById('editar-acertos').value) || 0;
      } else if(tipo === 'teoria'){
        dados.paginas = Number(document.getElementById('editar-paginas').value) || null;
        dados.concluida = document.getElementById('editar-concluida').checked;
      } else if(tipo === 'revisao'){
        dados.dificuldade = document.getElementById('editar-dificuldade').value || null;
      } else if(tipo === 'anki'){
        dados.cartoes = Number(document.getElementById('editar-cartoes').value) || null;
      }
      atualizarSessao(state, sessaoEditando.id, dados);
      saveState(state);
      sessaoEditando = null;
      render();
    });
  }

  /* === RENDER === */
  const NAV_ITEMS = [
    {id:'dashboard', label:'Dashboard', icon:icone('bar-chart')},
    {id:'hoje', label:'Hoje', icon:icone('check-circle')},
    {id:'planejamento', label:'Planejamento', icon:icone('calendar')},
    {id:'mapa', label:'Mapa de Conteúdo', icon:icone('map')},
    {id:'erros', label:'Caderno de Erros', icon:icone('notebook')},
    {id:'desempenho', label:'Desempenho', icon:icone('trending-up')},
    {id:'config', label:'Configurações', icon:icone('settings')},
  ];
  const MOBILE_PRIMARY = ['hoje', 'planejamento', 'desempenho'];
  let currentTab = (window.matchMedia && window.matchMedia('(min-width:900px)').matches) ? 'dashboard' : 'hoje';
  let sidebarCollapsed = false;
  let registroAberto = null;
  let iniciarAberto = null;
  let timerIntervalId = null;
  let sessaoEditando = null;
  let configSessaoBusca = '';
  let configSessaoFiltroTipo = 'todos';
  let configExcluirTexto = '';
  const TIPO_LABEL = { questoes:'Questões', teoria:'Teoria', revisao:'Revisão', anki:'Anki' };
  let semanaVisualizada = null;
  let atividadeDiaAberta = null;
  let mapaFiltroStatus = 'todos';
  let mapaFiltroConcurso = 'todos';
  let mapaBusca = '';
  let mapaAssuntoAberto = false;
  let mapaConcursoAberto = false;

  function atividadesPlanoDoDia(plano, conteudo, checkins, sessoes, hojeIso){
    if(!plano || !plano.assuntosAlvo || !plano.assuntosAlvo.length) return [];
    const semanaId = segundaFeiraDaSemana(hojeIso);
    const tocadosSemana = assuntosTocadosNaSemana({checkins, conteudo, sessoes}, semanaId);
    const atrasados = assuntosAtrasadosNaSemana(plano.assuntosAlvo, tocadosSemana);
    const checkinHoje = checkins.find(c => c.data === hojeIso);
    const sessoesHoje = sessoes.filter(s => s.data === hojeIso);
    return plano.assuntosAlvo.map(assunto => {
      const item = conteudo.find(c => c.assunto === assunto) || null;
      const tocadoHoje = (item && item.atualizadoEm === hojeIso && item.status !== 'nao_iniciado')
        || (checkinHoje && checkinHoje.assunto === assunto)
        || sessoesHoje.some(s => s.assunto === assunto);
      const estado = tocadoHoje ? 'concluida' : (atrasados.includes(assunto) ? 'atrasada' : 'pendente');
      return {
        assunto, estado,
        statusLabel: item ? STATUS_CONTEUDO_LABEL[item.status] : null,
        tag: item ? concursoLabel(state, item.concurso) : null,
        tipo: null, atividadeDiaId: null,
      };
    });
  }
  function atividadesDoDiaCombinadas(plano, conteudo, checkins, sessoes, hojeIso){
    const doDia = (plano?.atividadesPorDia?.[hojeIso] || []).map(a => ({
      assunto: a.assunto || 'Estudo livre',
      estado: a.concluida ? 'concluida' : 'pendente',
      statusLabel: null, tag: null,
      tipo: a.tipo, atividadeDiaId: a.id,
    }));
    const daSemana = atividadesPlanoDoDia(plano, conteudo, checkins, sessoes, hojeIso)
      .filter(a => !doDia.some(d => d.assunto === a.assunto));
    return [...doDia, ...daSemana];
  }
  function planejadoMinutosHoje(plano, hojeIso){
    if(!plano) return 150;
    const metaDireta = plano.metaMinutosPorDia?.[hojeIso];
    if(metaDireta) return metaDireta;
    const atividadesHoje = plano.atividadesPorDia?.[hojeIso];
    if(atividadesHoje && atividadesHoje.length){
      return atividadesHoje.reduce((s,a) => s + (a.minutos||0), 0);
    }
    if(plano.horasAlvo && plano.diasAlvo){
      return Math.round((plano.horasAlvo * 60) / plano.diasAlvo);
    }
    return 150;
  }
  function concluirAtividadeDiaPorAssunto(state, semanaId, dataIso, assunto){
    if(!assunto) return null;
    const lista = obterPlano(state, semanaId)?.atividadesPorDia?.[dataIso];
    const item = lista?.find(a => a.assunto === assunto && !a.concluida);
    if(!item) return null;
    item.concluida = true;
    return item;
  }
  function definirMetaMinutosDia(state, semanaId, dataIso, minutos){
    let plano = obterPlano(state, semanaId);
    if(!plano){
      plano = { semanaId, assuntosAlvo: [], diasAlvo: 0, horasAlvo: 0, diasDisponiveis: [], horario: '', concursosPrioritarios: [], atividadesPorDia: {}, metaMinutosPorDia: {} };
      state.planejamento.push(plano);
    }
    if(!plano.metaMinutosPorDia) plano.metaMinutosPorDia = {};
    const min = Number(minutos) || 0;
    if(min > 0) plano.metaMinutosPorDia[dataIso] = min;
    else delete plano.metaMinutosPorDia[dataIso];
    return plano.metaMinutosPorDia[dataIso] ?? null;
  }
  function proximaAtividadeDoDia(atividades, filaFlashcards, state){
    const atrasada = atividades.find(a => a.estado === 'atrasada');
    if(atrasada) return {origem:'conteudo', ...atrasada};
    const pendente = atividades.find(a => a.estado === 'pendente');
    if(pendente) return {origem:'conteudo', ...pendente};
    if(filaFlashcards.length){
      const flashcard = filaFlashcards[0];
      const erro = obterErroDoFlashcard(state, flashcard);
      if(erro) return {origem:'erro', erro, flashcard};
    }
    return null;
  }
  function formatarDataExtenso(iso){
    const d = new Date(iso + 'T00:00:00');
    const weekday = d.toLocaleDateString('pt-BR', {weekday:'long'});
    const day = d.getDate();
    const month = d.toLocaleDateString('pt-BR', {month:'long'});
    return `${weekday} ${day} de ${month}`;
  }
  function iconeTipo(tipo){
    return {questoes:icone('help-circle'), teoria:icone('book'), revisao:icone('refresh'), anki:icone('folder')}[tipo] || icone('file-text');
  }
  function formatarDuracaoMin(totalMinRaw){
    const totalMin = Math.round(totalMinRaw);
    if(totalMin < 60) return `${totalMin} min`;
    const h = Math.floor(totalMin/60), m = totalMin%60;
    return m ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`;
  }

      const formatarMMSS = (segundos) => `${String(Math.floor(segundos/60)).padStart(2,'0')}:${String(segundos%60).padStart(2,'0')}`;
      const tick = () => {
        const sessao = state.sessaoEmAndamento;

          const totalEl = document.getElementById('timer-total-foco');

        } else {
          timerEl.textContent = formatarMMSS(Math.floor(elapsedMsSessao(sessao)/1000));

      tick();

  function attachComboBusca(buscaId, hiddenId, resultadosId){
    const busca = document.getElementById(buscaId);
    const hidden = document.getElementById(hiddenId);
    const resultados = document.getElementById(resultadosId);
    if(!busca || !hidden || !resultados) return;
    function renderizarResultados(filtro){
      const termo = filtro.trim().toLowerCase();
      const opcoes = state.conteudo.filter(c => typeof c.assunto === 'string' && c.assunto.toLowerCase().includes(termo)).slice(0, 8);
      resultados.innerHTML = opcoes.length
        ? opcoes.map(c => `<div class="combo-item" data-valor="${escapeHtml(c.assunto)}">${escapeHtml(c.assunto)}</div>`).join('')
        : '<div class="combo-empty muted">Nenhum assunto encontrado</div>';
      resultados.classList.add('open');
    }
    busca.addEventListener('focus', () => renderizarResultados(busca.value));
    busca.addEventListener('input', () => { hidden.value = ''; renderizarResultados(busca.value); });
    busca.addEventListener('blur', () => resultados.classList.remove('open'));
    // mousedown (not click) + preventDefault stops the input's blur from firing before the
    // selection registers, so a tap on a result never races the list closing.
    resultados.addEventListener('mousedown', (e) => {
      const item = e.target.closest('.combo-item');
      if(!item) return;
      e.preventDefault();
      busca.value = item.dataset.valor;
      hidden.value = item.dataset.valor;
      resultados.classList.remove('open');
    });
  }
  function resolverAssuntoBusca(buscaId, hiddenId){
    const hidden = document.getElementById(hiddenId);
    if(hidden && hidden.value) return hidden.value;
    const busca = document.getElementById(buscaId);
    if(!busca || !busca.value.trim()) return null;
    const texto = busca.value.trim().toLowerCase();
    const match = state.conteudo.find(c => typeof c.assunto === 'string' && c.assunto.toLowerCase() === texto);
    return match ? match.assunto : null;
  }

      const trechoExplicacao = e.explicacao ? (e.explicacao.length > 110 ? e.explicacao.slice(0,110)+'…' : e.explicacao) : '(sem explicação registrada ainda)';
      return `
        <div class="erro-card ${expandido?'expandido':''}" style="border-left:3px solid ${corDisciplina(e.disciplinaId||e.assunto)};">
          <div class="erro-card-header" data-toggle-erro="${e.id}">
            <div class="item-icon tipo-teoria">${iconePorAssunto(e.assunto)}</div>
            <div class="erro-card-titulo">
              <div class="erro-card-assunto-row">
                <b>${escapeHtml(e.assunto)}</b>
                <span class="badge">${escapeHtml(categoria)}</span>
                ${e.precisaCompletar ? `<span class="badge" style="background:var(--warn-soft);color:var(--warn);">Explicação pendente</span>` : ''}
              </div>
              <div class="erro-card-oque">${escapeHtml(e.oQueErrei)}</div>
              <div class="erro-card-preview muted">${escapeHtml(trechoExplicacao)}</div>
            </div>
            <div class="erro-card-meta">
              <span class="erro-prioridade-badge prioridade-${prioridade}">${PRIORIDADE_LABEL[prioridade]}</span>
              ${proximaRevisaoErro ? `<span class="erro-card-data">${icone('calendar')} ${diasAtrasoLabel(proximaRevisaoErro, hojeIso)}</span>` : ''}
            </div>
            <button class="erro-card-chevron" aria-label="Expandir">${expandido?'▲':'▼'}</button>
          </div>
          ${expandido ? `
            <div class="erro-card-body">
              ${e.enunciadoResumo ? `<div class="erro-card-col"><div class="erro-card-col-titulo">Enunciado</div><p class="muted">${escapeHtml(e.enunciadoResumo)}</p></div>` : ''}
              <div class="erro-card-col">
                <div class="erro-card-col-titulo erro-col-bad">O que errei</div>
                <p class="muted">${escapeHtml(e.oQueErrei)}</p>
              </div>
              <div class="erro-card-col" style="grid-column:1/-1;">
                <div class="erro-card-col-titulo erro-col-ok">Explicação</div>
                ${e.explicacao ? `<p>${escapeHtml(e.explicacao)}</p>` : `<p class="muted">Ainda não tem explicação completa registrada. <button class="card-link" data-editar-erro="${e.id}" style="display:inline;width:auto;min-height:auto;padding:0;">Completar agora →</button></p>`}
              </div>
              ${e.pegadinha ? `<div class="erro-card-col erro-card-pegadinha" style="grid-column:1/-1;"><div class="erro-card-col-titulo">Pegadinha</div><p>${escapeHtml(e.pegadinha)}</p></div>` : ''}
            </div>
            <div class="erro-card-footer">
              <div class="erro-card-footer-info muted">
                Registrado em ${formatarData(e.criadoEm)} · ${ORIGEM_LABEL[e.origem]||e.origem}
                ${e.fonte ? ` · ${escapeHtml(e.fonte)}` : ''}
                ${e.baseLegal ? ` · Ref.: ${escapeHtml(e.baseLegal)}` : ''}
                · ${cards.length} flashcard${cards.length===1?'':'s'}
              </div>
              <div class="erro-card-footer-actions">
                <button data-add-flashcard="${e.id}">+ Flashcard</button>
                <button data-editar-erro="${e.id}">Editar</button>
                <div class="erro-menu-wrap">
                  <button data-erro-menu="${e.id}">⋯</button>
                  ${erroMenuAberto === e.id ? `<div class="erro-menu-dropdown"><button class="bad" data-excluir-erro="${e.id}">Excluir</button></div>` : ''}
                </div>
              </div>
            </div>
          ` : ''}
        </div>`;
    };

    const listaHtml = `
      <div class="erros-lista">
        ${listaFiltrada.length ? listaFiltrada.map(cardHtml).join('') : `<div class="card"><div class="empty-state"><div class="empty-state-icon">${icone('search')}</div><p class="muted">Nenhum erro encontrado com esses filtros.</p></div></div>`}
        <button class="add-activity-row" id="erros-novo-rodape">+ Adicionar novo erro</button>
        <p class="muted" style="text-align:center;font-size:var(--text-sm);margin-top:-8px;">Registre um erro para acompanhar e não repetir mais.</p>
      </div>`;

    const sidebarHtml = `
      <div>
        <div class="card">
          <h3><span class="section-icon">${icone('link')}</span>Resumo rápido</h3>
          <div class="resumo-meta-item"><div><b>${stats.pendentes}</b><br><small class="muted">Total pendentes</small></div></div>
          <div class="resumo-meta-item"><div><b>${stats.revisoesHoje}</b><br><small class="muted">Revisões hoje</small></div></div>
          <div class="resumo-meta-item"><div><b>${stats.revisadosEstaSemana}</b><br><small class="muted">Revisados esta semana</small></div></div>
          <div class="resumo-meta-item"><div><b>${stats.taxaRevisao}%</b><br><small class="muted">Taxa de revisão</small></div></div>
          <div class="resumo-meta-item"><div><b>${state.contadorRevisoes || 0}</b><br><small class="muted">Total de revisões (desde sempre)</small></div></div>
          ${stats.assuntoMaisFrequente ? `<div class="resumo-meta-item"><div><b>${escapeHtml(stats.assuntoMaisFrequente)}</b><br><small class="muted">Assunto mais frequente — ${stats.assuntoMaisFrequenteCount} erros</small></div></div>` : ''}
        </div>
        <div class="card">
          <h3><span class="section-icon">${icone('graduation-cap')}</span>Como registrar um bom erro</h3>
          <div class="erros-dica"><b>Seja específico</b><p class="muted">Descreva exatamente o que errou e onde teve dúvida.</p></div>
          <div class="erros-dica"><b>Explique o porquê</b><p class="muted">Entenda e registre a regra correta com suas próprias palavras.</p></div>
          <div class="erros-dica"><b>Revise com espaçamento</b><p class="muted">Agende revisões para fixar e evitar repetir o erro.</p></div>
          <div class="erros-dica"><b>Foque no aprendizado</b><p class="muted">Use os erros como oportunidade de evolução constante.</p></div>
        </div>
      </div>`;

    const erroModalHtml = erroModalAberto ? (() => {
      const editando = erroModalAberto.modo === 'editar';
      const erro = editando ? state.erros.find(e => e.id === erroModalAberto.id) : null;
      const assuntoInicial = editando ? erro.assunto : (state.conteudo[0]?.assunto || '');
      const contagemInicial = assuntoInicial ? contarErrosPorAssunto(state.erros, assuntoInicial, editando ? erro.id : null) : 0;
      const explicacaoInicial = editando ? (erro.explicacao || '') : '';
      return `
        <div class="modal-backdrop" id="erro-modal-backdrop">
          <div class="modal-panel erro-form-panel">
            <h3>${editando ? 'Editar erro' : 'Novo erro'}</h3>
            <label>Assunto</label>
            <select id="erro-form-assunto">
              ${state.conteudo.map(c => `<option value="${escapeHtml(c.assunto)}" ${(erro?.assunto||'')===c.assunto?'selected':''}>${escapeHtml(c.assunto)}</option>`).join('')}
            </select>
            <small class="muted" id="erro-form-aviso">${contagemInicial ? `Você já tem ${contagemInicial} erro${contagemInicial===1?'':'s'} registrado${contagemInicial===1?'':'s'} para este assunto.` : ''}</small>
            <div class="row">
              <div>
                <label>Origem</label>
                <select id="erro-form-origem">
                  ${Object.entries(ORIGEM_LABEL).map(([v,l]) => `<option value="${v}" ${(erro?.origem||'questao_prova')===v?'selected':''}>${l}</option>`).join('')}
                </select>
              </div>
              <div>
                <label>Fonte (opcional)</label>
                <input type="text" id="erro-form-fonte" placeholder="banca/ano/prova" value="${editando ? escapeHtml(erro.fonte||'') : ''}">
              </div>
            </div>
            <label>Enunciado resumido (opcional)</label>
            <input type="text" id="erro-form-enunciado" placeholder="O que a questão cobrava, em 1-2 linhas" value="${editando ? escapeHtml(erro.enunciadoResumo||'') : ''}">
            <label>O que errei</label>
            <textarea id="erro-form-oque" placeholder="Qual foi o equívoco especificamente">${editando ? escapeHtml(erro.oQueErrei) : ''}</textarea>
            <label>Explicação completa</label>
            <textarea id="erro-form-explicacao" class="erro-form-explicacao" placeholder="Escreva aqui o conteúdo como se fosse ensinar alguém. Ao revisar, você deve conseguir aprender só com este texto.">${escapeHtml(explicacaoInicial)}</textarea>
            <div class="erro-form-contador" id="erro-form-contador">0 / ${EXPLICACAO_MIN_CHARS}</div>
            <small class="muted" id="erro-form-erro-explicacao" style="color:var(--bad);display:none;"></small>
            <details class="erro-form-exemplo">
              <summary>Ver exemplo — ruim vs. bom</summary>
              <p class="muted"><b>Ruim:</b> "Revisar base legal: Lei 9.433/1997"</p>
              <p class="muted"><b>Bom:</b> "O CNRH arbitra conflitos sobre recursos hídricos em última instância administrativa, aprova o Plano Nacional de Recursos Hídricos e estabelece critérios gerais para outorga e cobrança. Pegadinha: o CNRH define critérios gerais — quem executa a outorga é o órgão gestor (ANA, no âmbito federal)."</p>
            </details>
            <label>Pegadinha (opcional)</label>
            <textarea id="erro-form-pegadinha" placeholder="A distinção que a banca explora">${editando ? escapeHtml(erro.pegadinha||'') : ''}</textarea>
            <label>Referência (opcional)</label>
            <input type="text" id="erro-form-baselegal" placeholder="Só a referência. A explicação vai no campo acima." value="${editando ? escapeHtml(erro.baseLegal||'') : ''}">
            <div class="row">
              <div>
                <label>Tipo de erro</label>
                <select id="erro-form-tipo">
                  ${Object.entries(TIPO_ERRO_LABEL).map(([v,l]) => `<option value="${v}" ${(erro?.tipoErro||'conteudo')===v?'selected':''}>${l}</option>`).join('')}
                </select>
              </div>
              <div>
                <label>Prioridade</label>
                <select id="erro-form-prioridade">
                  ${Object.entries(PRIORIDADE_LABEL).map(([v,l]) => `<option value="${v}" ${(erro?.prioridade||'media')===v?'selected':''}>${l}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="row">
              <button id="erro-form-cancelar">Cancelar</button>
              <button class="primary" id="erro-form-salvar">${editando ? 'Salvar alterações' : 'Adicionar'}</button>
            </div>
          </div>
        </div>`;
    })() : '';

    const flashcardModalHtml = flashcardModalErroId ? (() => {
      const erroAlvo = state.erros.find(e => e.id === flashcardModalErroId);
      if(!erroAlvo) return '';
      return `
        <div class="modal-backdrop" id="flashcard-modal-backdrop">
          <div class="modal-panel">
            <h3>Novo flashcard — ${escapeHtml(erroAlvo.assunto)}</h3>
            <small class="muted">Frente e verso curtos, uma informação por card.</small>
            <label>Frente</label>
            <textarea id="flashcard-form-frente" placeholder="A pergunta ou o gatilho de memória"></textarea>
            <label>Verso</label>
            <textarea id="flashcard-form-verso" placeholder="A resposta"></textarea>
            <div class="row">
              <button id="flashcard-form-cancelar">Cancelar</button>
              <button class="primary" id="flashcard-form-salvar">Adicionar flashcard</button>
            </div>
          </div>
        </div>`;
    })() : '';

    const sessaoModalHtml = revisaoSessao ? (() => {
      const fcAtual = state.flashcards.find(f => f.id === revisaoSessao.fila[revisaoSessao.indice]);
      const terminou = revisaoSessao.indice >= revisaoSessao.fila.length || !fcAtual;
      const erroAtual = fcAtual ? obterErroDoFlashcard(state, fcAtual) : null;
      return `
        <div class="modal-backdrop" id="revisao-sessao-backdrop">
          <div class="modal-panel revisao-sessao-panel">
            ${terminou ? `
              <div class="empty-state">
                <div class="empty-state-icon">${icone('check-circle',28)}</div>
                <b>Sessão concluída</b>
                <p class="muted">Você revisou ${revisaoSessao.fila.length} flashcard${revisaoSessao.fila.length===1?'':'s'}.</p>
                <button class="primary" id="revisao-sessao-fechar">Fechar</button>
              </div>
            ` : `
              <div class="revisao-sessao-progresso">${revisaoSessao.indice+1} de ${revisaoSessao.fila.length}</div>
              <div class="progress"><i style="width:${Math.round((revisaoSessao.indice)/revisaoSessao.fila.length*100)}%"></i></div>
              ${fcAtual.precisaCompletar ? `
                <div class="erro-form-erro" style="margin-top:var(--space-2);">
                  Card incompleto — completar explicação.
                  <button class="card-link" id="revisao-sessao-completar" style="display:inline;width:auto;min-height:auto;padding:0;">Editar erro de origem →</button>
                </div>` : ''}
              <h3>${escapeHtml(erroAtual?.assunto || '')}</h3>
              <div class="revisao-sessao-secao">
                <p style="font-size:var(--text-lg);">${escapeHtml(fcAtual.frente)}</p>
              </div>
              ${revisaoSessao.revelado ? `
                <div class="revisao-sessao-secao">
                  <div class="erro-card-col-titulo erro-col-ok">Resposta</div>
                  <p>${escapeHtml(fcAtual.verso)}</p>
                </div>
                <div class="revisao-sm2-row">
                  <button class="bad" data-sm2="errei">Errei</button>
                  <button data-sm2="dificil">Difícil</button>
                  <button data-sm2="bom">Bom</button>
                  <button class="ok" data-sm2="facil">Fácil</button>
                </div>
                <button class="card-link" id="revisao-sessao-ver-erro">Ver explicação completa →</button>
              ` : `
                <button class="primary" id="revisao-sessao-revelar">Mostrar resposta</button>
              `}
              <button class="card-link" id="revisao-sessao-cancelar">Encerrar sessão</button>
            `}
          </div>
        </div>`;
    })() : '';

    return `<div class="erros-screen">${headerHtml}<div class="grid-hoje">${listaHtml}${sidebarHtml}</div>${erroModalHtml}${flashcardModalHtml}${sessaoModalHtml}</div>`;
  }

  function attachErrosHandlers(){
    document.querySelectorAll('[data-erros-filtro]').forEach(btn => {
      btn.addEventListener('click', () => { errosFiltro = btn.dataset.errosFiltro; render(); });
    });
    document.getElementById('erros-assunto-select')?.addEventListener('change', (e) => {
      errosFiltroAssunto = e.target.value;
      render();
    });
    document.getElementById('erros-tipo-select')?.addEventListener('change', (e) => {
      errosFiltroTipo = e.target.value;
      render();
    });
    document.getElementById('erros-prioridade-select')?.addEventListener('change', (e) => {
      errosFiltroPrioridade = e.target.value;
      render();
    });
    document.getElementById('erros-concurso-select')?.addEventListener('change', (e) => {
      errosFiltroConcurso = e.target.value;
      render();
    });
    document.getElementById('erros-ordenar-select')?.addEventListener('change', (e) => {
      errosOrdenacao = e.target.value;
      render();
    });
    const buscaInput = document.getElementById('erros-busca-input');
    if(buscaInput){
      buscaInput.addEventListener('input', () => {
        errosBusca = buscaInput.value;
        renderPreservandoFoco();
      });
    }

    document.querySelectorAll('[data-toggle-erro]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.toggleErro;
        if(errosExpandidos.has(id)) errosExpandidos.delete(id); else errosExpandidos.add(id);
        render();
      });
    });

    document.querySelectorAll('[data-editar-erro]').forEach(btn => {
      btn.addEventListener('click', () => {
        erroModalAberto = { modo:'editar', id: btn.dataset.editarErro };
        revisaoSessao = null;
        render();
      });
    });
    document.querySelectorAll('[data-add-flashcard]').forEach(btn => {
      btn.addEventListener('click', () => {
        flashcardModalErroId = btn.dataset.addFlashcard;
        render();
      });
    });
    document.querySelectorAll('[data-erro-menu]').forEach(btn => {
      btn.addEventListener('click', () => {
        erroMenuAberto = erroMenuAberto === btn.dataset.erroMenu ? null : btn.dataset.erroMenu;
        render();
      });
    });
    document.querySelectorAll('[data-excluir-erro]').forEach(btn => {
      btn.addEventListener('click', () => {
        if(!confirmarAcao('Excluir este erro registrado e seus flashcards? Essa ação não pode ser desfeita.')) return;
        excluirErro(state, btn.dataset.excluirErro);
        erroMenuAberto = null;
        saveState(state);
        render();
      });
    });

    document.getElementById('erros-novo-btn')?.addEventListener('click', () => {
      erroModalAberto = { modo:'novo' };
      render();
    });
    document.getElementById('erros-novo-rodape')?.addEventListener('click', () => {
      erroModalAberto = { modo:'novo' };
      render();
    });
    document.getElementById('erro-form-cancelar')?.addEventListener('click', () => {
      erroModalAberto = null;
      render();
    });
    document.getElementById('erro-modal-backdrop')?.addEventListener('click', (e) => {
      if(e.target.id === 'erro-modal-backdrop'){ erroModalAberto = null; render(); }
    });
    document.getElementById('erro-form-assunto')?.addEventListener('change', (e) => {
      const assunto = e.target.value;
      const excluirId = erroModalAberto?.modo === 'editar' ? erroModalAberto.id : null;
      const count = contarErrosPorAssunto(state.erros, assunto, excluirId);
      const aviso = document.getElementById('erro-form-aviso');
      if(aviso) aviso.textContent = count ? `Você já tem ${count} erro${count===1?'':'s'} registrado${count===1?'':'s'} para este assunto.` : '';
    });
    const explicacaoInput = document.getElementById('erro-form-explicacao');
    const atualizarContadorExplicacao = () => {
      const contador = document.getElementById('erro-form-contador');
      if(!contador || !explicacaoInput) return;
      const n = explicacaoInput.value.trim().length;
      contador.textContent = `${n} / ${EXPLICACAO_MIN_CHARS}`;
      contador.classList.toggle('ok', n >= EXPLICACAO_MIN_CHARS);
    };
    if(explicacaoInput){
      atualizarContadorExplicacao();
      explicacaoInput.addEventListener('input', atualizarContadorExplicacao);
    }
    document.getElementById('erro-form-salvar')?.addEventListener('click', () => {
      const assunto = document.getElementById('erro-form-assunto').value;
      const origem = document.getElementById('erro-form-origem').value;
      const fonte = document.getElementById('erro-form-fonte').value.trim();
      const enunciadoResumo = document.getElementById('erro-form-enunciado').value.trim();
      const oQueErrei = document.getElementById('erro-form-oque').value.trim();
      const explicacao = document.getElementById('erro-form-explicacao').value.trim();
      const pegadinha = document.getElementById('erro-form-pegadinha').value.trim();
      const baseLegal = document.getElementById('erro-form-baselegal').value.trim();
      const tipoErro = document.getElementById('erro-form-tipo').value;
      const prioridade = document.getElementById('erro-form-prioridade').value;
      const avisoEl = document.getElementById('erro-form-erro-explicacao');
      if(!oQueErrei){ alert('Preencha "o que errei".'); return; }
      const erroValidacao = validarExplicacao(explicacao);
      if(erroValidacao){
        if(avisoEl){ avisoEl.textContent = erroValidacao; avisoEl.style.display = 'block'; }
        return;
      }
      if(avisoEl) avisoEl.style.display = 'none';
      const dados = { assunto, disciplinaId: assunto, origem, fonte: fonte||null, enunciadoResumo, oQueErrei, explicacao, pegadinha: pegadinha||null, baseLegal: baseLegal||null, tipoErro, prioridade };
      if(erroModalAberto.modo === 'editar'){
        atualizarErro(state, erroModalAberto.id, dados);
      } else {
        criarErro(state, dados);
      }
      saveState(state);
      erroModalAberto = null;
      render();
    });

    document.getElementById('flashcard-modal-backdrop')?.addEventListener('click', (e) => {
      if(e.target.id === 'flashcard-modal-backdrop'){ flashcardModalErroId = null; render(); }
    });
    document.getElementById('flashcard-form-cancelar')?.addEventListener('click', () => {
      flashcardModalErroId = null;
      render();
    });
    document.getElementById('flashcard-form-salvar')?.addEventListener('click', () => {
      const frente = document.getElementById('flashcard-form-frente').value.trim();
      const verso = document.getElementById('flashcard-form-verso').value.trim();
      if(!frente || !verso){ alert('Preencha frente e verso do flashcard.'); return; }
      criarFlashcard(state, flashcardModalErroId, { frente, verso, precisaCompletar: false });
      saveState(state);
      flashcardModalErroId = null;
      render();
    });

    document.getElementById('erros-revisar-pendentes-btn')?.addEventListener('click', () => {
      revisaoSessao = iniciarSessaoRevisao(state, hojeISO());
      render();
    });
    document.getElementById('revisao-sessao-revelar')?.addEventListener('click', () => {
      revisaoSessao.revelado = true;
      render();
    });
    document.querySelectorAll('[data-sm2]').forEach(btn => {
      btn.addEventListener('click', () => {
        const fcAtual = state.flashcards.find(f => f.id === revisaoSessao.fila[revisaoSessao.indice]);
        if(fcAtual){
          aplicarResultadoRevisao(fcAtual, btn.dataset.sm2);
          incrementarContadorRevisoes(state);
          const erroDoCard = obterErroDoFlashcard(state, fcAtual);
          if(erroDoCard && (btn.dataset.sm2==='bom'||btn.dataset.sm2==='facil')) avancarStatusPorAtividade(state, erroDoCard.assunto, hojeISO());
        }
        saveState(state);
        revisaoSessao.indice++;
        revisaoSessao.revelado = false;
        render();
      });
    });
    document.getElementById('revisao-sessao-completar')?.addEventListener('click', () => {
      const fcAtual = state.flashcards.find(f => f.id === revisaoSessao.fila[revisaoSessao.indice]);
      const erroDoCard = fcAtual ? obterErroDoFlashcard(state, fcAtual) : null;
      if(erroDoCard){
        erroModalAberto = { modo:'editar', id: erroDoCard.id };
        revisaoSessao = null;
      }
      render();
    });
    document.getElementById('revisao-sessao-ver-erro')?.addEventListener('click', () => {
      const fcAtual = state.flashcards.find(f => f.id === revisaoSessao.fila[revisaoSessao.indice]);
      const erroDoCard = fcAtual ? obterErroDoFlashcard(state, fcAtual) : null;
      if(erroDoCard){
        errosExpandidos.add(erroDoCard.id);
        revisaoSessao = null;
      }
      render();
    });
    document.getElementById('revisao-sessao-fechar')?.addEventListener('click', () => {

  function attachPlanejamentoHandlers(){

  function renderDesempenho(){
    const hojeIso = hojeISO();
    if(desempenhoCicloId === null) desempenhoCicloId = state.ciclos[state.ciclos.length-1].id;
    const range = calcularRangeDesempenho(state, desempenhoCicloId, desempenhoPeriodo, hojeIso) || { inicio: hojeIso, fim: hojeIso };
    const cicloBounds = limitesCiclo(state.ciclos, desempenhoCicloId, hojeIso) || range;
    let rangeAntRaw = periodoAnterior(range.inicio, range.fim);
    // "período anterior" never crosses into a different ciclo's data -- if the current range
    // already starts at the ciclo's own beginning, there's nothing valid to compare against.
    const rangeAnt = rangeAntRaw.fim < cicloBounds.inicio ? null
      : { inicio: rangeAntRaw.inicio < cicloBounds.inicio ? cicloBounds.inicio : rangeAntRaw.inicio, fim: rangeAntRaw.fim };

    const checkinsP = filtrarPorConcurso(state, filtrarPorPeriodo(state.checkins, range.inicio, range.fim), desempenhoConcurso);
    const sessoesP = filtrarPorConcurso(state, filtrarPorPeriodo(state.sessoes, range.inicio, range.fim), desempenhoConcurso);
    const checkinsAnt = rangeAnt ? filtrarPorConcurso(state, filtrarPorPeriodo(state.checkins, rangeAnt.inicio, rangeAnt.fim), desempenhoConcurso) : [];
    const sessoesAnt = rangeAnt ? filtrarPorConcurso(state, filtrarPorPeriodo(state.sessoes, rangeAnt.inicio, rangeAnt.fim), desempenhoConcurso) : [];

    const agregadoP = agregarPorAssunto(checkinsP, sessoesP);
    const agregadoAnt = agregarPorAssunto(checkinsAnt, sessoesAnt);
    const questoesP = agregadoP.reduce((s,a)=>s+a.questoes,0);
    const acertosP = agregadoP.reduce((s,a)=>s+a.acertos,0);
    const pctAcertoP = questoesP ? Math.round((acertosP/questoesP)*1000)/10 : 0;
    const questoesAnt = agregadoAnt.reduce((s,a)=>s+a.questoes,0);
    const acertosAnt = agregadoAnt.reduce((s,a)=>s+a.acertos,0);
    const pctAcertoAnt = questoesAnt ? Math.round((acertosAnt/questoesAnt)*1000)/10 : 0;
    const horasP = totalHorasEstudadas(checkinsP, sessoesP);
    const horasAnt = totalHorasEstudadas(checkinsAnt, sessoesAnt);
    const sequenciaAtual = calcularSequencia(state.checkins, state.sessoes, hojeIso);
    const sequenciaAnt = calcularSequencia(state.checkins, state.sessoes, addDays(range.inicio,-1));
    const revisoesP = revisoesNoPeriodo(state.flashcards, range.inicio, range.fim);
    const revisoesAnt = rangeAnt ? revisoesNoPeriodo(state.flashcards, rangeAnt.inicio, rangeAnt.fim) : 0;
    const tempoMedioP = tempoMedioPorSessao(sessoesP);
    const tempoMedioAnt = tempoMedioPorSessao(sessoesAnt);

    const sparkOpts = { state, concursoSel: desempenhoConcurso };
    const bucket = (calc) => bucketsSemanais(range.inicio, range.fim, calc);
    const sparkQuestoes = bucket((i,f) => {
      const ag = agregarPorAssunto(filtrarPorConcurso(state, filtrarPorPeriodo(state.checkins,i,f), desempenhoConcurso), filtrarPorConcurso(state, filtrarPorPeriodo(state.sessoes,i,f), desempenhoConcurso));
      return ag.reduce((s,a)=>s+a.questoes,0);
    });
    const sparkAcerto = bucket((i,f) => {
      const ag = agregarPorAssunto(filtrarPorConcurso(state, filtrarPorPeriodo(state.checkins,i,f), desempenhoConcurso), filtrarPorConcurso(state, filtrarPorPeriodo(state.sessoes,i,f), desempenhoConcurso));
      const q = ag.reduce((s,a)=>s+a.questoes,0), a = ag.reduce((s,x)=>s+x.acertos,0);
      return q ? Math.round((a/q)*100) : 0;
    });
    const sparkHoras = bucket((i,f) => totalHorasEstudadas(filtrarPorConcurso(state, filtrarPorPeriodo(state.checkins,i,f), desempenhoConcurso), filtrarPorConcurso(state, filtrarPorPeriodo(state.sessoes,i,f), desempenhoConcurso)));
    const sparkDias = bucket((i,f) => diasEstudados(filtrarPorPeriodo(state.checkins,i,f), filtrarPorPeriodo(state.sessoes,i,f)));
    const sparkRevisoes = bucket((i,f) => revisoesNoPeriodo(state.flashcards, i, f));
    const sparkTempoMedio = bucket((i,f) => tempoMedioPorSessao(filtrarPorConcurso(state, filtrarPorPeriodo(state.sessoes,i,f), desempenhoConcurso)));

    const kpiCard = (label, valor, spark, cor, delta, sufixo) => `
      <div class="card stat-card desempenho-kpi-card">
        <div class="stat-label">${label}</div>
        <div class="desempenho-kpi-row">
          <div class="stat-value">${valor}</div>
          ${sparklineSvg(spark, cor)}
        </div>
        ${kpiDeltaHtml(delta, sufixo)}
      </div>`;

    const headerHtml = `
      <div class="card">
        <div class="erros-header-row">
          <div class="planejamento-header">
            <div class="hoje-header-icon">${icone('trending-up')}</div>
            <div>
              <h2>Desempenho</h2>
              <small class="muted">Acompanhe sua evolução por ciclo, disciplina e consistência.</small>
            </div>
          </div>
          <div class="desempenho-filtros">
            <select id="desempenho-ciclo-select">
              ${state.ciclos.map(c => `<option value="${c.id}" ${desempenhoCicloId===c.id?'selected':''}>${escapeHtml(c.nome)}</option>`).join('')}
            </select>
            <button id="desempenho-novo-ciclo-btn" title="Novo ciclo">+ Ciclo</button>
            <select id="desempenho-periodo-select">
              <option value="30" ${desempenhoPeriodo==='30'?'selected':''}>Últimos 30 dias</option>
              <option value="60" ${desempenhoPeriodo==='60'?'selected':''}>Últimos 60 dias</option>
              <option value="90" ${desempenhoPeriodo==='90'?'selected':''}>Últimos 90 dias</option>
              <option value="ciclo" ${desempenhoPeriodo==='ciclo'?'selected':''}>Ciclo inteiro</option>
            </select>
            <select id="desempenho-concurso-select">
              <option value="todos" ${desempenhoConcurso==='todos'?'selected':''}>Todos os concursos</option>
              ${state.concursos.map(nome => `<option value="${slugConcurso(nome)}" ${desempenhoConcurso===slugConcurso(nome)?'selected':''}>${escapeHtml(nome)}</option>`).join('')}
            </select>
          </div>
        </div>
        ${desempenhoNovoCicloAberto ? `
          <div class="desempenho-novo-ciclo-form">
            <input type="text" id="desempenho-novo-ciclo-nome" placeholder="Nome do novo ciclo (ex: 2º Ciclo)">
            <button class="primary" id="desempenho-salvar-ciclo">Criar</button>
            <button id="desempenho-cancelar-ciclo">Cancelar</button>
          </div>` : ''}
      </div>

      <div class="kpi-grid">
        ${kpiCard('Questões respondidas', questoesP.toLocaleString('pt-BR'), sparkQuestoes, '#3b82f6', variacaoPct(questoesP, questoesAnt), '%')}
        ${kpiCard('% de acerto geral', pctAcertoP+'%', sparkAcerto, '#10b981', questoesAnt ? Math.round((pctAcertoP-pctAcertoAnt)*10)/10 : null, ' p.p.')}
        ${kpiCard('Horas estudadas', horasP+'h', sparkHoras, '#a855f7', variacaoPct(horasP, horasAnt), '%')}
        ${kpiCard('Dias em sequência', sequenciaAtual, sparkDias, '#f59e0b', sequenciaAtual-sequenciaAnt, ' dias')}
        ${kpiCard('Revisões concluídas', revisoesP.toLocaleString('pt-BR'), sparkRevisoes, '#06b6d4', variacaoPct(revisoesP, revisoesAnt), '%')}
        ${kpiCard('Tempo médio por sessão', formatarDuracaoMin(tempoMedioP), sparkTempoMedio, '#fbbf24', sessoesAnt.length ? tempoMedioP-tempoMedioAnt : null, 'm')}
      </div>

      <div class="grid-2">
        <div class="card">
          <h3>Evolução do desempenho</h3>
          ${agregadoP.length ? `<canvas id="chart-evolucao" height="200"></canvas>
          <p class="muted" style="margin-top:8px;">${questoesAnt ? `${pctAcertoP >= pctAcertoAnt ? 'Sua média de acerto aumentou' : 'Sua média de acerto caiu'} ${Math.abs(Math.round((pctAcertoP-pctAcertoAnt)*10)/10)} p.p. no período selecionado.` : `Sua média de acerto no período foi ${pctAcertoP}%.`}</p>` : '<p class="muted">Sem questões registradas no período.</p>'}
        </div>
        <div class="card">
          <h3>Desempenho por disciplina</h3>
          ${agregadoP.length ? `
            ${[...agregadoP].sort((a,b)=>b.pct-a.pct).slice(0, desempenhoMostrarTodasDisciplinas ? undefined : 6).map(a => `
              <div class="desempenho-disciplina-row">
                <div class="desempenho-disciplina-nome"><span class="disciplina-dot" style="background:${corDisciplina(a.assunto)};"></span>${escapeHtml(a.assunto)}</div>
                <div class="desempenho-disciplina-bar-track"><div class="desempenho-disciplina-bar-fill" style="width:${a.pct}%"></div></div>
                <div class="desempenho-disciplina-pct">${a.pct}%</div>
              </div>`).join('')}
            ${agregadoP.length > 6 ? `<button class="card-link" id="desempenho-toggle-disciplinas">${desempenhoMostrarTodasDisciplinas ? 'Ver menos' : 'Ver todas as disciplinas'} →</button>` : ''}
          ` : '<p class="muted">Sem questões registradas no período.</p>'}
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3>Distribuição do tempo de estudo</h3>
          ${(() => {
            const dist = distribuicaoTempoPorTipo(sessoesP);
            const totalMin = dist.teoria+dist.questoes+dist.revisao+dist.anki;
            if(!totalMin) return '<p class="muted">Sem sessões registradas no período.</p>';
            const cores = { teoria:'#3b82f6', questoes:'#10b981', revisao:'#fbbf24', anki:'#a855f7' };
            const labels = { teoria:'Teoria', questoes:'Questões', revisao:'Revisão', anki:'Anki' };
            return `
              <div class="desempenho-pizza-wrap">
                <div class="desempenho-pizza-canvas-wrap">
                  <canvas id="chart-distribuicao-tempo" width="140" height="140"></canvas>
                  <div class="desempenho-pizza-centro"><b>${formatarDuracaoMin(totalMin)}</b><small>Total</small></div>
                </div>
                <div class="desempenho-pizza-legend">
                  ${Object.keys(dist).map(k => `
                    <div class="desempenho-pizza-legend-item">
                      <span class="desempenho-pizza-dot" style="background:${cores[k]}"></span>
                      <span>${labels[k]}</span>
                      <b>${formatarDuracaoMin(dist[k])}</b>
                      <small class="muted">${totalMin ? Math.round((dist[k]/totalMin)*1000)/10 : 0}%</small>
                    </div>`).join('')}
                </div>
              </div>
              <button class="card-link" id="desempenho-toggle-detalhe">${desempenhoDetalheAberto ? 'Ocultar' : 'Ver detalhes'} →</button>
              ${desempenhoDetalheAberto ? `<p class="muted" style="margin-top:8px;">Somando todas as sessões registradas de ${range.inicio} a ${range.fim}, incluindo teoria, questões, revisão e Anki.</p>` : ''}
            `;
          })()}
        </div>
        <div class="card">
          <h3>Constância semanal</h3>
          ${(() => {
            const semanaAtual = semanaAtualId();
            const minutosEsta = constanciaSemanaMinutos(state.checkins, state.sessoes, semanaAtual);
            const meta = metaDiariaSemana(state, semanaAtual);
            const semanas4 = [1,2,3,4].map(n => addDays(semanaAtual, -7*n));
            const minutosPorSemana4 = semanas4.map(sid => constanciaSemanaMinutos(state.checkins, state.sessoes, sid));
            const media4 = [0,1,2,3,4,5,6].map(dia => Math.round(minutosPorSemana4.reduce((s,arr)=>s+arr[dia],0) / 4));
            const aderEsta = aderenciaSemana(minutosEsta, meta);
            const ader4 = aderenciaSemana(media4, meta);
            const aderMeta = 100;
            return `
              <div style="overflow-x:auto;">
                <table class="desempenho-constancia-table">
                  <thead><tr><th></th>${DIAS_SEMANA_LABEL.map(d=>`<th>${d}</th>`).join('')}<th>Aderência</th></tr></thead>
                  <tbody>
                    <tr><td>Esta semana</td>${minutosEsta.map(m=>`<td>${m}</td>`).join('')}<td class="desempenho-constancia-aderencia" style="color:${aderEsta>=80?'var(--ok)':aderEsta>=50?'var(--warn)':'var(--bad)'}">${aderEsta}%</td></tr>
                    <tr><td>Média últ. 4 sem.</td>${media4.map(m=>`<td>${m}</td>`).join('')}<td class="desempenho-constancia-aderencia" style="color:${ader4>=80?'var(--ok)':ader4>=50?'var(--warn)':'var(--bad)'}">${ader4}%</td></tr>
                    <tr><td>Meta diária</td>${meta.map(m=>`<td>${m}</td>`).join('')}<td class="desempenho-constancia-aderencia">${aderMeta}%</td></tr>
                  </tbody>
                </table>
              </div>
              <button class="card-link" id="desempenho-toggle-constancia">${desempenhoConstanciaInfoAberto ? 'Ocultar' : 'Entenda sua constância'} →</button>
              ${desempenhoConstanciaInfoAberto ? '<p class="muted" style="margin-top:8px;">Aderência compara os minutos estudados de cada linha com a meta diária configurada em Planejamento. Se nenhuma meta foi definida, a aderência fica em 0%.</p>' : ''}
            `;
          })()}
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3>Melhores assuntos</h3>
          ${(() => {
            const melhores = melhores5(agregadoP);
            const todos = [...agregadoP].filter(a=>a.questoes>0).sort((a,b)=>b.pct-a.pct);
            const lista = desempenhoMostrarTodosMelhores ? todos : melhores;
            if(!lista.length) return '<p class="muted">Sem dados suficientes no período.</p>';
            return lista.map(p => `
              <div class="desempenho-assunto-row">
                <div class="desempenho-assunto-row-top"><span>${escapeHtml(p.assunto)}</span><b>${p.pct}%</b></div>
                <div class="desempenho-assunto-bar-track"><div class="desempenho-assunto-bar-fill boa" style="width:${p.pct}%"></div></div>
              </div>`).join('') + (todos.length > 5 ? `<button class="card-link" id="desempenho-toggle-melhores">${desempenhoMostrarTodosMelhores?'Ver menos':'Ver todos os assuntos'} →</button>` : '');
          })()}
        </div>
        <div class="card">
          <h3>Assuntos que precisam de atenção</h3>
          ${(() => {
            const piores = piores5(agregadoP);
            const todos = [...agregadoP].filter(a=>a.questoes>0).sort((a,b)=>a.pct-b.pct);
            const lista = desempenhoMostrarTodosPiores ? todos : piores;
            if(!lista.length) return '<p class="muted">Sem dados suficientes no período.</p>';
            return lista.map(p => `
              <div class="desempenho-assunto-row">
                <div class="desempenho-assunto-row-top"><span>${escapeHtml(p.assunto)}</span><b>${p.pct}%</b></div>
                <div class="desempenho-assunto-bar-track"><div class="desempenho-assunto-bar-fill ruim" style="width:${p.pct}%"></div></div>
              </div>`).join('')
              + (todos.length > 5 ? `<button class="card-link" id="desempenho-toggle-piores">${desempenhoMostrarTodosPiores?'Ver menos':'Ver todos os assuntos'} →</button>` : '')
              + (lista.length ? `<button class="card-link" data-ir-erros>Revisar no Caderno de Erros →</button>` : '');
          })()}
        </div>
      </div>

      <div class="grid-2">
        ${(() => {
          const piores = piores5(agregadoP);
          const insight = gerarInsightAutomatico(piores);
          return `
            <div class="card desempenho-insight-card">
              <h3><span class="section-icon">${icone('lightbulb')}</span>Insight automático</h3>
              ${insight ? `<p>${escapeHtml(insight)}</p><div class="row"><button class="primary" data-ir-planejamento>Ver plano sugerido</button><button data-ir-erros>Revisar no Caderno de Erros</button></div>` : '<p class="muted">Registre mais questões no período pra receber um insight.</p>'}
            </div>`;
        })()}
        <div class="card">
          <h3>Meta do ciclo</h3>
          ${state.metaAcertoAlvo ? `
            <div class="desempenho-meta-valor"><span class="muted">% de acerto alvo</span><b>${pctAcertoP}%</b><span class="muted">${state.metaAcertoAlvo}%</span></div>
            <div class="progress"><i style="width:${Math.min(100, Math.round((pctAcertoP/state.metaAcertoAlvo)*100))}%;background:#a855f7"></i></div>
            <p class="muted" style="margin-top:6px;">${pctAcertoP >= state.metaAcertoAlvo ? 'Meta atingida.' : `Faltam ${Math.round((state.metaAcertoAlvo-pctAcertoP)*10)/10} p.p. para sua meta`}</p>
          ` : '<p class="muted">Nenhuma meta de acerto definida ainda.</p>'}
          ${desempenhoMetaAberto ? `
            <div class="desempenho-meta-form">
              <input type="number" id="desempenho-meta-input" min="1" max="100" value="${state.metaAcertoAlvo||75}">
              <button class="primary" id="desempenho-salvar-meta">Salvar</button>
              <button id="desempenho-cancelar-meta">Cancelar</button>
            </div>` : `<button class="card-link" id="desempenho-abrir-meta">Editar meta →</button>`}
        </div>
      </div>
    `;

    return `<div class="erros-screen">${headerHtml}</div>`;
  }

  function attachDesempenhoHandlers(){
    const hojeIso = hojeISO();
    document.getElementById('desempenho-ciclo-select')?.addEventListener('change', (e) => {
      desempenhoCicloId = e.target.value;
      render();
    });
    document.getElementById('desempenho-periodo-select')?.addEventListener('change', (e) => {
      desempenhoPeriodo = e.target.value;
      render();
    });
    document.getElementById('desempenho-concurso-select')?.addEventListener('change', (e) => {
      desempenhoConcurso = e.target.value;
      render();
    });
    document.getElementById('desempenho-novo-ciclo-btn')?.addEventListener('click', () => {
      desempenhoNovoCicloAberto = true;
      render();
    });
    document.getElementById('desempenho-cancelar-ciclo')?.addEventListener('click', () => {
      desempenhoNovoCicloAberto = false;
      render();
    });
    document.getElementById('desempenho-salvar-ciclo')?.addEventListener('click', () => {
      const nome = document.getElementById('desempenho-novo-ciclo-nome').value;
      const novo = criarCiclo(state, nome, hojeIso);
      if(!novo){ alert('Informe um nome pro novo ciclo.'); return; }
      saveState(state);
      desempenhoCicloId = novo.id;
      desempenhoNovoCicloAberto = false;
      render();
    });
    document.getElementById('desempenho-toggle-disciplinas')?.addEventListener('click', () => {
      desempenhoMostrarTodasDisciplinas = !desempenhoMostrarTodasDisciplinas;
      render();
    });
    document.getElementById('desempenho-toggle-melhores')?.addEventListener('click', () => {
      desempenhoMostrarTodosMelhores = !desempenhoMostrarTodosMelhores;
      render();
    });
    document.getElementById('desempenho-toggle-piores')?.addEventListener('click', () => {
      desempenhoMostrarTodosPiores = !desempenhoMostrarTodosPiores;
      render();
    });
    document.getElementById('desempenho-toggle-detalhe')?.addEventListener('click', () => {
      desempenhoDetalheAberto = !desempenhoDetalheAberto;
      render();
    });
    document.getElementById('desempenho-toggle-constancia')?.addEventListener('click', () => {
      desempenhoConstanciaInfoAberto = !desempenhoConstanciaInfoAberto;
      render();
    });
    document.getElementById('desempenho-abrir-meta')?.addEventListener('click', () => {
      desempenhoMetaAberto = true;
      render();
    });
    document.getElementById('desempenho-cancelar-meta')?.addEventListener('click', () => {
      desempenhoMetaAberto = false;
      render();
    });
    document.getElementById('desempenho-salvar-meta')?.addEventListener('click', () => {
      const valor = document.getElementById('desempenho-meta-input').value;
      const ok = definirMetaAcerto(state, valor);
      if(!ok){ alert('Informe um valor entre 1 e 100.'); return; }
      saveState(state);
      desempenhoMetaAberto = false;
      render();
    });
    document.querySelectorAll('[data-ir-planejamento]').forEach(btn => {
      btn.addEventListener('click', () => { currentTab = 'planejamento'; render(); });
    });
    document.querySelectorAll('[data-ir-erros]').forEach(btn => {
      btn.addEventListener('click', () => { currentTab = 'erros'; render(); });
    });

    if(desempenhoCicloId === null) desempenhoCicloId = state.ciclos[state.ciclos.length-1].id;
    const range = calcularRangeDesempenho(state, desempenhoCicloId, desempenhoPeriodo, hojeIso) || { inicio: hojeIso, fim: hojeIso };
    const checkinsP = filtrarPorConcurso(state, filtrarPorPeriodo(state.checkins, range.inicio, range.fim), desempenhoConcurso);
    const sessoesP = filtrarPorConcurso(state, filtrarPorPeriodo(state.sessoes, range.inicio, range.fim), desempenhoConcurso);
    const agregadoP = agregarPorAssunto(checkinsP, sessoesP);

    if(agregadoP.length){
      const dias = Math.max(1, Math.ceil((diasAte(range.inicio, range.fim)+1)/7));
      const evolucao = evolucaoSemanal(
        filtrarPorConcurso(state, state.checkins, desempenhoConcurso),
        filtrarPorConcurso(state, state.sessoes, desempenhoConcurso),
        hojeIso, dias
      );
      criarOuAtualizarChart('chart-evolucao', {
        type: 'line',
        data: {
          labels: evolucao.map(b => b.semanaId.slice(5)),
          datasets: [{ data: evolucao.map(b => b.pct), spanGaps:false, borderColor: corAccent(), backgroundColor:'transparent', tension:.3, pointRadius:3 }]
        },
        options: {
          responsive:true, plugins:{legend:{display:false}},
          scales:{
            y:{min:0,max:100, ticks:{color:corVar('--muted')}, grid:{color:corVar('--border')}},
            x:{ticks:{color:corVar('--muted')}, grid:{display:false}}
          }
        }
      });
    }

    const dist = distribuicaoTempoPorTipo(sessoesP);
    const totalMin = dist.teoria+dist.questoes+dist.revisao+dist.anki;
    if(totalMin){
      criarOuAtualizarChart('chart-distribuicao-tempo', {
        type: 'doughnut',
        data: {
          labels: ['Teoria','Questões','Revisão','Anki'],
          datasets: [{ data: [dist.teoria, dist.questoes, dist.revisao, dist.anki], backgroundColor: ['#3b82f6','#10b981','#fbbf24','#a855f7'], borderWidth:0 }]
        },
        options: { responsive:true, cutout:'70%', plugins:{legend:{display:false}} }
      });
    }
  }

  function renderScreen(){
    const app = document.getElementById('app');
    const openIdx = [...app.querySelectorAll('details')].reduce((acc,d,i)=>{ if(d.open) acc.push(i); return acc; }, []);
    const fieldValues = {};
    app.querySelectorAll('details input, details select, details textarea').forEach(el => { if(el.id) fieldValues[el.id] = el.value; });

    const map = {hoje:renderHoje, erros:renderErros, mapa:renderMapa, desempenho:renderDesempenho, dashboard:renderDashboard, config:renderConfig, planejamento:renderPlanejamento};
    app.innerHTML = map[currentTab]();
    if(currentTab==='hoje') attachHojeHandlers();
    if(currentTab==='erros') attachErrosHandlers();
    if(currentTab==='mapa') attachMapaHandlers();
    if(currentTab==='dashboard') attachDashboardHandlers();
    if(currentTab==='config') attachConfigHandlers();
    if(currentTab==='planejamento') attachPlanejamentoHandlers();
    if(currentTab==='desempenho') attachDesempenhoHandlers();

    app.querySelectorAll('details').forEach((d,i) => { if(openIdx.includes(i)) d.open = true; });
    Object.entries(fieldValues).forEach(([id,val]) => { const el = document.getElementById(id); if(el) el.value = val; });
  }

  function render(){ renderSidebar(); renderTabsNav(); renderScreen(); }

  attachSidebarHandlers();
  attachTabsHandlers();
  verificarNotificacoesPendentes();
  inicializarSincronizacaoSeAtiva();

  /* === INIT === */
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => reg.update())
        .catch(err => console.warn('SW falhou:', err));
    });
  }

  render();
  </script>
</body>
</html>
