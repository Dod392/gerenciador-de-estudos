    const atrasados = plano ? assuntosAtrasadosNaSemana(plano.assuntosAlvo, tocados) : [];
    const diasFeitos = diasRealizadosNaSemana(state.checkins, state.sessoes, semanaId);
    const horasFeitas = horasRealizadasNaSemana(state.checkins, state.sessoes, semanaId);

    const headerHtml = `
      <div class="card">
        <div class="planejamento-header-row">
          <div class="planejamento-header">
            <div class="hoje-header-icon">📅</div>
            <div>
              <h2>Planejamento</h2>
              <div class="planejamento-nav">
                <button class="card-link" id="semana-anterior">‹ Semana anterior</button>
                <b>Semana de ${semanaId} a ${fimSemana}</b>
                <button class="card-link" id="semana-proxima">Próxima semana ›</button>
              </div>
            </div>
          </div>
        </div>
        <div class="resumo-grid planejamento-badges">
          <div class="card stat-card"><div class="stat-label">Dias planejados</div><div class="stat-value">${diasAlvoAtual}/7</div><div class="stat-icon">📅</div></div>
          <div class="card stat-card"><div class="stat-label">Horas planejadas</div><div class="stat-value">${horasAlvoAtual}h</div><div class="stat-icon">⏱️</div></div>
          <div class="card stat-card"><div class="stat-label">Assuntos selecionados</div><div class="stat-value">${assuntosAtuais.length}</div><div class="stat-icon">📚</div></div>
        </div>
        <div class="planejamento-progresso">
          <div class="planejamento-progresso-label"><span>Progresso da semana — dias</span><b>${diasFeitos}/${diasAlvoAtual}</b></div>
          <div class="progress"><i style="width:${Math.min(100, diasAlvoAtual ? Math.round(diasFeitos/diasAlvoAtual*100) : 0)}%"></i></div>
          <div class="planejamento-progresso-label"><span>Progresso da semana — horas</span><b>${horasFeitas}h/${horasAlvoAtual}h</b></div>
          <div class="progress"><i style="width:${Math.min(100, horasAlvoAtual ? Math.round(horasFeitas/horasAlvoAtual*100) : 0)}%"></i></div>
        </div>
      </div>`;

    const metaMinutosPorDia = plano?.metaMinutosPorDia || {};
    const diaCardHtml = (label, dataIso) => {
      const atividades = atividadesPorDia[dataIso] || [];
      const ehHoje = dataIso === hoje;
      const totalMin = atividades.reduce((s,a) => s + (a.minutos||0), 0);
      const metaDia = metaMinutosPorDia[dataIso] ?? '';
      return `
        <div class="dia-card ${ehHoje ? 'hoje' : ''}">
          <div class="dia-card-header">
            <div class="dia-card-label">${label}</div>
            <div class="dia-card-date">${dataIso.slice(8,10)}</div>
          </div>
          <div class="dia-card-meta-row">
            <input type="number" class="dia-card-meta-input" data-meta-dia="${dataIso}" placeholder="meta min" value="${metaDia}" title="Meta de minutos pra este dia">
          </div>
          ${totalMin ? `<div class="dia-card-total">${totalMin} min planejados</div>` : ''}
          <div class="dia-card-atividades">
            ${atividades.map(a => `
              <div class="dia-atividade ${a.concluida?'concluida':''}">
                <button class="dia-atividade-check" data-toggle-atividade="${a.id}" data-toggle-data="${dataIso}" title="${a.concluida?'Marcar como pendente':'Marcar como concluída'}">${a.concluida?'✓':''}</button>
                <div class="dia-atividade-info">
                  <div class="dia-atividade-assunto">${escapeHtml(a.assunto || 'Estudo livre')}</div>
                  <div class="dia-atividade-meta">${escapeHtml(ATIVIDADE_DIA_TIPO_LABEL[a.tipo] || a.tipo)} · ${a.minutos} min</div>
                </div>
                <button class="dia-atividade-remover" data-remover-atividade="${a.id}" data-remover-data="${dataIso}" title="Remover">×</button>
              </div>`).join('')}
          </div>
          <button class="dia-card-add" data-add-atividade="${dataIso}">+ Adicionar</button>
        </div>`;
    };

    const gradeHtml = `
      <div class="card planejamento-grade">
        <div class="dia-grid">
          ${DIAS_SEMANA_LABEL.map((label, i) => diaCardHtml(label, addDays(semanaId, i))).join('')}
        </div>
      </div>`;

    const addAtividadeModalHtml = atividadeDiaAberta ? `
      <div class="modal-backdrop" id="add-atividade-backdrop">
        <div class="modal-panel" id="add-atividade-form">
          <h3>Adicionar atividade — ${atividadeDiaAberta.slice(8,10)}/${atividadeDiaAberta.slice(5,7)}</h3>
          <label>Assunto</label>
          <div class="combo">
            <input type="text" id="atividade-assunto-busca" placeholder="Buscar assunto..." autocomplete="off">
            <input type="hidden" id="atividade-assunto">
            <div class="combo-results" id="atividade-assunto-resultados"></div>
          </div>
          <label>Tipo</label>
          <select id="atividade-tipo">
            <option value="teoria">Teoria</option>
            <option value="questoes">Questões</option>
            <option value="revisao">Revisão</option>
          </select>
          <label>Duração (min)</label>
          <input type="number" id="atividade-minutos" value="30">
          <div class="row">
            <button id="atividade-cancelar">Cancelar</button>
            <button id="atividade-salvar" class="primary">Adicionar</button>
          </div>
        </div>
      </div>` : '';

    const chipsHtml = assuntosAtuais.map(a => `
      <span class="chip ${atrasados.includes(a)?'atrasado':''}">${escapeHtml(a)} <button type="button" data-remover-assunto="${escapeHtml(a)}" title="Remover">×</button></span>
    `).join('');

    const metaFormHtml = `
      <div class="card">
        <h3>Definir meta da semana</h3>
        <small class="muted">Selecione os assuntos e defina sua meta de estudo para esta semana.</small>

        <label>Assuntos-alvo</label>
        <div class="assunto-chips" id="meta-assuntos-chips">${chipsHtml || '<span class="muted">Nenhum assunto selecionado ainda.</span>'}</div>
        <div class="combo">
          <input type="text" id="meta-assunto-busca" placeholder="Adicionar assunto..." autocomplete="off">
          <input type="hidden" id="meta-assunto-hidden">
          <div class="combo-results" id="meta-assunto-resultados"></div>
        </div>
        <button type="button" id="meta-assunto-adicionar">+ Adicionar assunto</button>

        <div class="row">
          <div>
            <label>Dias-alvo</label>
            <input type="number" id="meta-dias-alvo" value="${diasAlvoAtual}">
          </div>
          <div>
            <label>Horas disponíveis</label>
            <input type="number" id="meta-horas" value="${horasAlvoAtual}">
          </div>
        </div>

        <details class="meta-opcionais">
          <summary>Mais opções (opcional)</summary>
          <label>Dias disponíveis</label>
          <div class="dias-checkbox-row">
            ${DIAS_SEMANA_KEY.map((k,i) => `<label class="dia-checkbox"><input type="checkbox" id="meta-dia-${k}" ${diasDisponiveisAtual.includes(k)?'checked':''}> ${DIAS_SEMANA_LABEL[i]}</label>`).join('')}
          </div>
          <label>Horário (opcional)</label>
          <input type="text" id="meta-horario" placeholder="ex: 14h - 18h" value="${escapeHtml(plano?.horario || '')}">
          <label>Concursos prioritários (opcional)</label>
          <div class="dias-checkbox-row">
            <label class="dia-checkbox"><input type="checkbox" id="meta-concurso-transpetro" ${concursosPrioritariosAtual.includes('transpetro')?'checked':''}> Transpetro</label>
            <label class="dia-checkbox"><input type="checkbox" id="meta-concurso-inea" ${concursosPrioritariosAtual.includes('inea')?'checked':''}> INEA</label>
          </div>
        </details>

        <button id="semana-salvar" class="primary">Salvar meta</button>
      </div>`;

    const resumoMetaHtml = `
      <div class="card">
        <h3>Resumo da meta</h3>
        <div class="resumo-meta-item"><span class="stat-icon">📅</span><div><b>${diasAlvoAtual}</b><br><small class="muted">de 7 dias da semana</small></div></div>
        <div class="resumo-meta-item"><span class="stat-icon">⏱️</span><div><b>${horasAlvoAtual}h</b><br><small class="muted">de estudo na semana</small></div></div>
        <div class="resumo-meta-item"><span class="stat-icon">📚</span><div><b>${assuntosAtuais.length}</b><br><small class="muted">assuntos-alvo</small></div></div>
      </div>`;

    return `
      <div class="planejamento-screen">
        ${headerHtml}
        ${gradeHtml}
        <div class="grid-2">
          ${metaFormHtml}
          ${resumoMetaHtml}
        </div>
      </div>
      ${addAtividadeModalHtml}
    `;
  }

  function attachPlanejamentoHandlers(){
    document.getElementById('semana-anterior')?.addEventListener('click', () => {
      semanaVisualizada = addDays(semanaVisualizada, -7);
      metaAssuntosDraft = null;
      render();
    });
    document.getElementById('semana-proxima')?.addEventListener('click', () => {
      semanaVisualizada = addDays(semanaVisualizada, 7);
      metaAssuntosDraft = null;
      render();
    });

    document.querySelectorAll('[data-remover-assunto]').forEach(btn => {
      btn.addEventListener('click', () => {
        const plano = obterPlano(state, semanaVisualizada);
        if(metaAssuntosDraft === null) metaAssuntosDraft = [...(plano?.assuntosAlvo || [])];
        metaAssuntosDraft = metaAssuntosDraft.filter(a => a !== btn.dataset.removerAssunto);
        render();
      });
    });
    attachComboBusca('meta-assunto-busca', 'meta-assunto-hidden', 'meta-assunto-resultados');
    document.getElementById('meta-assunto-adicionar')?.addEventListener('click', () => {
      const assunto = resolverAssuntoBusca('meta-assunto-busca', 'meta-assunto-hidden');
      if(!assunto) return;
      const plano = obterPlano(state, semanaVisualizada);
      if(metaAssuntosDraft === null) metaAssuntosDraft = [...(plano?.assuntosAlvo || [])];
      if(!metaAssuntosDraft.includes(assunto)) metaAssuntosDraft.push(assunto);
      render();
    });

    document.getElementById('semana-salvar')?.addEventListener('click', () => {
      const plano = obterPlano(state, semanaVisualizada);
      const assuntosAlvo = metaAssuntosDraft !== null ? metaAssuntosDraft : (plano?.assuntosAlvo || []);
      const diasAlvo = Number(document.getElementById('meta-dias-alvo').value) || 0;
      const horasAlvo = Number(document.getElementById('meta-horas').value) || 0;
      const diasDisponiveis = DIAS_SEMANA_KEY.filter(k => document.getElementById(`meta-dia-${k}`)?.checked);
      const horario = document.getElementById('meta-horario').value.trim();
      const concursosPrioritarios = ['transpetro','inea'].filter(c => document.getElementById(`meta-concurso-${c}`)?.checked);
      salvarPlano(state, semanaVisualizada, { assuntosAlvo, diasAlvo, horasAlvo, diasDisponiveis, horario, concursosPrioritarios });
      saveState(state);
      metaAssuntosDraft = null;
      render();
    });

    document.querySelectorAll('[data-add-atividade]').forEach(btn => {
      btn.addEventListener('click', () => {
        atividadeDiaAberta = btn.dataset.addAtividade;
        render();
      });
    });
    document.getElementById('atividade-cancelar')?.addEventListener('click', () => {
      atividadeDiaAberta = null;
      render();
    });
    document.getElementById('add-atividade-backdrop')?.addEventListener('click', (e) => {
      if(e.target.id === 'add-atividade-backdrop'){ atividadeDiaAberta = null; render(); }
    });
    attachComboBusca('atividade-assunto-busca', 'atividade-assunto', 'atividade-assunto-resultados');
    document.getElementById('atividade-salvar')?.addEventListener('click', () => {
      const assunto = resolverAssuntoBusca('atividade-assunto-busca', 'atividade-assunto');
      const tipo = document.getElementById('atividade-tipo').value;
      const minutos = Number(document.getElementById('atividade-minutos').value) || 0;
      adicionarAtividadeDia(state, semanaVisualizada, atividadeDiaAberta, { assunto, tipo, minutos });
      saveState(state);
      atividadeDiaAberta = null;
      render();
    });

    document.querySelectorAll('[data-toggle-atividade]').forEach(btn => {
      btn.addEventListener('click', () => {
        alternarConcluidaAtividadeDia(state, semanaVisualizada, btn.dataset.toggleData, btn.dataset.toggleAtividade);
        saveState(state);
        render();
      });
    });
    document.querySelectorAll('[data-remover-atividade]').forEach(btn => {
      btn.addEventListener('click', () => {
        removerAtividadeDia(state, semanaVisualizada, btn.dataset.removerData, btn.dataset.removerAtividade);
        saveState(state);
        render();
      });
    });
    document.querySelectorAll('[data-meta-dia]').forEach(input => {
      input.addEventListener('change', () => {
        definirMetaMinutosDia(state, semanaVisualizada, input.dataset.metaDia, input.value);
        saveState(state);
        render();
      });
    });
  }
  function renderDesempenho(){
    const agregado = agregarPorAssunto(state.checkins, state.sessoes);
    const estudados = diasEstudados(state.checkins, state.sessoes);
    const ciclo = diasDeCiclo(state.meta.cicloInicio, hojeISO());
    const piores = piores5(agregado);
    const melhores = melhores5(agregado);
    return `
      <div class="card">
        <h2>Desempenho</h2>
        <p>${estudados} de ${ciclo} dias do ciclo estudados</p>
      </div>
      <div class="kpi-grid">
        <div class="card stat-card"><div class="stat-label">Total de questões</div><div class="stat-value">${totalQuestoes(state.checkins)}</div><div class="stat-icon">❓</div></div>
        <div class="card stat-card"><div class="stat-label">Horas estudadas</div><div class="stat-value">${totalHorasEstudadas(state.checkins, state.sessoes)}h</div><div class="stat-icon">⏱️</div></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <h3>% de acerto por disciplina</h3>
          ${agregado.length ? `<canvas id="chart-por-assunto" height="${Math.max(120, agregado.length*32)}"></canvas>` : '<p class="muted">Sem questões registradas ainda.</p>'}
        </div>
        <div class="card">
          <h3>Evolução do desempenho</h3>
          <canvas id="chart-evolucao" height="200"></canvas>
        </div>
        <div class="card">
          <h3>Melhores assuntos</h3>
          ${melhores.length ? melhores.map(p=>`<p>${escapeHtml(p.assunto)} — ${p.pct}%</p>`).join('') : '<p class="muted">Sem dados suficientes.</p>'}
        </div>
        <div class="card">
          <h3>Piores assuntos</h3>
          ${piores.length ? piores.map(p=>`<p>${escapeHtml(p.assunto)} — ${p.pct}%</p>`).join('') : '<p class="muted">Sem dados suficientes.</p>'}
        </div>
      </div>
    `;
  }

  function attachDesempenhoHandlers(){
    const agregado = agregarPorAssunto(state.checkins, state.sessoes);
    if(agregado.length){
      criarOuAtualizarChart('chart-por-assunto', {
        type: 'bar',
        data: { labels: agregado.map(a=>a.assunto), datasets:[{ data: agregado.map(a=>a.pct), backgroundColor: corAccent() }] },
        options: {
          indexAxis:'y', responsive:true, plugins:{legend:{display:false}},
          scales:{
            x:{min:0,max:100, ticks:{color:'#9aa0a6'}, grid:{color:'#2a2f3a'}},
            y:{ticks:{color:'#9aa0a6'}, grid:{display:false}}
          }
        }
      });
    }
    const evolucao = evolucaoSemanal(state.checkins, state.sessoes, hojeISO(), 12);
    criarOuAtualizarChart('chart-evolucao', {
      type: 'line',
      data: {
        labels: evolucao.map(b => b.semanaId.slice(5)),
        datasets: [{ data: evolucao.map(b => b.pct), spanGaps:false, borderColor: corAccent(), backgroundColor:'transparent', tension:.3 }]
      },
      options: {
        responsive:true, plugins:{legend:{display:false}},
        scales:{
          y:{min:0,max:100, ticks:{color:'#9aa0a6'}, grid:{color:'#2a2f3a'}},
          x:{ticks:{color:'#9aa0a6'}, grid:{display:false}}
        }
      }
    });
  }

  function renderScreen(){
    const app = document.getElementById('app');
    const openIdx = [...app.querySelectorAll('details')].reduce((acc,d,i)=>{ if(d.open) acc.push(i); return acc; }, []);
    const fieldValues = {};
    app.querySelectorAll('details input, details select, details textarea').forEach(el => { if(el.id) fieldValues[el.id] = el.value; });

    const map = {hoje:renderHoje, erros:renderErros, mapa:renderMapa, desempenho:renderDesempenho, dashboard:renderDashboard, config:renderConfig, planejamento:renderPlanejamento};
    app.innerHTML = map[currentTab]();
    if(currentTab==='hoje') attachHojeHandlers();
    if(currentTab==='erros') attachErrosHandlers();
    if(currentTab==='mapa') attachMapaHandlers();
    if(currentTab==='dashboard') attachDashboardHandlers();
    if(currentTab==='config') attachConfigHandlers();
    if(currentTab==='planejamento') attachPlanejamentoHandlers();
    if(currentTab==='desempenho') attachDesempenhoHandlers();

    app.querySelectorAll('details').forEach((d,i) => { if(openIdx.includes(i)) d.open = true; });
    Object.entries(fieldValues).forEach(([id,val]) => { const el = document.getElementById(id); if(el) el.value = val; });
  }

  function render(){ renderSidebar(); renderTabsNav(); renderScreen(); }

  attachSidebarHandlers();
  attachTabsHandlers();

  /* === INIT === */
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => reg.update())
        .catch(err => console.warn('SW falhou:', err));
    });
  }

  render();
  </script>
</body>
</html>
